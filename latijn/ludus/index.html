};
function startSentences(level){
  // shuffle the offline bank for this level so each session has a fresh order
  const bank=(SENTENCE_BANK[level]||[]).slice();
  QSE={level,recent:[],cur:null,answered:false,done:0,queue:shuffle(bank),fromBank:false};
  markPlayed("sentence");touchDay();go('sentences');
}
RENDER.sentences=function(){nextSentence();};
function nextSentence(){
  QSE.answered=false;
  // 1) Prefer an offline, pre-written sentence (free, instant, no quota)
  if(QSE.queue&&QSE.queue.length){
    const s=QSE.queue.shift();
    QSE.cur={latin:s.la,dutch:s.nl,note_nl:s.note};
    QSE.fromBank=true;
    drawSentence();
    return;
  }
  // 2) Bank exhausted — ask Gemini for a fresh one (if a key is set)
  if(!getKey()){
    // no key: just reshuffle the bank and keep going fully offline
    QSE.queue=shuffle((SENTENCE_BANK[QSE.level]||[]).slice());
    if(QSE.queue.length){return nextSentence();}
  }
  generateSentence();
}
async function generateSentence(){
  QSE.answered=false;QSE.fromBank=false;
  const L=SENT_LEVELS[QSE.level];
  app.innerHTML=gameTop(`${t("m_sentences")} · ${t(L.label)}`,"",`go('sentlevel')`)+`
  <div class="screen"><div class="card"><div class="kicker">${t(L.en)}</div>
  <div class="prompt"><div class="thinking"><span class="dot"></span><span class="dot"></span><span class="dot"></span> ${t("generating")}</div></div></div></div>`;
  // sample some vocab from the frequency list to steer the sentence
  const sample=shuffle(VOCAB.filter(w=>w.f<=400&&w.nl)).slice(0,24).map(w=>w.la).join(", ");
  const avoid=QSE.recent.slice(-6).join(" | ");
  const sys=`You are a Latin teacher for Dutch secondary-school pupils using the "Minerva" course. Create ONE original short Latin sentence to translate, then its natural Dutch model translation.
GRAMMAR LEVEL — strictly respect this: ${L.grammar}
Rules: use classical Latin; prefer high-frequency vocabulary; keep proper names simple (e.g. Marcus, Roma); the sentence must be grammatically correct and unambiguous; do not exceed the stated complexity for this level.
Reply ONLY JSON: {"latin":"<the Latin sentence>","dutch":"<natural Dutch translation>","note_nl":"<max 8-word Dutch hint about the key grammar, e.g. 'let op de A.c.I.'>"}`;
  const usr=`Draw mainly on words like: ${sample}. ${avoid?`Avoid repeating these sentences: ${avoid}.`:""} Make it different and interesting.`;
  try{
    const j=parseJSON(await callAI(sys,usr,1024));
    QSE.cur=j;QSE.recent.push(j.latin);
    drawSentence();
  }catch(e){
    // If Gemini fails, fall back to the offline bank rather than dead-ending
    const bank=shuffle((SENTENCE_BANK[QSE.level]||[]).slice());
    if(bank.length){
      QSE.queue=bank;return nextSentence();
    }
    const msg=e.message==="NO_KEY"?t("no_key"):(e.message==="RATE"?t("rate"):t("err"));
    app.innerHTML=gameTop(`${t("m_sentences")} · ${t(L.label)}`,"",`go('sentlevel')`)+`
    <div class="panel screen"><div class="note warn">${msg}</div>
    <button class="btn btn-gold btn-block" style="margin-top:14px" onclick="nextSentence()">${t("new_sentence")}</button></div>`;
  }
}
function drawSentence(){
  const L=SENT_LEVELS[QSE.level];const j=QSE.cur;
  app.innerHTML=gameTop(`${t("m_sentences")} · ${t(L.label)}`,"",`go('sentlevel')`)+`
  <div class="screen">
    <div class="card"><div class="kicker">${t("translate_sentence")}</div>
    <div style="font-family:'Cinzel',serif;font-weight:700;font-size:24px;color:#5a120c;margin:10px 0;line-height:1.3">${j.latin}</div></div>
    <div class="typewrap"><textarea id="seIn" placeholder="${t("type_ph")}" style="min-height:90px;text-align:left;font-size:17px"></textarea></div>
    <div id="sefeed"></div>
    <div class="btn-row" id="sebtns">
      <button class="btn btn-gold" style="flex:1" onclick="submitSentence()">${t("check_sentence")}</button>
      <button class="btn btn-ghost" onclick="nextSentence()">${t("skip")}</button>
    </div>
  </div>`;
  setTimeout(()=>{const el=document.getElementById("seIn");if(el)el.focus();},120);
}
// offline grading: compare key content words of the pupil's answer to the model
function localSentenceVerdict(ans,model){
  const stop=new Set(["de","het","een","en","of","maar","want","dat","die","dit","deze","hij","zij","ze","het","wij","jij","ik","de","in","op","met","van","te","tot","door","naar","aan","voor","niet","is","was","werd","wordt","zijn","heeft","had","om","zich","er"]);
  const words=s=>norm(s).split(" ").filter(w=>w.length>2&&!stop.has(w));
  const m=words(model), a=new Set(words(ans));
  if(!m.length)return "partly";
  let hit=0;m.forEach(w=>{if(a.has(w))hit++;});
  const ratio=hit/m.length;
  return ratio>=0.7?"correct":(ratio>=0.4?"partly":"wrong");
}
async function submitSentence(){
  if(QSE.answered)return;
  const el=document.getElementById("seIn");if(!el)return;
  const ans=el.value.trim();if(!ans){el.focus();return;}
  QSE.answered=true;
  const j=QSE.cur;
  // No key at all → grade offline immediately.
  if(!getKey()){
    sentenceResult(localSentenceVerdict(ans,j.dutch),"",ans,true);
    return;
  }
  document.getElementById("sebtns").innerHTML=`<div class="thinking"><span class="dot"></span><span class="dot"></span><span class="dot"></span> ${t("checking")}</div>`;
  const sys=`You mark a Dutch pupil's Dutch translation of a Latin sentence. Judge whether the MEANING and the GRAMMAR (tense, case roles, number, who-does-what) are rendered correctly. Be fair: accept synonyms, natural word-order differences and minor spelling slips; do not punish style. Mark "correct" only if fully right, "partly" if the gist is right but a grammatical detail is wrong (tense, a case, singular/plural, subject/object swapped), "wrong" if the meaning is off. Reply ONLY JSON in Dutch: {"verdict":"correct|partly|wrong","feedback":"<one short Dutch sentence explaining>"}`;
  const usr=`Latin: "${j.latin}"\nModel Dutch translation: "${j.dutch}"\nKey grammar: ${j.note_nl||""}\nPupil's Dutch answer: "${ans}"`;
  try{
    const r=parseJSON(await callAI(sys,usr,1024));
    sentenceResult(r.verdict,r.feedback||"",ans);
  }catch(e){
    // Gemini unavailable → grade offline so the student is never blocked
    sentenceResult(localSentenceVerdict(ans,j.dutch), e.message==="RATE"?t("rate"):t("couldnt_check"), ans, true);
  }
}
function sentenceResult(verdict,feedback,ans,offline){
  const j=QSE.cur;const fd=document.getElementById("sefeed"),btns=document.getElementById("sebtns");
  let cls,title,pts;
  if(verdict==="correct"){cls="ok";title=t("sentence_correct");pts={easy:10,medium:15,hard:22,expert:30}[QSE.level];beep("good");}
  else if(verdict==="partly"){cls="hint";title=t("sentence_partly");pts={easy:4,medium:6,hard:9,expert:12}[QSE.level];beep("good");}
  else{cls="no";title=t("sentence_wrong");pts=0;beep("bad");}
  if(pts>0){QSE.done++;addPoints(pts);if(verdict==="correct"){S.correctTotal++;S.sentCorrect=(S.sentCorrect||0)+1;if(QSE.level==="expert")S.expertDone=true;save();checkAchievements();}}
  fd.innerHTML=`<div class="feedback ${cls}"><b>${title}</b> ${feedback}
    <div style="margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.15)">
    <span style="opacity:.8">${t("model_translation")}:</span><br><b>${j.dutch}</b>${j.note_nl?`<br><span style="opacity:.7;font-size:13px">${j.note_nl}</span>`:''}</div></div>`;
  btns.innerHTML=`<button class="btn btn-gold btn-block" onclick="nextSentence()">${t("new_sentence")}</button>`;
}

/* ============================ AUDIO: MUSIC + SFX ============================ */
let audioReady=false, musicParts=[], musicSynths=[], sfxSynth=null;
async function ensureAudio(){
  if(audioReady||typeof Tone==="undefined")return audioReady;
  try{await Tone.start();audioReady=true;}catch(e){}
  return audioReady;
}
function disposeMusic(){
  musicParts.forEach(p=>{try{p.stop();p.dispose();}catch(e){}});
  musicSynths.forEach(s=>{try{s.dispose();}catch(e){}});
  musicParts=[];musicSynths=[];
}
function buildMusic(){
  if(typeof Tone==="undefined"||musicParts.length)return;
  const skin=S.music_skin||"music_martial";
  const reverb=new Tone.Reverb({decay:4,wet:.35}).toDestination();
  const vol=new Tone.Volume(-12).connect(reverb);

  if(skin==="music_lyre"){
    // gentle plucked lyre: arpeggios in a soft minor mode
    const lyre=new Tone.PluckSynth({volume:-8,attackNoise:1,dampening:3500,resonance:.9}).connect(vol);
    const notes=["A3","C4","E4","A4","E4","C4","D4","F4","A4","D5","A4","F4"];
    let i=0;const seq=new Tone.Loop(time=>{lyre.triggerAttackRelease(notes[i%notes.length],"8n",time);i++;},"4n");
    const droneS=new Tone.AMSynth({volume:-22,envelope:{attack:3,release:4}}).connect(vol);
    const drone=new Tone.Loop(time=>{droneS.triggerAttackRelease("A2","2m",time);},"2m");
    Tone.Transport.bpm.value=72;drone.start(0);seq.start("1m");
    musicParts=[seq,drone];musicSynths=[lyre,droneS,reverb,vol];
  }
  else if(skin==="music_flute"){
    // airy tibia/flute melody, calm and breathy
    const flute=new Tone.MonoSynth({volume:-12,oscillator:{type:"triangle"},
      envelope:{attack:.12,decay:.2,sustain:.7,release:.5},
      filter:{type:"lowpass",Q:1},filterEnvelope:{attack:.1,baseFrequency:600,octaves:2}}).connect(vol);
    const motif=[["A4","4n"],["B4","8n"],["C5","4n"],["B4","8n"],["A4","4n"],["E4","2n"],
                 ["G4","4n"],["A4","8n"],["B4","4n"],["A4","2n"],[null,"4n"]];
    let i=0;const seq=new Tone.Loop(time=>{const[n,d]=motif[i%motif.length];i++;if(n)flute.triggerAttackRelease(n,d,time);},"4n");
    const padS=new Tone.PolySynth(Tone.Synth,{volume:-26,envelope:{attack:2,release:3}}).connect(vol);
    const pad=new Tone.Loop(time=>{padS.triggerAttackRelease(["A2","E3"],"2m",time);},"2m");
    Tone.Transport.bpm.value=66;pad.start(0);seq.start("2n");
    musicParts=[seq,pad];musicSynths=[flute,padS,reverb,vol];
  }
  else if(skin==="music_drums"){
    // driving war drums, sparse low horn
    const kick=new Tone.MembraneSynth({volume:-4,octaves:5,pitchDecay:.06}).connect(vol);
    const tom=new Tone.MembraneSynth({volume:-8,octaves:3,pitchDecay:.08}).connect(vol);
    let b=0;const drum=new Tone.Loop(time=>{const s=b%8;
      if(s===0||s===3||s===6)kick.triggerAttackRelease("C2","8n",time);
      if(s===4)tom.triggerAttackRelease("G2","8n",time);b++;},"8n");
    const hornS=new Tone.FMSynth({volume:-16,harmonicity:1.2,envelope:{attack:.3,release:1.2}}).connect(vol);
    const horn=new Tone.Loop(time=>{hornS.triggerAttackRelease("D3","1m",time);},"2m");
    Tone.Transport.bpm.value=96;drum.start(0);horn.start("1m");
    musicParts=[drum,horn];musicSynths=[kick,tom,hornS,reverb,vol];
  }
  else{
    // default martial march (original)
    const drone=new Tone.PolySynth(Tone.FMSynth,{volume:-16,harmonicity:1.5,modulationIndex:4,
      envelope:{attack:2,release:3},oscillator:{type:"sine"}}).connect(vol);
    const droneLoop=new Tone.Loop(time=>{drone.triggerAttackRelease(["D2","A2"],"2m",time);},"2m");
    const lead=new Tone.MonoSynth({volume:-14,oscillator:{type:"sawtooth"},
      filter:{Q:2,type:"lowpass"},filterEnvelope:{attack:.02,baseFrequency:300,octaves:3,release:.4},
      envelope:{attack:.04,decay:.2,sustain:.4,release:.4}}).connect(vol);
    const motif=[["D4","8n"],["Eb4","8n"],["F4","4n"],["D4","8n"],["A3","4n"],[null,"4n"],
                 ["F4","8n"],["Eb4","8n"],["D4","2n"],[null,"4n"]];
    let mi=0;const leadSeq=new Tone.Loop(time=>{const[n,d]=motif[mi%motif.length];mi++;if(n)lead.triggerAttackRelease(n,d,time);},"4n");
    const kick=new Tone.MembraneSynth({volume:-8,octaves:4,pitchDecay:.05}).connect(vol);
    const snare=new Tone.NoiseSynth({volume:-20,noise:{type:"white"},envelope:{attack:.001,decay:.12,sustain:0}}).connect(vol);
    let bi=0;const drum=new Tone.Loop(time=>{const step=bi%8;
      if(step===0||step===4)kick.triggerAttackRelease("C2","8n",time);
      if(step===2||step===6)snare.triggerAttackRelease("16n",time);bi++;},"8n");
    Tone.Transport.bpm.value=84;droneLoop.start(0);leadSeq.start("2m");drum.start("1m");
    musicParts=[droneLoop,leadSeq,drum];musicSynths=[drone,lead,kick,snare,reverb,vol];
  }
}
async function rebuildMusic(){
  if(typeof Tone==="undefined")return;
  await ensureAudio();
  Tone.Transport.pause();disposeMusic();buildMusic();
  if(S.music)Tone.Transport.start();
}
async function previewMusic(id){
  // temporarily switch skin and play a short taste, even if music is off
  await ensureAudio();
  const wasOn=S.music, prev=S.music_skin;
  S.music_skin=id;Tone.Transport.pause();disposeMusic();buildMusic();Tone.Transport.start();
  setTimeout(()=>{
    if(!S.music){Tone.Transport.pause();disposeMusic();S.music_skin=prev;buildMusic();}
  },3500);
}
async function toggleMusic(){
  S.music=!S.music;save();
  if(S.music){
    await ensureAudio();buildMusic();
    if(typeof Tone!=="undefined"){Tone.Transport.start();}
  }else{
    if(typeof Tone!=="undefined"){Tone.Transport.pause();}
  }
  reflectMusic();
  if(CURRENT==="settings")RENDER.settings();
}
function reflectMusic(){
  const fab=document.getElementById("musicFab");
  fab.classList.toggle("playing",S.music);
  document.getElementById("musicIcon").innerHTML=S.music
    ?`<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>`
    :`<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/><path d="M3 3l18 18" stroke-width="2"/>`;
}
async function beep(kind){
  if(typeof Tone==="undefined")return;
  if(!audioReady)return; // only after first gesture
  if(!sfxSynth)sfxSynth=new Tone.Synth({volume:-10,oscillator:{type:"triangle"},envelope:{attack:.005,decay:.15,sustain:0,release:.1}}).toDestination();
  const now=Tone.now();
  try{
    if(kind==="good"){sfxSynth.triggerAttackRelease("C5",.09,now);sfxSynth.triggerAttackRelease("G5",.12,now+.09);}
    else if(kind==="bad"){sfxSynth.triggerAttackRelease("A3",.18,now);}
    else if(kind==="ach"){sfxSynth.triggerAttackRelease("E5",.08,now);sfxSynth.triggerAttackRelease("A5",.08,now+.08);sfxSynth.triggerAttackRelease("C6",.16,now+.16);}
    else if(kind==="rank"){sfxSynth.triggerAttackRelease("C5",.1,now);sfxSynth.triggerAttackRelease("E5",.1,now+.1);sfxSynth.triggerAttackRelease("G5",.1,now+.2);sfxSynth.triggerAttackRelease("C6",.22,now+.3);}
  }catch(e){}
}
// unlock audio on first interaction so SFX work even before music is toggled
document.addEventListener("pointerdown",function once(){ensureAudio();document.removeEventListener("pointerdown",once);},{once:true});

/* ============================ INIT ============================ */
const app=document.getElementById("app");
function init(){
  applyTheme(S.theme||"theme_classic");
  applyNavLabels();
  reflectMusic();
  // refresh streak on load (handles a missed-day reset visually next practice)
  if(S.lastDay){
    const gap=daysBetween(S.lastDay,todayStr());
    if(gap>1){S.streak=0;/* will become 1 on next practice */}
  }
  if(S.todayDay!==todayStr()){S.todayDay=todayStr();S.todaySeconds=0;}
  save();
  checkAchievements();
  go('home');
}
init();
