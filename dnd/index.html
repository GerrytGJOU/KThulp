<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Midden-aarde</title>
<style>
:root{--bg:#14110f;--panel:#201b17;--panel2:#2a231d;--gold:#c8a24a;--text:#ece3d0;--mute:#9a8f7a;--red:#a8432f;--ok:#6a9a5a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Palatino,"Palatino Linotype","Book Antiqua",Georgia,serif;font-size:16px}
body{display:flex;flex-direction:column}
.portal-back{position:fixed;top:8px;left:8px;z-index:9999;width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:var(--panel);border:1px solid var(--gold);border-radius:50%;color:var(--gold)}
header{padding:10px 12px 8px 52px;border-bottom:1px solid #3a3027;display:flex;justify-content:space-between;align-items:center;gap:8px}
header h1{font-size:18px;margin:0;color:var(--gold)}
header small{color:var(--mute)}
main{flex:1;min-height:0;display:flex;flex-direction:column}
.tab{display:none;flex:1;min-height:0;flex-direction:column}
.tab.on{display:flex}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:10px 12px}
nav{display:flex;border-top:1px solid #3a3027;background:var(--panel)}
nav button{flex:1;background:none;border:0;color:var(--mute);padding:12px 4px;font:inherit;font-size:14px}
nav button.on{color:var(--gold);border-top:2px solid var(--gold);margin-top:-1px}
.msg{margin:0 0 12px;padding:10px 12px;border-radius:8px;background:var(--panel);line-height:1.45;word-wrap:break-word}
.msg.dm{border-left:3px solid var(--gold);background:var(--panel2)}
.msg.action{border-left:3px solid #5b7fa8}
.msg.system{color:var(--mute);font-style:italic;background:none;padding:2px 12px}
.msg .who{font-size:12px;color:var(--gold);margin-bottom:3px;text-transform:uppercase;letter-spacing:.05em}
.msg.ooc .who{color:#8aa}
.status{padding:8px 12px;background:var(--panel);border-top:1px solid #3a3027;font-size:14px}
.status b{color:var(--gold)}
.compose{padding:8px 12px 10px;background:var(--panel);display:flex;flex-direction:column;gap:6px}
textarea,input[type=text],input[type=password],input[type=number],select{width:100%;background:#0f0d0b;color:var(--text);border:1px solid #4a3d30;border-radius:6px;padding:9px;font:inherit;font-size:16px}
textarea{resize:vertical;min-height:70px}
.row{display:flex;gap:6px;flex-wrap:wrap}
button.b,label.b{background:var(--gold);color:#1a140c;border:0;border-radius:6px;padding:9px 14px;font:inherit;font-weight:bold;cursor:pointer;display:inline-block}
button.b.alt,label.b.alt{background:#3a3027;color:var(--text)}
button.b.red{background:var(--red);color:#fff}
button:disabled{opacity:.4}
pre{white-space:pre-wrap;word-break:break-word;background:#0f0d0b;padding:10px;border-radius:6px;font-size:13px}
.card{background:var(--panel);border-radius:8px;padding:10px 12px;margin-bottom:10px}
.card h3{margin:0 0 6px;color:var(--gold);font-size:16px}
.center{margin:auto;max-width:420px;padding:24px;text-align:center}
.err{color:#e08a76}
footer{text-align:center;color:var(--mute);font-size:12px;padding:4px 0 6px}
h2{color:var(--gold);font-size:17px;margin:14px 0 6px}
</style>
</head>

<a class="portal-back" href="../" aria-label="Terug naar portaal"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a>
<header><h1>⚔ Midden-aarde</h1><small id="who"></small></header>
<main id="main"><div class="center" id="boot">Laden…</div></main>
<footer>Midden-aarde D&amp;D · &copy; Gerben de Jong · 2026</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script>
"use strict";
firebase.initializeApp({
  apiKey:"AIzaSyC1P5vws3RKt2Dl9Nnfz8OCPV2KRS55w_U",
  authDomain:"kthulp-certamen.firebaseapp.com",
  databaseURL:"https://kthulp-certamen-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"kthulp-certamen",
  appId:"1:16556837470:web:ea3f4ba28bd00630c582cf"
});
const auth=firebase.auth(), db=firebase.database();
const $=s=>document.querySelector(s);
const main=$('#main');

let me=null;            // {uid,name}
let turn=null, stateStr="{}", cfg={}, canon={}, msgs=[], oocs=[], pending={};
let tab='game', draft="", rollDraft="", oocDraft="";
const LEASE_MS=3*60*1000;

/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function md(s){
  return esc(s||"").replace(/^### (.*)$/gm,'<b>$1</b>').replace(/^## (.*)$/gm,'<b>$1</b>').replace(/^# (.*)$/gm,'<b>$1</b>')
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/\n/g,'<br>');
}
function awaitingNames(){return turn&&turn.awaiting?Object.keys(turn.awaiting):[]}
function deepMerge(t,p){
  if(p===null||typeof p!=='object'||Array.isArray(p)) return p;
  const out=(t&&typeof t==='object'&&!Array.isArray(t))?{...t}:{};
  for(const k of Object.keys(p)){
    if(p[k]===null) delete out[k]; else out[k]=deepMerge(out[k],p[k]);
  }
  return out;
}
function sysMsg(text){return {type:'system',author:'systeem',text,t:Date.now()}}

/* ---------- login ---------- */
auth.getRedirectResult().catch(e=>{window._loginErr=e.message});
auth.onAuthStateChanged(async u=>{
  if(!u){ showLogin(); return; }
  try{
    const snap=await db.ref('dndAccess/'+u.uid).get();
    let val=snap.exists()?snap.val():null;
    if(val===null&&u.email){
      const es=await db.ref('dndAccessEmail/'+u.email.toLowerCase().replace(/\./g,',')).get();
      if(es.exists()) val=es.val();
    }
    if(val===null){ showNoAccess(u); return; }
    me={uid:u.uid,name:String(val===true?(u.displayName||'Speler'):val)};
    $('#who').textContent=me.name+' · ';
    const a=document.createElement('a');a.href='#';a.textContent='uitloggen';a.style.color='var(--mute)';
    a.onclick=e=>{e.preventDefault();auth.signOut()};$('#who').appendChild(a);
    startApp();
  }catch(e){ showNoAccess(u,e.message); }
});
function showLogin(){
  main.innerHTML='<div class="center"><p>Alleen voor Gerben en Maurits.</p><button class="b" id="gl">Inloggen met Google</button><p class="err">'+esc(window._loginErr||'')+'</p></div>';
  $('#gl').onclick=()=>auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider());
}
function showNoAccess(u,extra){
  main.innerHTML='<div class="center"><p><b>Geen toegang.</b></p><p>Je bent ingelogd als '+esc(u.email||'')+'.<br>Stuur dit UID naar Gerben:</p><pre>'+esc(u.uid)+'</pre><p class="err">'+esc(extra||'')+'</p><button class="b alt" id="lo">Uitloggen</button></div>';
  $('#lo').onclick=()=>auth.signOut();
}

/* ---------- app ---------- */
let started=false;
function startApp(){
  if(started) return; started=true;
  main.innerHTML=`
  <section class="tab" id="t-game"><div class="scroll" id="thread"></div><div id="statusbar" class="status"></div><div id="compose" class="compose"></div></section>
  <section class="tab" id="t-ooc"><div class="scroll" id="oocthread"></div><div class="compose"><div class="row"><input type="text" id="oocin" placeholder="Praat met je broer (de DM leest dit niet)" style="flex:1"><button class="b" id="oocsend">Stuur</button></div></div></section>
  <section class="tab" id="t-stand"><div class="scroll" id="standbox"></div></section>
  <section class="tab" id="t-canon"><div class="scroll" id="canonbox"></div></section>
  <section class="tab" id="t-set"><div class="scroll" id="setbox"></div></section>
  <nav><button data-t="game">Spel</button><button data-t="ooc">Chat</button><button data-t="stand">Stand</button><button data-t="canon">Canon</button><button data-t="set">⚙</button></nav>`;
  document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>setTab(b.dataset.t));
  $('#oocsend').onclick=sendOoc;
  $('#oocin').onkeydown=e=>{if(e.key==='Enter')sendOoc()};
  db.ref('dnd/turn').on('value',s=>{turn=s.val();renderGame()});
  db.ref('dnd/state').on('value',s=>{stateStr=s.val()||"{}";if(tab==='stand')renderStand()});
  db.ref('dnd/config').on('value',s=>{cfg=s.val()||{};if(tab==='set')renderSet()});
  db.ref('dnd/canon').on('value',s=>{canon=s.val()||{};if(tab==='canon')renderCanon()});
  db.ref('dnd/pending').on('value',s=>{pending=s.val()||{};renderGame()});
  db.ref('dnd/messages').limitToLast(300).on('value',s=>{msgs=[];s.forEach(c=>{msgs.push(c.val())});renderGame()});
  db.ref('dnd/ooc').limitToLast(200).on('value',s=>{oocs=[];s.forEach(c=>{oocs.push(c.val())});renderOoc()});
  setTab('game');
  setInterval(()=>{if(turn&&turn.status==='resolving')renderGame()},15000);
}
function setTab(t){
  tab=t;
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.id==='t-'+t));
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.t===t));
  ({game:renderGame,ooc:renderOoc,stand:renderStand,canon:renderCanon,set:renderSet})[t]();
}

/* ---------- spel ---------- */
function renderGame(){
  if(!me||tab!=='game') return;
  const th=$('#thread');
  const atBottom=th.scrollHeight-th.scrollTop-th.clientHeight<80;
  th.innerHTML=msgs.map(m=>{
    const cls=m.type==='narration'?'dm':m.type==='action'||m.type==='pass'?'action':m.type==='system'?'system':'';
    const who=m.type==='narration'?'De DM':m.type==='system'?'':esc(m.author||'');
    return '<div class="msg '+cls+'">'+(who?'<div class="who">'+who+'</div>':'')+md(m.text)+'</div>';
  }).join('')||'<div class="msg system">Nog geen verhaal.</div>';
  if(atBottom) th.scrollTop=th.scrollHeight;

  const sb=$('#statusbar'), cp=$('#compose');
  const keepDraft=document.activeElement&&document.activeElement.id==='act';
  if(!turn){
    sb.innerHTML='Nog geen campagne gestart.';
    cp.innerHTML='<button class="b" id="startc">Start campagne (DM opent het verhaal)</button>';
    $('#startc').onclick=startCampaign; return;
  }
  const aw=awaitingNames(), mine=pending[me.uid]&&pending[me.uid].round===turn.round?pending[me.uid]:null;
  const myTurn=aw.includes(me.name);
  if(turn.status==='resolving'){
    const stuck=turn.resolvingSince&&Date.now()-turn.resolvingSince>LEASE_MS;
    sb.innerHTML='De DM vertelt…'+(stuck?' (duurt lang)':'');
    cp.innerHTML=stuck?'<button class="b red" id="retry">Opnieuw proberen</button>':'';
    if(stuck)$('#retry').onclick=()=>resolve(true); return;
  }
  if(turn.status==='error'){
    sb.innerHTML='<span class="err">Fout: '+esc(turn.lastError||'onbekend')+'</span>';
    cp.innerHTML='<button class="b red" id="retry">Opnieuw proberen</button>';
    $('#retry').onclick=()=>resolve(true); return;
  }
  const others=aw.filter(n=>n!==me.name);
  let st='<b>➡️ '+esc(turn.prompt||'Aan zet')+'</b>';
  st+='<br><small>Ronde '+turn.round+' · Wacht op: '+(aw.length?esc(aw.join(', ')):'—')+'</small>';
  const checks=turn.checks&&turn.checks[me.name];
  if(checks) st+='<br>🎲 <b>Worp gevraagd:</b> '+esc(checks);
  if(!turn.blind){
    const seen=Object.values(pending).filter(p=>p.round===turn.round&&p.name!==me.name);
    seen.forEach(p=>{st+='<br><small>'+esc(p.name)+': '+esc(p.text)+'</small>'});
  } else {
    const n=Object.values(pending).filter(p=>p.round===turn.round&&p.name!==me.name).length;
    if(n) st+='<br><small>(blind) De ander heeft ingediend.</small>';
  }
  sb.innerHTML=st;
  if(!myTurn&&!mine){
    cp.innerHTML=others.length?'<small>Niet jouw beurt.</small>':'';
    return;
  }
  if(!keepDraft){
    cp.innerHTML=`<textarea id="act" placeholder="Wat doe je?"></textarea>
    <div class="row"><input type="text" id="roll" placeholder="Worp (bv. nat 14 +3)" style="flex:1;min-width:120px"></div>
    <div class="row"><button class="b" id="send">${mine?'Actie aanpassen':'Verstuur'}</button><button class="b alt" id="pass">Ik pas</button>
    ${others.length?'<button class="b alt" id="skip">Zonder '+esc(others.join(', '))+' verder</button>':''}</div>
    ${mine?'<small>Ingediend: '+esc(mine.text)+'</small>':''}`;
    $('#act').value=draft;$('#roll').value=rollDraft;
    $('#act').oninput=e=>draft=e.target.value;$('#roll').oninput=e=>rollDraft=e.target.value;
    $('#send').onclick=()=>submit(false);
    $('#pass').onclick=()=>submit(true);
    const sk=$('#skip'); if(sk) sk.onclick=skipOthers;
  }
}
async function submit(pass){
  const text=pass?'(past / wacht af)':draft.trim();
  if(!text){alert('Typ eerst een actie.');return}
  const round=turn.round, full=text+(rollDraft.trim()&&!pass?'  [worp: '+rollDraft.trim()+']':'');
  await db.ref('dnd/pending/'+me.uid).set({round,name:me.name,text:full,pass:!!pass,t:Date.now()});
  draft="";rollDraft="";
  const ok=await removeAwaiting(me.name,round);
  if(ok==='resolve') resolve(false);
  else if(ok==='late') alert('Te laat: de ronde is al afgehandeld. Ververs de pagina.');
  else{ $('#compose').innerHTML=''; renderGame(); }
}
// haalt een naam uit awaiting; geeft 'resolve' terug als wij nu moeten afhandelen
async function removeAwaiting(name,round){
  let became=false,late=false;
  const r=await db.ref('dnd/turn').transaction(t=>{
    if(!t||t.round!==round||t.status!=='waiting'){late=true;return;}
    late=false;became=false;
    if(t.awaiting&&t.awaiting[name]){
      delete t.awaiting[name];
      if(!Object.keys(t.awaiting).length){t.awaiting=null;}
    }
    if(!t.awaiting){t.status='resolving';t.resolvingSince=Date.now();became=true;}
    return t;
  });
  if(!r.committed) return 'late';
  return became?'resolve':'ok';
}
async function skipOthers(){
  const others=awaitingNames().filter(n=>n!==me.name);
  if(!confirm('Doorgaan zonder '+others.join(', ')+'? Die doet dan niets deze ronde.')) return;
  if(!(pending[me.uid]&&pending[me.uid].round===turn.round)){
    await db.ref('dnd/pending/'+me.uid).set({round:turn.round,name:me.name,text:draft.trim()||'(past / wacht af)',pass:!draft.trim(),t:Date.now()});
  }
  await db.ref('dnd/messages').push(sysMsg(others.join(', ')+' wordt overgeslagen deze ronde.'));
  let res='ok';
  for(const n of [...others,me.name]) res=await removeAwaiting(n,turn.round);
  if(res==='resolve') resolve(false);
}
async function startCampaign(){
  if(!cfg.geminiKey){alert('Zet eerst je Gemini-sleutel bij ⚙.');setTab('set');return}
  if(!Object.keys(canon).length&&!confirm('Er is nog geen canon. Toch starten?'))return;
  await db.ref('dnd/turn').set({round:0,status:'resolving',resolvingSince:Date.now(),awaiting:null});
  resolve(false);
}

/* ---------- DM-motor ---------- */
const SYSTEM=`Je bent de Dungeon Master van een doorlopende D&D 5e (2024)-campagne in Midden-aarde met twee spelers (PC's). Schrijf in het Nederlands, met Engelse 2024-spelregeltermen.
Regels:
- Bronnenhiërarchie: (1) CANON (spelregels en personages) (2) LOGBOEK (3) de actuele STAND (4) rest. Verzin geen feiten over het verleden die hiermee botsen.
- Speel NOOIT een PC. Beslis niet voor de spelers wat hun personage doet of zegt.
- Tolkien-personages overschaduwen de PC's niet.
- Spelers rollen zelf fysiek; hun worp staat in hun actie ("[worp: ...]"). Vraag een check via nextTurn.checks (naam → welke check en waarom); verklap DC's niet.
- Voor worpen van NPC's/vijanden gebruik je UITSLUITEND de meegegeven voorgegooide dobbelstenen, in volgorde (d20 voor aanvallen/checks/saves, d6/d8/d10/d12 voor schade). Noem de worp kort in de vertelling.
- Als beide spelers moeten reageren zet je beide namen in awaiting; bij combat de volgende speler; bij een enkele speler alleen die naam.
- Houd de STAND bij via statePatch (deep merge; null verwijdert een sleutel; lijsten worden vervangen). Houd bij: inGame (date, timeOfDay), pcs (location, hp, conditions, inventory, knowledge), companions, npcs, factions, quests, initiative.
- logEntries: korte feiten van wat NU echt gebeurd is.
Antwoord ALLEEN met JSON in dit formaat:
{"narration":"markdown-tekst","statePatch":{},"logEntries":[{"fact":"","inGameDate":""}],"nextTurn":{"awaiting":["Naam"],"blind":false,"prompt":"korte vraag aan de spelers","checks":{"Naam":"Perception, omdat ..."}}}`;

function rollDice(){
  const r=(s,n)=>Array.from({length:n},()=>1+crypto.getRandomValues(new Uint32Array(1))[0]%s);
  return {d20:r(20,20),d12:r(12,6),d10:r(10,6),d8:r(8,8),d6:r(6,10),d4:r(4,6)};
}
async function callGemini(sys,user,retryNote){
  const model=cfg.model||'gemini-2.5-flash';
  const body={
    systemInstruction:{parts:[{text:sys}]},
    contents:[{role:'user',parts:[{text:user+(retryNote?'\n\nLET OP: je vorige antwoord was ongeldig ('+retryNote+'). Antwoord nu met geldige JSON.':'')}]}],
    generationConfig:{responseMimeType:'application/json',temperature:cfg.temperature!=null?Number(cfg.temperature):0.9,thinkingConfig:{thinkingBudget:0}}
  };
  const res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent',{
    method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':cfg.geminiKey},body:JSON.stringify(body)});
  const j=await res.json();
  if(!res.ok) throw new Error('Gemini '+res.status+': '+((j.error&&j.error.message)||'fout'));
  const c=j.candidates&&j.candidates[0];
  const txt=c&&c.content&&c.content.parts&&c.content.parts.map(p=>p.text||'').join('');
  if(!txt) throw new Error('Leeg antwoord ('+(c&&c.finishReason||'geen kandidaat')+')');
  return {txt,usage:j.usageMetadata||{}};
}
function parseDM(txt,names){
  let o=JSON.parse(txt.replace(/^```(?:json)?\s*/,'').replace(/```\s*$/,''));
  if(typeof o.narration!=='string'||!o.narration) throw new Error('narration ontbreekt');
  o.statePatch=o.statePatch&&typeof o.statePatch==='object'?o.statePatch:{};
  o.logEntries=Array.isArray(o.logEntries)?o.logEntries:[];
  const nt=o.nextTurn||{};
  let aw=Array.isArray(nt.awaiting)?nt.awaiting.filter(n=>names.includes(n)):[];
  if(!aw.length) aw=names.slice();
  o.nextTurn={awaiting:aw,blind:!!nt.blind,prompt:String(nt.prompt||'Wat doen jullie?'),checks:nt.checks&&typeof nt.checks==='object'?nt.checks:null};
  return o;
}
let resolving=false;
async function resolve(retry){
  if(resolving) return; resolving=true;
  try{
    if(retry){ await db.ref('dnd/turn').update({status:'resolving',resolvingSince:Date.now(),lastError:null}); }
    const t=(await db.ref('dnd/turn').get()).val();
    const round=t.round;
    const [pS,sS,cS,mS,lS,aS,cfS]=await Promise.all(['pending','state','canon','messages','log','dndAccess','config'].map(k=>k==='dndAccess'?Promise.resolve(null):db.ref('dnd/'+k).get()));
    if(cfS) cfg=cfS.val()||cfg;
    if(!cfg.geminiKey) throw new Error('Geen Gemini-sleutel ingesteld (⚙).');
    const pend=Object.values(pS.val()||{}).filter(p=>p.round===round).sort((a,b)=>a.t-b.t);
    const names=[...new Set([...(t.known||[]),...pend.map(p=>p.name),me.name])];
    // namen van beide spelers: bewaar in dnd/players
    const pl=(await db.ref('dnd/players').get()).val()||{};
    pl[me.uid]=me.name; db.ref('dnd/players/'+me.uid).set(me.name);
    const allNames=[...new Set(Object.values(pl))];
    const state=JSON.parse(sS.val()||'{}');
    const canonTxt=Object.values(cS.val()||{}).map(d=>'### '+d.title+'\n'+d.text).join('\n\n');
    const recent=[];mS.forEach(c=>{recent.push(c.val())});
    const hist=recent.slice(-30).filter(m=>m.type!=='system').map(m=>(m.type==='narration'?'DM':m.author)+': '+m.text).join('\n\n');
    const logs=[];lS.forEach(c=>{logs.push(c.val())});
    const user=
`# SPELERS\n${allNames.join(', ')}\n\n# CANON\n${canonTxt||'(nog leeg)'}\n\n# LOGBOEK (laatste 60)\n${logs.slice(-60).map(l=>'- ['+(l.inGameDate||'')+'] '+l.fact).join('\n')||'(leeg)'}\n\n# ACTUELE STAND\n${JSON.stringify(state)}\n\n# RECENTE GESCHIEDENIS\n${hist||'(begin van het verhaal)'}\n\n# VOORGEGOOIDE DOBBELSTENEN VOOR NPC/VIJAND (in volgorde gebruiken)\n${JSON.stringify(rollDice())}\n\n# ACTIES DEZE RONDE\n${pend.length?pend.map(p=>p.name+': '+p.text).join('\n'):'(geen: open het verhaal met de startsituatie uit canon/stand)'}`;
    let out,usage,note=null;
    for(let i=0;i<2;i++){
      const r=await callGemini(SYSTEM,user,note);usage=r.usage;
      try{out=parseDM(r.txt,allNames);break}catch(e){note=e.message;if(i===1)throw new Error('Ongeldige DM-uitvoer: '+note)}
    }
    const newState=deepMerge(state,out.statePatch);
    const up={};const now=Date.now();
    pend.forEach((p,i)=>{const k=db.ref('dnd/messages').push().key;up['dnd/messages/'+k]={type:p.pass?'pass':'action',author:p.name,text:p.text,round,t:now+i}});
    const nk=db.ref('dnd/messages').push().key;
    up['dnd/messages/'+nk]={type:'narration',author:'dm',text:out.narration,round:round+1,t:now+pend.length+1};
    out.logEntries.forEach(l=>{if(l&&l.fact){const k=db.ref('dnd/log').push().key;up['dnd/log/'+k]={fact:String(l.fact),inGameDate:String(l.inGameDate||''),round:round+1,t:now}}});
    const sj=JSON.stringify(newState);
    up['dnd/state']=sj;
    up['dnd/stands/'+String(round+1).padStart(5,'0')]={json:sj,round:round+1,t:now};
    up['dnd/usage/'+String(round+1).padStart(5,'0')]={prompt:usage.promptTokenCount||0,out:usage.candidatesTokenCount||0,model:cfg.model||'gemini-2.5-flash'};
    up['dnd/pending']=null;
    const aw={};out.nextTurn.awaiting.forEach(n=>aw[n]=true);
    up['dnd/turn']={round:round+1,status:'waiting',awaiting:aw,prompt:out.nextTurn.prompt,blind:out.nextTurn.blind,checks:out.nextTurn.checks||null,mode:out.nextTurn.awaiting.length>1?'all':'single'};
    await db.ref().update(up);
  }catch(e){
    console.error(e);
    await db.ref('dnd/turn').update({status:'error',lastError:String(e.message||e),resolvingSince:null});
  }finally{ resolving=false; }
}

/* ---------- OOC ---------- */
function sendOoc(){
  const i=$('#oocin'),v=i.value.trim(); if(!v) return; i.value='';
  db.ref('dnd/ooc').push({author:me.name,text:v,t:Date.now()});
}
function renderOoc(){
  if(!me||tab!=='ooc') return;
  const th=$('#oocthread');
  th.innerHTML=oocs.map(m=>'<div class="msg ooc"><div class="who">'+esc(m.author)+'</div>'+esc(m.text)+'</div>').join('')||'<div class="msg system">Nog geen berichten.</div>';
  th.scrollTop=th.scrollHeight;
}

/* ---------- Stand ---------- */
async function renderStand(){
  const box=$('#standbox');
  let pretty=stateStr; try{pretty=JSON.stringify(JSON.parse(stateStr),null,1)}catch(e){}
  box.innerHTML=`<h2>Huidige Stand</h2><textarea id="stedit" style="min-height:260px;font-family:monospace;font-size:13px"></textarea>
  <div class="row" style="margin-top:6px"><button class="b" id="stsave">Stand opslaan</button></div>
  <h2>Versies</h2><div id="vers">Laden…</div>
  <h2>Logboek</h2><div id="logs">Laden…</div>`;
  $('#stedit').value=pretty;
  $('#stsave').onclick=async()=>{
    try{const o=JSON.parse($('#stedit').value);await db.ref('dnd/state').set(JSON.stringify(o));
      await db.ref('dnd/messages').push(sysMsg(me.name+' heeft de Stand handmatig aangepast.'));alert('Opgeslagen.')}catch(e){alert('Ongeldige JSON: '+e.message)}
  };
  const vs=await db.ref('dnd/stands').orderByKey().limitToLast(15).get();
  const arr=[];vs.forEach(c=>{arr.push({k:c.key,...c.val()})});arr.reverse();
  $('#vers').innerHTML=arr.map(v=>'<div class="card"><b>Na ronde '+v.round+'</b> · '+new Date(v.t).toLocaleString('nl-NL')+' <button class="b alt" data-k="'+v.k+'" style="padding:4px 10px;margin-left:6px">Herstel</button></div>').join('')||'—';
  $('#vers').querySelectorAll('button').forEach(b=>b.onclick=async()=>{
    const v=arr.find(x=>x.k===b.dataset.k); if(!confirm('Stand terugzetten naar na ronde '+v.round+'?'))return;
    await db.ref('dnd/state').set(v.json);
    await db.ref('dnd/messages').push(sysMsg(me.name+' zette de Stand terug naar na ronde '+v.round+'.'));
  });
  const ls=await db.ref('dnd/log').limitToLast(80).get();const la=[];ls.forEach(c=>{la.push(c.val())});la.reverse();
  $('#logs').innerHTML=la.map(l=>'<div class="card"><small>'+esc(l.inGameDate||'')+'</small><br>'+esc(l.fact)+'</div>').join('')||'—';
}

/* ---------- Canon ---------- */
function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0,60)||'doc'}
function renderCanon(){
  const box=$('#canonbox');
  const ids=Object.keys(canon);
  box.innerHTML=`<p><small>Canon = spelregels, personages, wereld. Je maakt dit met ChatGPT/Claude; hier plak of upload je het. Gemini krijgt alle documenten bij elke beurt.</small></p>`+
  ids.map(id=>'<div class="card"><h3>'+esc(canon[id].title)+'</h3><small>'+canon[id].text.length+' tekens</small><div class="row" style="margin-top:6px"><button class="b alt" data-e="'+id+'">Bewerk</button><button class="b red" data-d="'+id+'">Wis</button></div></div>').join('')+
  `<h2>Nieuw / overschrijven</h2><input type="text" id="ctitle" placeholder="Titel (zelfde titel = overschrijven)"><br><br>
  <textarea id="ctext" style="min-height:140px" placeholder="Plak hier de tekst (Markdown)"></textarea>
  <div class="row" style="margin-top:6px"><label class="b alt" for="cfile">Kies bestand (.md/.txt)</label><input type="file" id="cfile" accept=".md,.txt,.json,text/*" style="max-width:200px"><button class="b" id="csave">Opslaan</button></div>`;
  box.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{$('#ctitle').value=canon[b.dataset.e].title;$('#ctext').value=canon[b.dataset.e].text;$('#ctext').scrollIntoView()});
  box.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{if(confirm('Document wissen?'))db.ref('dnd/canon/'+b.dataset.d).remove()});
  $('#cfile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#ctext').value=r.result;if(!$('#ctitle').value)$('#ctitle').value=f.name.replace(/\.[^.]+$/,'')};r.readAsText(f)};
  $('#csave').onclick=async()=>{
    const t=$('#ctitle').value.trim(),x=$('#ctext').value;
    if(!t||!x.trim()){alert('Titel en tekst invullen.');return}
    await db.ref('dnd/canon/'+slug(t)).set({title:t,text:x,t:Date.now()});
  };
}

/* ---------- Instellingen ---------- */
function renderSet(){
  const box=$('#setbox');
  box.innerHTML=`<div class="card"><h3>Gemini (de DM)</h3>
  <label>Model</label><input type="text" id="smodel"><br><br>
  <label>Temperatuur</label><input type="number" id="stemp" step="0.1" min="0" max="2"><br><br>
  <label>API-sleutel (gedeeld in de database; alleen jullie twee kunnen lezen)</label><input type="password" id="skey" placeholder="${cfg.geminiKey?'(ingesteld — leeg laten = ongewijzigd)':'plak hier'}"><br><br>
  <button class="b" id="ssave">Opslaan</button></div>
  <div class="card"><h3>Verbruik</h3><div id="usage">…</div></div>`;
  $('#smodel').value=cfg.model||'gemini-2.5-flash';$('#stemp').value=cfg.temperature!=null?cfg.temperature:0.9;
  $('#ssave').onclick=async()=>{
    const u={model:$('#smodel').value.trim()||'gemini-2.5-flash',temperature:Number($('#stemp').value)||0.9};
    if($('#skey').value.trim()) u.geminiKey=$('#skey').value.trim();
    await db.ref('dnd/config').update(u);alert('Opgeslagen.');
  };
  db.ref('dnd/usage').limitToLast(10).get().then(s=>{let h='';s.forEach(c=>{const v=c.val();h='<div><small>Ronde '+Number(c.key)+': '+v.prompt+' in / '+v.out+' uit</small></div>'+h});$('#usage').innerHTML=h||'—'});
}
