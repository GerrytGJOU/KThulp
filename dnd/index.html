  };
  const vs=await db.ref(cp('stands',C)).orderByKey().limitToLast(15).get();

  $('#vers').querySelectorAll('button').forEach(b=>b.onclick=async()=>{
    const v=arr.find(x=>x.k===b.dataset.k); if(!confirm('Stand terugzetten naar na ronde '+v.round+'?'))return;
    await db.ref(cp('state',C)).set(v.json);
    await db.ref(cp('messages',C)).push(sysMsg(me.name+' zette de Stand terug naar na ronde '+v.round+'.'));
  });
}

/* ---------- Canon ---------- */
const canonReveal={};
function renderCanon(){
  if(screen!=='camp') return;
  const box=$('#canonbox');
  const ids=Object.keys(canon);
  box.innerHTML=BACK+`<p><small>Canon = spelregels, personages, wereld. Je maakt dit met ChatGPT/Claude; hier plak of upload je het. Gemini krijgt de documenten met "Meesturen" aan bij elke beurt ("Alleen opening" = alleen bij de allereerste beurt; met trefwoorden alleen als een trefwoord in de recente scène voorkomt). Minder tekst = minder tokens en lagere kosten.</small></p><p><small id="canontot"></small></p>`+
  ids.map(id=>'<div class="card"><h3>'+esc(canon[id].title)+'</h3><small>'+canon[id].text.length+' tekens</small><div class="row" style="margin-top:4px"><label style="font-size:13px"><input type="checkbox" data-cf="'+id+'"'+(canon[id].off?'':' checked')+'> Meesturen</label><label style="font-size:13px"><input type="checkbox" data-co="'+id+'"'+(canon[id].opening?' checked':'')+'> Alleen opening</label></div><input type="text" data-ck="'+id+'" value="'+esc(canon[id].keywords||'')+'" placeholder="Trefwoorden (komma\'s; leeg = altijd meesturen)" style="margin-top:6px;font-size:14px"><div class="row" style="margin-top:6px"><button class="b alt sm" data-e="'+id+'">Bewerk</button><button class="b red sm" data-d="'+id+'">Wis</button></div></div>').join('')+
  `<h2>Nieuw / overschrijven</h2><input type="text" id="ctitle" placeholder="Titel (zelfde titel = overschrijven)"><br><br>
  <textarea id="ctext" style="min-height:140px" placeholder="Plak hier de tekst (Markdown)"></textarea>
  <div class="row" style="margin-top:6px"><label class="b alt" for="cfile">Kies bestand (.md/.txt)</label><input type="file" id="cfile" class="vh" accept=".md,.txt,.json,text/*"><button class="b" id="csave">Opslaan</button></div>`;
  const tot=ids.filter(i=>!canon[i].off&&!canon[i].opening&&!canon[i].keywords).reduce((a,i)=>a+canon[i].text.length,0);
  $('#canontot').textContent='Vast meegestuurd: '+tot+' tekens (ongeveer '+Math.round(tot/3.6)+' tokens) per beurt.';
  box.querySelectorAll('[data-cf]').forEach(c=>c.onchange=()=>db.ref(cp('canon/'+c.dataset.cf+'/off')).set(c.checked?null:true));
  box.querySelectorAll('[data-co]').forEach(c=>c.onchange=()=>db.ref(cp('canon/'+c.dataset.co+'/opening')).set(c.checked?true:null));
  box.querySelectorAll('[data-ck]').forEach(i=>i.onchange=()=>db.ref(cp('canon/'+i.dataset.ck+'/keywords')).set(i.value.trim()||null));
  ids.forEach(id=>{
    const eb=box.querySelector('[data-e="'+id+'"]'); if(!eb) return;
    const card=eb.closest('.card'), d=canon[id], row=card.querySelector('.row');
    const lab=document.createElement('label'); lab.style.fontSize='13px';
    lab.innerHTML='<input type="checkbox"'+(d.secret?' checked':'')+'> 🔒 DM-geheim';
    lab.firstChild.onchange=e=>db.ref(cp('canon/'+id+'/secret')).set(e.target.checked?true:null);
    row.appendChild(lab);
    if(d.secret){
      card.querySelector('h3').textContent='🔒 '+d.title;
      if(!canonReveal[id]){
        eb.style.display='none';
        const b=document.createElement('button'); b.className='b alt sm'; b.textContent='Toon tekst (spoiler!)';
        b.onclick=()=>{ if(confirm('Dit is DM-geheim: spoilers voor de spelers. Toch tonen?')){canonReveal[id]=true; renderCanon();} };
        eb.parentNode.insertBefore(b,eb);
      }
    }
  });
  box.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{$('#ctitle').value=canon[b.dataset.e].title;$('#ctext').value=canon[b.dataset.e].text;$('#ctext').scrollIntoView()});
  box.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{if(confirm('Document wissen?'))db.ref(cp('canon/'+b.dataset.d)).remove()});
  $('#cfile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#ctext').value=r.result;if(!$('#ctitle').value)$('#ctitle').value=f.name.replace(/\.[^.]+$/,'')};r.readAsText(f)};
  $('#csave').onclick=async()=>{
    const t=$('#ctitle').value.trim(),x=$('#ctext').value;
    if(!t||!x.trim()){alert('Titel en tekst invullen.');return}
    await db.ref(cp('canon/'+slug(t))).set(Object.assign({},canon[slug(t)]||{},{title:t,text:x,t:Date.now()}));
  };
}

/* ---------- Instellingen (globaal) ---------- */
function renderSet(){
  const box=$('#setbox'); if(!box) return;
  if(box.contains(document.activeElement)&&document.activeElement.tagName==='INPUT') return;
  const ph=k=>cfg[k]?'(ingesteld; leeg laten = ongewijzigd)':'plak hier';
  box.innerHTML=(screen==='camp'?BACK:'')+`<div class="card"><h3>Wie is de DM?</h3>
  <select id="sdm"><option value="gemini">Gemini (API, automatisch)</option><option value="anthropic">Claude (API, automatisch)</option><option value="claude">Claude Code (handmatig, geen API)</option></select><br><br>
  <label>Temperatuur</label><input type="number" id="stemp" step="0.1" min="0" max="2"></div>
  <div class="card"><h3>Gemini</h3>
  <label>API-sleutel (gedeeld in de database; alleen jullie twee kunnen lezen)</label><input type="password" id="skey" placeholder="${ph('geminiKey')}"><br><br>
  <label>Model</label><input type="text" id="smodel"><br><br>
  <label>Model voor samenvattingen (goedkoper)</label><input type="text" id="ssum"><br><br>
  <label>Sterker model voor "↻ Sterker model" (optioneel)</label><input type="text" id="sgbig"></div>
  <div class="card"><h3>Claude (Anthropic)</h3>
  <label>API-sleutel (stel in het Anthropic-dashboard een bestedingslimiet in)</label><input type="password" id="sakey" placeholder="${ph('anthropicKey')}"><br><br>
  <label>Model (gewone beurten en samenvattingen)</label><input type="text" id="samodel"><br><br>
  <label>Sterker model voor "↻ Sterker model" (belangrijke scènes)</label><input type="text" id="sabig"></div>
  <div class="card"><button class="b" id="ssave">Opslaan</button></div>
  ${screen==='camp'?'<div class="card"><h3>Verbruik (dit verhaal)</h3><div id="usage">…</div></div>':''}`;

  $('#samodel').value=cfg.anthropicModel||'claude-haiku-5-5'; $('#sabig').value=cfg.anthropicBigModel||'claude-sonnet-5-5';
  $('#ssave').onclick=async()=>{
    const u={dmMode:$('#sdm').value,temperature:Number($('#stemp').value)||0.9,model:$('#smodel').value.trim()||'gemini-2.5-flash',summaryModel:$('#ssum').value.trim()||'gemini-2.5-flash-lite',bigModel:$('#sgbig').value.trim()||null,anthropicModel:$('#samodel').value.trim()||'claude-haiku-5-5',anthropicBigModel:$('#sabig').value.trim()||null};
    if($('#skey').value.trim()) u.geminiKey=$('#skey').value.trim();
    if($('#sakey').value.trim()) u.anthropicKey=$('#sakey').value.trim();
    await db.ref('dnd/config').update(u);alert('Opgeslagen.');
  };
  if(screen==='camp'){const C=cid;db.ref(cp('usage',C)).limitToLast(10).get().then(s=>{let h='';s.forEach(c=>{const v=c.val();h='<div><small>Ronde '+Number(c.key)+': '+v.prompt+' in'+(v.cached?' ('+v.cached+' uit cache)':'')+' / '+v.out+' uit</small></div>'+h});if($('#usage'))$('#usage').innerHTML=h||'—'})}
}
