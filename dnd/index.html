<head>

<title>Midden-aarde</title>
<style>
:root{--bg:#14110f;--panel:#201b17;--panel2:#2a231d;--gold:#c8a24a;--text:#ece3d0;--mute:#9a8f7a;--red:#a8432f;--ok:#6a9a5a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Palatino,"Palatino Linotype","Book Antiqua",Georgia,serif;font-size:16px}
body{display:flex;flex-direction:column;position:relative;
  background:
   radial-gradient(ellipse at 50% 0%,rgba(200,162,74,.18),transparent 55%),
   radial-gradient(circle at 15% 12%,rgba(255,244,210,.9) 0 1.2px,transparent 2px),
   radial-gradient(circle at 78% 8%,rgba(255,244,210,.8) 0 1px,transparent 2px),
   radial-gradient(circle at 42% 20%,rgba(255,244,210,.7) 0 1px,transparent 2px),
   radial-gradient(circle at 90% 26%,rgba(255,244,210,.6) 0 1px,transparent 2px),
   linear-gradient(180deg,#0b1220 0%,#16202a 38%,#241c15 100%);
  background-attachment:fixed}
/* bergketen (Nevelbergen) onderaan */
body::before{content:"";position:fixed;left:0;right:0;bottom:0;height:46vh;z-index:0;pointer-events:none;opacity:.55;
  background:
   url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 300' preserveAspectRatio='none'><path fill='%2310161c' d='M0 300V190l70-60 50 40 90-120 80 100 60-50 110 130 70-80 90 90 120-160 90 120 70-60 100 90 70-70 100 110V300z'/><path fill='%230a0e13' d='M0 300V240l90-50 70 45 110-80 90 70 80-40 120 80 90-60 130 70 110-90 100 80 90-40 120 70V300z'/><path fill='%23fff' fill-opacity='.35' d='M210 50l-22 40 22-10 22 10zM770 40l-24 44 24-12 24 12zM490 130l-18 30 18-8 18 8z'/></svg>") bottom/100% 100% no-repeat}
body>*{position:relative;z-index:1}
.portal-back{cursor:pointer;position:fixed!important;top:8px;left:8px;z-index:9999;width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:var(--panel);border:1px solid var(--gold);border-radius:50%;color:var(--gold)}
header{padding:10px 12px 8px 52px;border-bottom:1px solid rgba(200,162,74,.45);background:linear-gradient(180deg,rgba(11,18,32,.85),rgba(11,18,32,.4));display:flex;justify-content:space-between;align-items:center;gap:8px}
header h1{font-size:20px;margin:0;letter-spacing:.14em;text-transform:uppercase;font-weight:normal;background:linear-gradient(180deg,#f3df9c,#b8892f);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 2px #000)}
header small{color:var(--mute);white-space:nowrap}
#menubtn{background:none;border:1px solid var(--gold);color:var(--gold);border-radius:6px;padding:4px 10px;font:inherit;font-size:14px;cursor:pointer;display:none}
main{flex:1;min-height:0;display:flex;flex-direction:column}
.tab{display:none;flex:1;min-height:0;flex-direction:column}
.tab.on{display:flex}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:10px 12px}
nav{display:flex;border-top:1px solid rgba(200,162,74,.45);background:rgba(20,17,15,.88);backdrop-filter:blur(6px)}
nav button{flex:1;background:none;border:0;color:var(--mute);padding:12px 4px;font:inherit;font-size:14px}
nav button.on{color:var(--gold);border-top:2px solid var(--gold);margin-top:-1px}
.msg{margin:0 0 12px;padding:10px 12px;border-radius:8px;background:rgba(32,27,23,.82);line-height:1.5;word-wrap:break-word;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.msg.dm{background:linear-gradient(180deg,#eadcb8,#d9c690);color:#2b2012;border:1px solid #9c7f3c;border-left:4px solid #7a5a1c;font-size:17px;box-shadow:0 3px 12px rgba(0,0,0,.55),inset 0 0 30px rgba(120,85,20,.25)}
.msg.dm .who{color:#6a4a12}
.msg.action{border-left:3px solid #5b7fa8;background:rgba(24,34,48,.8)}
.msg.system{color:var(--mute);font-style:italic;background:none;box-shadow:none;padding:2px 12px;text-align:center}
.msg .who{font-size:12px;color:var(--gold);margin-bottom:3px;text-transform:uppercase;letter-spacing:.08em}
.msg.ooc .who{color:#8aa}
.mrow{display:flex;gap:10px;align-items:flex-start}
.pts{display:flex;flex-direction:column;gap:6px;flex:none}
.pt{width:64px;height:64px;object-fit:cover;object-position:top;border-radius:50%;border:2px solid var(--gold);box-shadow:0 2px 6px rgba(0,0,0,.6);cursor:pointer;background:#000}
.mtxt{flex:1;min-width:0}
.status{padding:8px 12px;background:rgba(32,27,23,.9);border-top:1px solid rgba(200,162,74,.45);font-size:14px}
.status b{color:var(--gold)}
.compose{padding:8px 12px 10px;background:rgba(32,27,23,.9);display:flex;flex-direction:column;gap:6px}
textarea,input[type=text],input[type=password],input[type=number],select{width:100%;background:#0f0d0b;color:var(--text);border:1px solid #4a3d30;border-radius:6px;padding:9px;font:inherit;font-size:16px}
textarea{resize:vertical;min-height:70px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button.b,label.b{background:var(--gold);color:#1a140c;border:0;border-radius:6px;padding:9px 14px;font:inherit;font-weight:bold;cursor:pointer;display:inline-block}
button.b.alt,label.b.alt{background:#3a3027;color:var(--text)}
button.b.red{background:var(--red);color:#fff}
button.b.sm,label.b.sm{padding:5px 10px;font-size:14px}
button:disabled{opacity:.4}
pre{white-space:pre-wrap;word-break:break-word;background:#0f0d0b;padding:10px;border-radius:6px;font-size:13px}
.card{background:rgba(32,27,23,.88);border-radius:8px;padding:10px 12px;margin-bottom:10px}
.card h3{margin:0 0 6px;color:var(--gold);font-size:16px}
.npc{display:flex;gap:10px}
.npc .th{width:72px;height:72px;flex:none;border-radius:8px;border:1px solid #4a3d30;background:#0f0d0b;object-fit:cover;object-position:top;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:12px;text-align:center;cursor:pointer}
.npc .info{flex:1;min-width:0}
.npc small{color:var(--mute)}
details summary{cursor:pointer;color:var(--gold);font-size:14px;margin:4px 0}
.center{margin:auto;max-width:420px;padding:24px;text-align:center}
.err{color:#e08a76}
footer{text-align:center;color:var(--mute);font-size:12px;padding:4px 0 6px}
h2{color:var(--gold);font-size:17px;margin:14px 0 6px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:10000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;padding:16px}
#ov img{max-width:100%;max-height:82vh;border-radius:10px;border:2px solid var(--gold)}
#ov div{color:var(--gold);font-size:18px}
#scenebar{padding:4px 12px;font-size:13px;color:var(--gold);background:rgba(11,18,32,.7);border-bottom:1px solid rgba(200,162,74,.3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#partybar{display:flex;gap:8px;overflow-x:auto;padding:6px 12px;background:rgba(20,17,15,.75);border-bottom:1px solid rgba(200,162,74,.3)}
#partybar:empty,#scenebar:empty{display:none}
.pc{display:flex;gap:8px;align-items:center;flex:none;min-width:170px;max-width:240px;padding:5px 8px;border-radius:8px;background:rgba(42,35,29,.9);border:1px solid #4a3d30}
.pc .av{width:44px;height:44px;border-radius:50%;flex:none;object-fit:cover;object-position:top;border:2px solid var(--gold);background:#0f0d0b;display:flex;align-items:center;justify-content:center;color:var(--gold);font-weight:bold}
.pc .pi{min-width:0;flex:1}
.pc b{font-size:14px}
.hpb{height:6px;border-radius:3px;background:#0f0d0b;margin:3px 0 2px;overflow:hidden}
.hpb i{display:block;height:100%;background:var(--ok)}
.hpb i.mid{background:#c8a24a}.hpb i.low{background:var(--red)}
.pc small{color:var(--mute);font-size:12px}
.chips{display:flex;gap:3px;flex-wrap:wrap;margin-top:2px}
.chip{font-size:11px;padding:1px 6px;border-radius:9px;background:#3a3027;color:var(--text)}
.chip.bad{background:var(--red);color:#fff}
.q{border-left:3px solid var(--gold);padding:4px 10px;margin:0 0 8px;background:rgba(32,27,23,.7);border-radius:0 6px 6px 0}
.q.done{border-color:var(--ok);color:var(--mute)}
.ppl{display:flex;gap:10px;align-items:center}
.ppl .av{width:48px;height:48px;border-radius:50%;object-fit:cover;object-position:top;border:2px solid #4a3d30;background:#0f0d0b;flex:none;display:flex;align-items:center;justify-content:center;color:var(--mute)}
.more-btn{width:100%;text-align:left;margin-bottom:8px;padding:14px}
.rolls{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.rc{font-size:12px;padding:3px 8px;border-radius:12px;background:#3a3027;color:#f3e9d2;border:1px solid #6a5a44;line-height:1.3}
.rc.ok{border-color:#6a9a5a;background:#2c3a28}.rc.ko{border-color:#a8432f;background:#3d2420}
.rc.n20{border-color:#f3df9c;background:#5a4515;box-shadow:0 0 8px rgba(243,223,156,.7)}
.rc.n1{border-color:#e0553a;background:#4a1810;box-shadow:0 0 8px rgba(224,85,58,.6)}
#initbar{display:flex;gap:5px;overflow-x:auto;padding:5px 12px;background:rgba(60,20,16,.55);border-bottom:1px solid rgba(168,67,47,.6);align-items:center}
#initbar:empty{display:none}
#initbar .lbl{color:#e08a76;font-size:13px;flex:none}
.ic{flex:none;font-size:13px;padding:3px 9px;border-radius:12px;background:#2a231d;border:1px solid #4a3d30;white-space:nowrap}
.ic.foe{background:#3d2420;border-color:#7a3426}
.ic.act{outline:2px solid var(--gold);font-weight:bold}
.acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.acts button{background:rgba(0,0,0,.15);border:1px solid rgba(0,0,0,.3);border-radius:6px;padding:2px 9px;font:inherit;font-size:12px;cursor:pointer;color:inherit}
.locimg{width:100%;border-radius:8px;border:1px solid #4a3d30;margin:6px 0;cursor:pointer;display:block}
.msg.loc{background:rgba(24,34,48,.85);display:flex;gap:10px;align-items:center;font-style:normal;text-align:left}
.msg.loc img{width:84px;height:84px;object-fit:cover;border-radius:6px;flex:none;cursor:pointer}
#gamewrap{display:flex;flex:1;min-height:0}
#gamemain{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#side{display:none}
@media(min-width:1000px){#side{display:block;width:340px;flex:none;overflow-y:auto;padding:10px 12px;border-left:1px solid rgba(200,162,74,.35);background:rgba(20,17,15,.6)}}
.sh-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:6px;margin-bottom:10px}
.sh-strip>div{background:rgba(32,27,23,.88);border-radius:8px;padding:6px 8px;text-align:center}
.sh-strip small{display:block;color:var(--mute);font-size:11px}
.sh-strip b{font-size:18px;color:var(--gold)}
.sh-two{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:700px){.sh-two{grid-template-columns:1fr 1fr}}
.rl{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:15px}
.rl:hover,.rl.on{background:rgba(200,162,74,.18)}
.rl b{color:var(--gold);min-width:38px;text-align:right}
.rl small{color:var(--mute)}
.sh-strip .rl{display:block;cursor:pointer}
.sh-ed{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:6px 0}
.sh label{display:block}
.rollpanel{position:sticky;bottom:6px;border:1px solid var(--gold);box-shadow:0 4px 14px rgba(0,0,0,.6)}
input[type=file]{max-width:220px;color:var(--mute);font-size:13px}
.vh{position:absolute!important;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.ccsteps{display:flex;gap:4px;overflow-x:auto;margin-bottom:6px;padding-bottom:2px}
.ccstep{flex:none;background:#2a231d;color:var(--mute);border:1px solid #4a3d30;border-radius:14px;padding:3px 10px;font:inherit;font-size:13px;cursor:pointer}
.ccstep span{display:none}.ccstep.on span{display:inline}
.ccstep.on{background:var(--gold);color:#1a140c;border-color:var(--gold);font-weight:bold}.ccstep.done{color:var(--gold)}
.ccsum{font-size:13px;color:var(--mute);margin-bottom:6px}
.ccbody h3{margin-top:4px}.ccbody label{display:block;margin-bottom:8px}.ccbody label small{display:block;color:var(--mute);margin-bottom:2px}
.cctip{font-size:13px;color:var(--mute);margin:4px 0 8px}
.ccgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-bottom:8px}
.ccopt{background:#2a231d;color:var(--text);border:1px solid #4a3d30;border-radius:8px;padding:8px;text-align:left;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.ccopt small{color:var(--mute);font-size:12px}.ccopt.on{border-color:var(--gold);background:rgba(200,162,74,.2)}
.ccpicks{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.ccbody label.ccp{display:inline-block;margin:0;padding:4px 9px;border-radius:14px;background:#2a231d;border:1px solid #4a3d30;font-size:14px;cursor:pointer}
.ccp.on{border-color:var(--gold);background:rgba(200,162,74,.2)}.ccp input{accent-color:var(--gold)}
.ccab{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(200,162,74,.15)}
.ccinsp div{font-size:13px;color:var(--mute);padding:2px 0}
.ccnav{position:sticky;bottom:0;background:rgba(20,17,15,.95);padding:8px 0;flex-wrap:nowrap}
.ccbody input[type=radio]{width:auto;accent-color:var(--gold)}
</style>
</head>
<body>
<button class="portal-back" id="topback" aria-label="Terug" style="display:none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
<header><h1>⚔ Midden-aarde</h1><span><small id="who"></small></span></header>
<main id="main"><div class="center" id="boot">Laden…</div></main>
<footer>Midden-aarde D&amp;D · &copy; Gerben de Jong · 2026</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script src="world.js?v=2"></script>
<script>
"use strict";
firebase.initializeApp({
  apiKey:"AIzaSyC1P5vws3RKt2Dl9Nnfz8OCPV2KRS55w_U",
  authDomain:"kthulp-certamen.firebaseapp.com",
  databaseURL:"https://kthulp-certamen-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"kthulp-certamen",
  appId:"1:16556837470:web:ea3f4ba28bd00630c582cf"
});
const auth=firebase.auth(), db=firebase.database();
const $=s=>document.querySelector(s);
const main=$('#main');

/* ---------- toestand ---------- */
let me=null;                 // {uid,name}
let screen='menu', cid=null; // menu of campagne
let cfg={}, npcs={}, locs={}, chars={}, index={}; let sceneKey='', editKey=null, editDraft='', lastSide='';              // globaal
let wQuests={}, wCal=null;
let turn=null, canon={}, msgs=[], oocs=[], pending={}, stateStr="{}"; // per campagne
let tab='game', draft="", rollDraft="";
let listeners=[];
const LEASE_MS=3*60*1000;
const cp=(p,C)=>'dnd/campaigns/'+(C||cid)+'/'+p;

/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function md(s){
  return esc(s||"").replace(/^### (.*)$/gm,'<b>$1</b>').replace(/^## (.*)$/gm,'<b>$1</b>').replace(/^# (.*)$/gm,'<b>$1</b>')
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/\n/g,'<br>');
}
function slug(s){return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0,60)||'x'}
function awaitingNames(){return turn&&turn.awaiting?Object.keys(turn.awaiting):[]}
function deepMerge(t,p){
  if(p===null||typeof p!=='object'||Array.isArray(p)) return p;
  const out=(t&&typeof t==='object'&&!Array.isArray(t))?{...t}:{};
  for(const k of Object.keys(p)){ if(p[k]===null) delete out[k]; else out[k]=deepMerge(out[k],p[k]); }
  return out;
}
function sysMsg(text){return {type:'system',author:'systeem',text,t:Date.now()}}
function on(ref,ev,fn){ref.on(ev,fn);listeners.push([ref,ev,fn])}
function copyText(t,btn){
  const done=()=>{if(btn){const o=btn.textContent;btn.textContent='Gekopieerd ✓';setTimeout(()=>btn.textContent=o,1500)}};
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done,()=>fallback());
  else fallback();
  function fallback(){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');done()}catch(e){alert('Kopiëren mislukt; selecteer de tekst handmatig.')}a.remove()}
}
function resizeImage(file,max){
  max=max||360;
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>{const im=new Image();
      im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));
        const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};
      im.onerror=()=>rej(new Error('Geen geldige afbeelding'));im.src=r.result};
    r.onerror=()=>rej(new Error('Lezen mislukt'));r.readAsDataURL(file);
  });
}
function zoom(src,name){
  const o=document.createElement('div');o.id='ov';
  o.innerHTML='<img src="'+src+'" alt=""><div>'+esc(name||'')+'</div>';
  o.onclick=()=>o.remove();document.body.appendChild(o);
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-zoom]'); if(t){const z=t.dataset.zoom, n=z.startsWith('loc:')?locs[z.slice(4)]:npcs[z]; if(n&&n.img) zoom(n.img,n.name)}
});

/* ---------- login ---------- */
auth.getRedirectResult().catch(e=>{window._loginErr=e.message});
auth.onAuthStateChanged(async u=>{
  if(!u){ showLogin(); return; }
  try{
    const snap=await db.ref('dndAccess/'+u.uid).get();
    let val=snap.exists()?snap.val():null;
    if(val===null&&u.email){
      const es=await db.ref('dndAccessEmail/'+u.email.toLowerCase().replace(/\./g,',')).get();
      if(es.exists()) val=es.val();
    }
    if(val===null){ showNoAccess(u); return; }
    me={uid:u.uid,name:String(val===true?(u.displayName||'Speler'):val)};
    $('#who').textContent=me.name+' · ';
    const a=document.createElement('a');a.href='#';a.textContent='uitloggen';a.style.color='var(--mute)';
    a.onclick=e=>{e.preventDefault();auth.signOut()};$('#who').appendChild(a);
    startApp();
  }catch(e){ showNoAccess(u,e.message); }
});
function showLogin(){
  main.innerHTML='<div class="center"><p>Alleen voor Gerben en Maurits.</p><button class="b" id="gl">Inloggen met Google</button><p class="err">'+esc(window._loginErr||'')+'</p></div>';
  $('#gl').onclick=async()=>{
    const p=new firebase.auth.GoogleAuthProvider();
    try{ await auth.signInWithPopup(p); }   // popup werkt ook als de browser opslag van derden blokkeert
    catch(e){
      if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'){ auth.signInWithRedirect(p); }
      else if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request'){ window._loginErr=e.code+': '+e.message; showLogin(); }
    }
  };
}
function showNoAccess(u,extra){
  main.innerHTML='<div class="center"><p><b>Geen toegang.</b></p><p>Je bent ingelogd als '+esc(u.email||'')+'.<br>Stuur dit UID naar Gerben:</p><pre>'+esc(u.uid)+'</pre><p class="err">'+esc(extra||'')+'</p><button class="b alt" id="lo">Uitloggen</button></div>';
  $('#lo').onclick=()=>auth.signOut();
}

/* ---------- start: globale listeners ---------- */
let started=false;
function startApp(){
  if(started) return; started=true;
  db.ref('dnd/config').on('value',s=>{cfg=s.val()||{};if(screen==='menu'||tab==='set')renderSet()});
  db.ref('dnd/npcs').on('value',s=>{npcs=s.val()||{};renderNpcs();if(screen==='camp')renderGame()});
  db.ref('dnd/characters').on('value',s=>{chars=s.val()||{}; if(!sheetEdit){ if(screen==='menu'&&menuView==='chars') renderSheet($('#sheetbox')); else if(screen==='camp'&&tab==='sheet') renderSheetTab(); } if(screen==='camp') renderGame();});
  db.ref('dnd/locations').on('value',s=>{locs=s.val()||{};renderNpcs();if(screen==='camp')renderGame()});
  db.ref('dnd/campaignIndex').on('value',s=>{index=s.val()||{};renderIndex()});
  $('#topback').onclick=()=>showMenu('home');
  // browser-/telefoon-terugknop: blijf binnen de app (nooit terug naar de website)
  history.replaceState({dnd:1},''); history.pushState({dnd:2},'');
  window.addEventListener('popstate',()=>{ history.pushState({dnd:2},''); if(screen==='camp'||menuView!=='home') showMenu('home'); });
  setInterval(()=>{if(screen==='camp'&&turn&&turn.status==='resolving')renderGame()},15000);
  showMenu();
}

const STYLE="Classic hand-drawn / painterly Tolkien-style tabletop RPG fantasy illustration: traditional details, visible ink outlines, atmospheric lighting, believable anatomy, historical materials.";
function makePrompt(n){
  return STYLE+"\nSquare head-and-shoulders character portrait of "+n.name+", facing the viewer in a slight three-quarter view, plain dark muted background with subtle texture.\n"+
  "Character: "+(n.visual||'(no description yet)')+"\n"+
  "If this is a character from Tolkien's books, follow the written descriptions in the books, not the likeness of any film actor.\n"+
  "Avoid: photorealism, cartoon or anime look, 3D game render, modern clothing or objects, text, captions, watermarks, logos, borders, extra people, extra fingers, deformed hands.";
}
function libCard(kind,n){
  const loc=kind==='loc', k=n.k, z=loc?'loc:'+k:k;
  return '<div class="card npc">'+
    (n.img?'<img class="th" src="'+n.img+'" data-zoom="'+z+'" alt="">':'<div class="th">geen plaatje</div>')+
    '<div class="info"><h3 style="margin-bottom:2px">'+esc(n.name)+(n.forPlayer?' <small>· speler '+esc(n.forPlayer)+'</small>':'')+'</h3>'+
    '<small>'+esc(((loc&&n.desc)?n.desc+' — ':'')+(n.visual||'(geen uiterlijk)').slice(0,150))+'</small>'+
    '<details><summary>Prompt voor ChatGPT</summary><textarea readonly rows="7" onclick="this.select()">'+esc(loc?makeLocPrompt(n):makePrompt(n))+'</textarea></details>'+
    '<div class="row"><button class="b sm" data-a="copy" data-kind="'+kind+'" data-k="'+k+'">Kopieer prompt</button>'+
    '<label class="b alt sm" for="up_'+kind+'_'+k+'">'+(n.img?'Vervang plaatje':'Upload plaatje')+'</label><input type="file" id="up_'+kind+'_'+k+'" class="vh" data-kind="'+kind+'" data-k="'+k+'" accept="image/*">'+
    '<button class="b alt sm" data-a="edit" data-kind="'+kind+'" data-k="'+k+'">Bewerk</button>'+
    (n.img?'<button class="b alt sm" data-a="delimg" data-kind="'+kind+'" data-k="'+k+'">Plaatje wis</button>':'')+
    '<button class="b red sm" data-a="del" data-kind="'+kind+'" data-k="'+k+'">Wis</button></div></div></div>';
}
const doneOpen={npc:false,loc:false};
function libGroups(kind,list){
  const incomplete=n=>!n.img||!n.visual||(kind==='loc'&&!n.desc);
  const todo=list.filter(incomplete), done=list.filter(n=>!incomplete(n));
  return (todo.map(n=>libCard(kind,n)).join('')||'<small style="color:var(--mute)">Alles compleet ✓</small>')+
    (done.length?'<details class="card" data-done="'+kind+'"'+(doneOpen[kind]?' open':'')+'><summary>✔ Compleet ('+done.length+') — opgeborgen</summary>'+done.map(n=>libCard(kind,n)).join('')+'</details>':'');
}
function renderNpcs(){

  const miss=l=>l.filter(n=>!n.img||!n.visual).length;
  box.innerHTML=libGroups('npc',arr(npcs));

  if(t1) t1.textContent="NPC's & spelers"+(miss(arr(npcs))?' — '+miss(arr(npcs))+' missen iets':'');

/* ---------- spel ---------- */
function portraitsFor(m){
  if(m.type==='narration'&&Array.isArray(m.speakers)){
    return m.speakers.map(n=>[slug(n),n]).filter(([k])=>npcs[k]&&npcs[k].img).slice(0,2);
  }
  if(m.type==='action'||m.type==='pass'){
    const e=Object.entries(npcs).find(([k,n])=>n.forPlayer===m.author&&n.img); return e?[[e[0],e[1].name]]:[];
  }
  return [];
}
function renderGame(){
  if(!me||screen!=='camp'||tab!=='game') return;
  renderParty(); renderInit(); renderSide();
  const th=$('#thread');
  const atBottom=th.scrollHeight-th.scrollTop-th.clientHeight<80;
  let lastNarr=null; for(let i=msgs.length-1;i>=0;i--) if(msgs[i].type==='narration'){lastNarr=msgs[i]._k;break;}
  const canAct=turn&&(turn.status==='waiting'||turn.status==='error');
  th.innerHTML=msgs.map(m=>{
    const cls=m.type==='narration'?'dm':m.type==='action'||m.type==='pass'?'action':m.type==='system'?'system':'';
    const pts=portraitsFor(m);
    let who=m.type==='narration'?'De DM':m.type==='system'?'':esc(m.author||'');
    if(m.type==='narration'&&pts.length) who+=' · '+pts.map(p=>esc(p[1])).join(' &amp; ');
    let txt=m.text||''; const wm=[];
    if(m.type==='action') txt=txt.replace(/\s*\[worp:\s*([^\]]*)\]/gi,(x,y)=>{wm.push(y.trim());return ''});
    const chips=(m.rolls||[]).map(rollChip).concat(wm.map(w=>'<span class="rc">🎲 '+esc(w)+'</span>')).join('');
    const body=md(txt)+(chips?'<div class="rolls">'+chips+'</div>':'');
    let inner=pts.length?'<div class="mrow"><div class="pts">'+pts.map(p=>'<img class="pt" src="'+npcs[p[0]].img+'" data-zoom="'+p[0]+'" alt="'+esc(p[1])+'">').join('')+'</div><div class="mtxt">'+body+'</div></div>':body;
    let acts='';
    if(m.type==='narration'&&m._k){
      if(editKey===m._k) inner='<textarea id="editta" style="min-height:160px;color:#2b2012;background:#fff8e6">'+esc(editDraft)+'</textarea><div class="acts"><button data-act="editsave" data-k="'+m._k+'">Opslaan</button><button data-act="editcancel">Annuleer</button></div>';
      else acts='<div class="acts"><button data-act="edit" data-k="'+m._k+'">✎ Bewerk</button>'+(m._k===lastNarr&&canAct?'<button data-act="regen">↻ Opnieuw</button>'+(bigModelName()?'<button data-act="regenbig">↻ Sterker model</button>':'')+'<button data-act="undo">↶ Terug</button>':'')+'</div>';
    }
    let out='<div class="msg '+cls+'">'+(who?'<div class="who">'+who+'</div>':'')+inner+acts+'</div>';
    if(m.newLoc&&locs[m.newLoc]){const l=locs[m.newLoc]; out+='<div class="msg loc">'+(l.img?'<img src="'+l.img+'" data-zoom="loc:'+m.newLoc+'" alt="">':'')+'<div><b>📍 Nieuw gebied: '+esc(l.name)+'</b><br><small>'+esc(l.desc||'')+'</small></div></div>';}
    return out;
  }).join('')||'<div class="msg system">Nog geen verhaal.</div>';
  const eta=$('#editta'); if(eta) eta.oninput=e=>{editDraft=e.target.value};
  if(atBottom) th.scrollTop=th.scrollHeight;

  const sb=$('#statusbar'), cpz=$('#compose');
  const cEl=$('#compose'); const keepDraft=!!(cEl&&document.activeElement&&cEl!==document.activeElement&&cEl.contains(document.activeElement));
  if(!turn){
    sb.innerHTML='Nog geen campagne gestart.';
    cpz.innerHTML='<button class="b" id="startc">Start campagne (DM opent het verhaal)</button>';
    $('#startc').onclick=startCampaign; return;
  }
  const aw=awaitingNames(), mine=pending[me.uid]&&pending[me.uid].round===turn.round?pending[me.uid]:null;
  const myTurn=aw.includes(me.name);
  if(turn.status==='claude'){
    sb.innerHTML='🤖 <b>De DM (Claude) is aan zet.</b><br><small>Vraag Gerben om de beurt te laten spelen in het Claude Code-gesprek.</small>';
    cpz.innerHTML='<button class="b alt" id="usegem">Laat Gemini deze beurt toch spelen</button>';
    $('#usegem').onclick=()=>resolve(true,true); return;
  }
  if(turn.status==='resolving'){
    const stuck=turn.resolvingSince&&Date.now()-turn.resolvingSince>LEASE_MS;
    sb.innerHTML='De DM vertelt…'+(stuck?' (duurt lang)':'');
    cpz.innerHTML=stuck?'<button class="b red" id="retry">Opnieuw proberen</button>':'';
    if(stuck)$('#retry').onclick=()=>resolve(true); return;
  }
  if(turn.status==='error'){
    sb.innerHTML='<span class="err">Fout: '+esc(turn.lastError||'onbekend')+'</span>';
    cpz.innerHTML='<button class="b red" id="retry">Opnieuw proberen</button>';
    $('#retry').onclick=()=>resolve(true); return;
  }
  const others=aw.filter(n=>n!==me.name);
  let st='<b>➡️ '+esc(turn.prompt||'Aan zet')+'</b>';
  st+='<br><small>Ronde '+turn.round+' · Wacht op: '+(aw.length?esc(aw.join(', ')):'—')+'</small>';
  const checks=turn.checks&&turn.checks[me.name];
  if(checks) st+='<br>🎲 <b>Worp gevraagd:</b> '+esc(checks);
  if(!turn.blind){
    Object.values(pending).filter(p=>p.round===turn.round&&p.name!==me.name).forEach(p=>{st+='<br><small>'+esc(p.name)+': '+esc(p.text)+'</small>'});
  } else if(Object.values(pending).some(p=>p.round===turn.round&&p.name!==me.name)){
    st+='<br><small>(blind) De ander heeft ingediend.</small>';
  }
  sb.innerHTML=st;
  if(!myTurn&&!mine){ cpz.innerHTML=others.length?'<small>Niet jouw beurt.</small>':''; return; }
  if(!keepDraft){
    cpz.innerHTML=`<textarea id="act" placeholder="Wat doe je?"></textarea>
    ${rollRowHtml()}
    <div class="row"><button class="b" id="send">${mine?'Actie aanpassen':'Verstuur'}</button><button class="b alt" id="pass">Ik pas</button>
    ${others.length?'<button class="b alt" id="skip">Zonder '+esc(others.join(', '))+' verder</button>':''}</div>
    ${mine?'<small>Ingediend: '+esc(mine.text)+'</small>':''}`;
    if(!draft&&mine) draft=mine.text.replace(/\s*\[worp:[^\]]*\]/i,'');
    $('#act').value=draft;
    $('#act').oninput=e=>draft=e.target.value; wireRoll();
    $('#send').onclick=()=>submit(false);
    $('#pass').onclick=()=>submit(true);
    const sk=$('#skip'); if(sk) sk.onclick=skipOthers;
  }
}
async function submit(pass){
  const text=pass?'(past / wacht af)':draft.trim();
  if(!text){alert('Typ eerst een actie.');return}
  const round=turn.round, full=text+(rollDraft.trim()&&!pass?'  [worp: '+rollDraft.trim()+']':'');
  await db.ref(cp('pending/'+me.uid)).set({round,name:me.name,text:full,pass:!!pass,t:Date.now()});
  draft="";rollDraft="";rollKey=null;rollNat="";
  const ok=await removeAwaiting(me.name,round);
  if(ok==='resolve') resolve(false);
  else if(ok==='late') alert('Te laat: de ronde is al afgehandeld. Ververs de pagina.');
  else{ $('#compose').innerHTML=''; renderGame(); }
}
async function removeAwaiting(name,round){
  let became=false;
  const r=await db.ref(cp('turn')).transaction(t=>{
    if(!t||t.round!==round||t.status!=='waiting') return;
    became=false;
    if(t.awaiting&&t.awaiting[name]){
      delete t.awaiting[name];
      if(!Object.keys(t.awaiting).length) t.awaiting=null;
    }
    if(!t.awaiting){t.status='resolving';t.resolvingSince=Date.now();became=true;}
    return t;
  });
  if(!r.committed) return 'late';
  return became?'resolve':'ok';
}
async function skipOthers(){
  const others=awaitingNames().filter(n=>n!==me.name);
  if(!confirm('Doorgaan zonder '+others.join(', ')+'? Die doet dan niets deze ronde.')) return;
  if(!(pending[me.uid]&&pending[me.uid].round===turn.round)){
    await db.ref(cp('pending/'+me.uid)).set({round:turn.round,name:me.name,text:draft.trim()||'(past / wacht af)',pass:!draft.trim(),t:Date.now()});
  }
  await db.ref(cp('messages')).push(sysMsg(others.join(', ')+' wordt overgeslagen deze ronde.'));
  let res='ok';
  for(const n of [...others,me.name]) res=await removeAwaiting(n,turn.round);
  if(res==='resolve') resolve(false);
}
async function startCampaign(){
  if(cfg.dmMode!=='claude'&&!keyOk()){alert('Zet eerst je API-sleutel bij ⚙.');setTab('set');return}
  if(!Object.keys(canon).length&&!confirm('Er is nog geen canon. Toch starten?'))return;
  await db.ref(cp('turn')).set({round:0,status:'resolving',resolvingSince:Date.now(),awaiting:null});
  resolve(false);
}

/* ---------- DM-motor ---------- */
const SYSTEM=`Je bent de Dungeon Master van een doorlopende D&D 5e (2024)-campagne in Midden-aarde met twee spelers (PC's). Schrijf in het Nederlands, met Engelse 2024-spelregeltermen.
Regels:
- Bronnenhiërarchie: (1) CANON (spelregels en personages) (2) LOGBOEK (3) de actuele STAND (4) rest. Verzin geen feiten over het verleden die hiermee botsen.
- Houd je aan het scene-pacing uit A1: kort vertellen, één betekenisvolle ontwikkeling per beurt, doorgaans 80-180 woorden (alleen bij reizen, omgevingsintroducties of een expliciete wens langer). Stop op een natuurlijk reactiemoment. Geen openingsgroet of meta-uitleg ("Welkom in…"); begin direct in de scène.
- Schrijf niets over wat een PC denkt, voelt of besluit; beschrijf alleen de wereld, NPC's en de zintuiglijke waarneming van de PC's.
- Speel NOOIT een PC.
- Tolkien-personages overschaduwen de PC's niet.
- Spelers rollen zelf fysiek; hun worp staat in hun actie ("[worp: ...]"). Vraag een check via nextTurn.checks (naam → welke check en waarom); verklap DC's niet.
- Voor worpen van NPC's/vijanden gebruik je UITSLUITEND de meegegeven voorgegooide dobbelstenen, in volgorde (d20 voor aanvallen/checks/saves, d6/d8/d10/d12 voor schade). Noem de worp kort in de vertelling.
- Als beide spelers moeten reageren zet je beide namen in awaiting; bij combat de volgende speler; bij een enkele speler alleen die naam.
- Houd de STAND bij via statePatch (deep merge; null verwijdert een sleutel; lijsten worden vervangen). Gebruik EXACT dit schema, met de naam van het personage als sleutel:
  {"inGame":{"date":"24 oktober 3018","timeOfDay":"ochtend","location":"Rivendell, Last Homely House"},
   "pcs":{"Wulfgrim":{"player":"Gerben","location":"","hp":{"current":41,"max":41,"temp":0},"resources":{"Rage":"3/3","Hit Dice":"3d12"},"conditions":[],"inventory":[],"knowledge":[]}},
   "companions":{"Naam":{"location":"","hp":{"current":0,"max":0,"temp":0},"status":"","attitude":""}},
   "npcs":{"Naam":{"location":"","status":"","attitude":"","knows":[]}},
   "factions":{"Naam":{"stance":"","currentAction":""}},
   "quests":{"open":[{"title":"","detail":""}],"completed":[],"consequences":[]},
   "initiative":{"active":"Naam","order":[{"name":"Naam","init":15,"enemy":false}]}  (alleen tijdens een gevecht; anders null)}
  Vul bij het begin hp, resources en inventory van elke PC in uit zijn B-document. Werk hp, resources, conditions, location, inGame en quests bij zodra ze veranderen. Controleer geografie met Tolkiens kaart (Rivendell ligt in Eriador aan de westzijde van de Misty Mountains, ver van de Ered Luin). 
- Documenten in CANON die als DM-geheim of "NIET LEZEN ALS SPELER" gemarkeerd zijn, gebruik je voor planning, maar je onthult of citeert ze nooit letterlijk; laat geheimen alleen via het spel zelf blijken.
- Is de ACTUELE STAND nog leeg ({}), begin dan met een statePatch die de beginsituatie uit D1 Wereldstatus / STAND #1 in canon overneemt. Een PC zonder uitgewerkt personage (zoals PC2 zolang B2 ontbreekt) speel je niet; vraag die speler eerst zijn personage te beschrijven.
- Portretten: "speakers" = de namen van maximaal 2 NPC's die in deze beurt spreken of centraal staan. Gebruik EXACT de naam uit de lijst BEKENDE NPC'S als de NPC daar al in staat. "newNpcs" = elke NPC die in deze beurt voor het eerst optreedt en NIET in die lijst staat, met "visual": een concrete Engelse beschrijving voor een portret (soort/leeftijd, postuur, gezicht, huid, haar en baard, ogen, littekens, elk kledingstuk met kleur en materiaal, zichtbare uitrusting, uitdrukking). Voor figuren uit Tolkiens boeken: beschrijf zoals in de boeken. Geen geheimen in "visual".
- Passages en documenten met [V] zijn voorstellen: gebruik ze als ontwerp, maar presenteer ze niet als bestaande feiten of vaststaande personen zolang ze niet in het spel zijn geïntroduceerd; [B] is bestaand, [O] is open (niet invullen).
- Wereldstatus: de app houdt een register met stabiele IDs (TOL- Tolkien-figuren, NPC-, CMP- companions, MAIN-, SQ-, MQ-, PQ-, DQ- quests, CLK- klokken, FAC- facties, LOC- plaatsen, REG- regio's). Gebruik exact die IDs uit WERELDSTATUS. Wijzigingen in de wereld geef je in "worldDelta" (weglaten als er niets verandert): {"region":"REG-ERIADOR" (waar de scène speelt),"time":{"to":{"y":3018,"m":10,"d":26},"reason":"...","worldTick":false},"npcs":[{"id":"NPC-E05","op":"create|update","set":{"name":"","status":"named","location":"LOC-...","canon":"N"},"reason":""}],"quests":[{"id":"DQ-0001","op":"create|update","set":{"status":"active"},"reason":""}],"clocks":[{"id":"CLK-A","delta":1,"reason":""}],"companions":[{"id":"CMP-R03","op":"recruit|decline|depart|return|update|rest","mode":"permanent|etappe|temporary|contact|remote","reason":"","hp":{"delta":-5},"resources":{"Second Wind":{"delta":-1}},"conditions":{"add":[],"remove":[]},"evidence":"concrete ervaring","nextAction":"","obligation":{"text":"","due":{"y":3018,"m":11,"d":5}},"destination":"REG-ERIADOR","returnIf":"","expectedReturn":{"y":3018,"m":12,"d":1},"kind":"short|long"}],"events":[{"type":"","summary":"","refs":{"npcs":[],"quests":[]},"divergence":false,"cause":""}]}. Regels: de tijd gaat nooit terug en sprongen van meer dan 21 dagen vereisen worldTick:true; NPC's reizen niet sneller dan de afstand tussen regio's toelaat; overleden NPC's keren niet terug; quests gaan dormant→available→active→completed|failed|expired|changed en een beëindigde quest start nooit opnieuw; klokken veranderen alleen met een reden en hoogstens ±2; een nieuwe quest (DQ-0001, DQ-0002, ...) heeft title, hook, region, ifIgnored, canon:"N" en expires {y,m,d} of open:true; Tolkien-figuren (TOL-) maak je niet aan; promoveer NPC's gefaseerd (ambient → named → recurring → companion_candidate → recruited) en geef elke terugkerende NPC een ID; een afwijking van de Tolkien-canon registreer je als event met divergence:true en een cause. Companions (CMP-): promoveer eerst tot companion_candidate en stel ze voor met npcs-update {introduced:true}; daarna gaat alles via "companions", nooit via npcs-status. recruit (alleen als de kandidaat bij de party is, met mode en reden: een geloofwaardig verzoek en gedeeld belang, geen verplichte quest), decline (weigering, eventueel retryAfter), depart (reden, bestemming, returnIf, expectedReturn), return (na reistijd; reden), update (hp/resources/conditions na gevechten en rust, evidence = een concrete ervaring zoals 'PCs redden een gewonde': géén vertrouwensgetal, nextAction, obligation met due), rest (short|long). Je rolt NPC-dobbelstenen zelf; 0 HP is bewusteloos, overlijden alleen via npcs status:'deceased' met reden. Boven 5 reizigers (incl. beide PC's) vraag je een logistiek plan. Regels onder 'Aan de orde (companions)' in WERELDSTATUS verwerk je in het verhaal: een companion handelt autonoom, ook buiten beeld. Een ongeldige worldDelta wordt geweigerd en je moet hem corrigeren.
- DM-notities: gebruik "dmNotes" (sleutel naar korte tekst; null verwijdert) voor alles wat de spelers niet mogen zien: de klokken A-D uit C1 (bv. "klok_a":"2/6: koerier onderschept"), geheime plannen, wat NPC's echt weten, nog niet onthulde aanwijzingen. Zet zulke geheimen NOOIT in de Stand, het logboek of vooruitlopend in de vertelling. Houd het compact en ruim afgehandelde notities op.
- Houd de Stand compact: korte zinnen, geen herhaling van canon, verwijder afgehandelde opdrachten en vertrokken NPC's (null), hoogstens ongeveer 3 kennispunten per PC.
- Worpen: zet ALLE worpen die je zelf doet of verwerkt (NPC's, vijanden, companions en de worpen die de spelers meldden) in "rolls" ({"who":"Orc 1","what":"Attack Roll","natural":14,"mod":5,"total":19,"result":"Hit"}; bij schade {"who","what":"Damage","dice":"1d8+3","total":9}). De app toont ze als chips: schrijf ze dus NIET ook nog eens als haakjes in de vertelling, en toon nooit de DC. Vertel alleen het gevolg. Verwerk een nat 20 of nat 1 als klein extra gevolg in de vertelling.
- Spelerworpen komen binnen als "[worp: Perception: 14 + 2 = 16]": het totaal is al uitgerekend met het karakterblad, reken niet opnieuw. Vraag je om een check, benoem dan de skill of save duidelijk (bv. "Perception", "Strength Saving Throw").
- Gevecht: zet "initiative" in de Stand met "active" = wie nu aan de beurt is en "order" met naam, init en enemy:true voor vijanden; werk "active" bij elke beurt bij en zet initiative op null zodra het gevecht voorbij is.
- Locatie: geef "location" (name, description = 1-2 Nederlandse zinnen, visual = Engelse beschrijving voor een landschaps- of interieurillustratie) zodra de PC's op een andere plek zijn of een plek voor het eerst beschreven wordt; laat het anders weg. Houd inGame.location gelijk aan location.name.
- HERINNERINGEN van de spelers zijn bindend en gaan voor op je eigen aannames.
- logEntries: korte feiten van wat NU echt gebeurd is.
Antwoord ALLEEN met JSON in dit formaat:
{"narration":"markdown-tekst","speakers":["Naam"],"rolls":[{"who":"","what":"","natural":0,"mod":0,"total":0,"result":""}],"newNpcs":[{"name":"Naam","visual":"English description"}],"location":{"name":"","description":"","visual":""},"dmNotes":{"klok_a":"1/6: reden"},"worldDelta":{"region":"REG-ERIADOR","time":null,"npcs":[],"quests":[],"clocks":[],"events":[]},"statePatch":{},"logEntries":[{"fact":"","inGameDate":""}],"nextTurn":{"awaiting":["Naam"],"blind":false,"prompt":"korte vraag aan de spelers","checks":{"Naam":"Perception, omdat ..."}}}`;

function rollDice(){
  const r=(s,n)=>Array.from({length:n},()=>1+crypto.getRandomValues(new Uint32Array(1))[0]%s);

function parseDM(txt,names){

  { const dn=o.dmNotes, res={}; if(dn&&typeof dn==='object'&&!Array.isArray(dn)) for(const [k,v] of Object.entries(dn).slice(0,30)){ const kk=String(k).toLowerCase().replace(/[^a-z0-9_]+/g,'_').slice(0,40); if(!kk) continue; if(v===null||v==='') res[kk]=null; else if(typeof v==='string'||typeof v==='number') res[kk]=String(v).slice(0,500); } o.dmNotes=res; }
  { const lc=o.location; o.location=(lc&&typeof lc.name==='string'&&lc.name.trim())?{name:lc.name.trim().slice(0,80),description:String(lc.description||'').slice(0,400),visual:String(lc.visual||'').slice(0,1500)}:null; }
  o.worldDelta=(o.worldDelta&&typeof o.worldDelta==='object'&&!Array.isArray(o.worldDelta))?o.worldDelta:null;

let resolving=false;
async function resolve(retry,forceGemini){

    }

    const t=(await db.ref(cp('turn',C)).get()).val();

    const allNames=[...new Set(Object.values(pl))];

    const first=!Object.keys(state).length;
    const hayArr=[]; mS.forEach(c=>{hayArr.push(c.val().text||'')});
    const hay=(hayArr.slice(-6).join(' ')+' '+pend.map(p=>p.text).join(' ')+' '+JSON.stringify(state.inGame||{})+(state.initiative?' initiative combat':'')).toLowerCase();
    const wanted=d=>{ if(d.off) return false; if(d.opening&&!first) return false; const kw=String(d.keywords||'').split(',').map(s=>s.trim().toLowerCase()).filter(Boolean); return !kw.length||kw.some(k=>hay.includes(k)); };

    const npcNames=Object.values(npcs).filter(n=>!n.forPlayer).map(n=>n.name);
    const user=
`# SPELERS\n${allNames.join(', ')}\n\n# CANON\n${canonTxt||'(nog leeg)'}\n\n# KARAKTERBLADEN (rekenkundig leidend; de Stand heeft de actuele HP)\n${sheets||'(geen)'}\n\n# SAMENVATTING VAN EERDERE RONDES\n${sums.join('\n')||'(nog geen)'}\n\n# HERINNERINGEN VAN DE SPELERS (bindend)\n${mems.join('\n')||'(geen)'}\n\n# BEKENDE NPC'S (voor "speakers")\n${npcNames.join(', ')||'(nog geen)'}\n\n# LOGBOEK (laatste 40)\n${logs.slice(-40).map(l=>'- ['+(l.inGameDate||'')+'] '+l.fact).join('\n')||'(leeg)'}\n\n# ACTUELE STAND\n${JSON.stringify(state)}\n\n# WERELDSTATUS (stabiele IDs; wijzig alleen via worldDelta)\n${worldTxt||'(niet actief)'}\n\n# DM-NOTITIES (privé: nooit tonen of citeren)\n${notesTxt||'(nog geen)'}\n\n# RECENTE GESCHIEDENIS\n${hist||'(begin van het verhaal)'}\n\n# VOORGEGOOIDE DOBBELSTENEN VOOR NPC/VIJAND (in volgorde gebruiken)\n${JSON.stringify(rollDice())}\n\n# ACTIES DEZE RONDE\n${pend.length?pend.map(p=>p.name+': '+p.text).join('\n'):'(geen: open het verhaal met de startsituatie uit canon/stand)'}`;
    let out,usage,usedModel,note=null;

      if(world&&window.DNDWorld&&parsed.worldDelta){

        else parsed._wp=v;
      }
      out=parsed;break;
    }
    const newState=deepMerge(state,out.statePatch);
    const up={};const now=Date.now();const msgKeys=[],logKeys=[];
    const lastS=await db.ref(cp('stands',C)).orderByKey().limitToLast(1).get(); let lastKey=null; lastS.forEach(c=>{lastKey=c.key});

    pend.forEach((p,i)=>{const k=db.ref(cp('messages',C)).push().key;msgKeys.push(k);up[cp('messages/'+k,C)]={type:p.pass?'pass':'action',author:p.name,text:p.text,round,t:now+i}});
    const nk=db.ref(cp('messages',C)).push().key;
    const nm={type:'narration',author:'dm',text:out.narration,round:round+1,t:now+pend.length+1};
    if(out.speakers.length) nm.speakers=out.speakers;
    if(out.rolls.length) nm.rolls=out.rolls;
    msgKeys.push(nk); up[cp('messages/'+nk,C)]=nm;
    out.logEntries.forEach(l=>{if(l&&l.fact){const k=db.ref(cp('log',C)).push().key;logKeys.push(k);up[cp('log/'+k,C)]={fact:String(l.fact),inGameDate:String(l.inGameDate||''),round:round+1,t:now}}});
    out.newNpcs.forEach(n=>{const k=slug(n.name); if(!npcs[k]) up['dnd/npcs/'+k]={name:n.name.trim(),visual:String(n.visual||'').slice(0,1500),t:now,from:C}});
    if(out.location){const lk=slug(out.location.name); if(!locs[lk]){up['dnd/locations/'+lk]={name:out.location.name,desc:out.location.description,visual:out.location.visual,t:now,from:C}; nm.newLoc=lk;} up[cp('scene',C)]=lk;}
    const newNotes={...notes}; for(const [k,v] of Object.entries(out.dmNotes)){ if(v===null) delete newNotes[k]; else newNotes[k]=v; }
    up[cp('dmnotes',C)]=Object.keys(newNotes).length?newNotes:null;
    const worldPrev=[];
    if(world&&window.DNDWorld&&(out._wp||(out.worldDelta&&out.worldDelta.region))){
      const emptyPlan={npcs:{},quests:{},clocks:{},companions:{},calendar:null,divergences:[],events:[]};
      const cm=DNDWorld.commitPaths(world,out._wp?out._wp.plan:emptyPlan,{now:now,region:out.worldDelta&&out.worldDelta.region,newKey:()=>db.ref(cp('world/events',C)).push().key});
      Object.keys(cm.set).forEach(pth=>{up[cp(pth,C)]=cm.set[pth]});
      cm.prev.forEach(x=>worldPrev.push(x));
    }
    if(worldRejected){ const wk=db.ref(cp('messages',C)).push().key; msgKeys.push(wk); up[cp('messages/'+wk,C)]={type:'system',author:'systeem',text:'⚠ De DM stelde een wereldwijziging voor die de wereldregels schendt; die is niet toegepast: '+worldRejected.join('; '),round:round+1,t:now+pend.length+2}; }
    const sj=JSON.stringify(newState), rk=String(round+1).padStart(5,'0');
    up[cp('state',C)]=sj;
    up[cp('stands/'+rk,C)]={json:sj,round:round+1,t:now,undo:{worldPrev:worldPrev,prevNotes:Object.keys(notes).length?notes:null,prevState:sS.val()||'{}',turn:t,pend:pendE.map(([k,p])=>({uid:k,...p})),msgs:msgKeys,logs:logKeys}};
    up[cp('usage/'+rk,C)]={prompt:usage.promptTokenCount||0,cached:usage.cachedContentTokenCount||0,out:usage.candidatesTokenCount||0,model:usedModel||'?'};
    up[cp('pending',C)]=null;
    up['dnd/campaignIndex/'+C+'/lastPlayed']=now;
    up['dnd/campaignIndex/'+C+'/round']=round+1;
    const aw={};out.nextTurn.awaiting.forEach(n=>aw[n]=true);
    up[cp('turn',C)]={round:round+1,status:'waiting',awaiting:aw,prompt:out.nextTurn.prompt,blind:out.nextTurn.blind,checks:out.nextTurn.checks||null,mode:out.nextTurn.awaiting.length>1?'all':'single'};
    await db.ref().update(up);
    summarize(C,round+1,false).catch(e=>console.warn('samenvatting mislukt',e));
  }catch(e){
    console.error(e);
    await db.ref(cp('turn',C)).update({status:'error',lastError:String(e.message||e),resolvingSince:null});
  }finally{ resolving=false; }
}

function getState(){try{return JSON.parse(stateStr)||{}}catch(e){return{}}}
function itemText(x){
  if(x==null) return '';
  if(typeof x!=='object') return String(x);
  const t=x.title||x.name||x.quest||x.naam||x.titel||'', d=x.detail||x.description||x.beschrijving||x.status||x.summary||'';
  return t&&d?t+' — '+d:(t||d||Object.values(x).filter(v=>typeof v!=='object').join(' · '));
}
function listOf(x){
  if(!x) return [];
  if(Array.isArray(x)) return x.map(itemText).filter(Boolean);
  if(typeof x==='object') return Object.entries(x).map(([k,v])=>k+': '+(typeof v==='object'&&v?itemText(v):v));
  return [String(x)];
}
function hpOf(c){
  let hp=c&&(c.hp!=null?c.hp:c.HP); if(hp==null) return null;
  if(typeof hp==='object'){const cur=Number(hp.current!=null?hp.current:hp.cur),max=Number(hp.max!=null?hp.max:hp.maximum);
    return isFinite(cur)&&isFinite(max)&&max>0?{cur,max,temp:Number(hp.temp)||0}:null}
  if(typeof hp==='string'){const m=hp.match(/(\d+)\s*\/\s*(\d+)/); return m?{cur:+m[1],max:+m[2],temp:0}:null}
  return null;
}
function avatar(name){
  const k=slug(name), n=npcs[k];
  return n&&n.img?'<img class="av" src="'+n.img+'" data-zoom="'+k+'" alt="">':'<div class="av">'+esc(String(name).charAt(0).toUpperCase())+'</div>';
}
function renderParty(){
  const S=getState(), sb=$('#scenebar'), pb=$('#partybar'); if(!sb||!pb) return;
  const g=S.inGame||{}, pcs=Object.entries(S.pcs||{});
  const loc=g.location||g.plaats||(pcs[0]&&pcs[0][1]&&pcs[0][1].location)||'';
  const bits=[loc&&'📍 '+loc,g.date&&'📅 '+g.date,g.timeOfDay].filter(Boolean);
  sb.textContent=bits.join(' · ');
  const members=[...pcs.map(([k,v])=>({name:(v&&v.name)||k,c:v||{}})),...Object.entries(S.companions||{}).map(([k,v])=>({name:(v&&v.name)||k,c:v||{},comp:true}))];
  pb.innerHTML=members.map(m=>{
    const c=m.c, hp=hpOf(c);
    const pct=hp?Math.max(0,Math.min(100,Math.round(hp.cur/hp.max*100))):0, cls=pct<=25?'low':pct<=60?'mid':'';
    const res=listOf(c.resources).slice(0,4).map(r=>'<span class="chip">'+esc(r)+'</span>').join('');
    const con=listOf(c.conditions).slice(0,3).map(r=>'<span class="chip bad">'+esc(r)+'</span>').join('');
    return '<div class="pc">'+avatar(m.name)+'<div class="pi"><b>'+esc(m.name)+'</b>'+(m.comp?' <small>metgezel</small>':'')+
      (hp?'<div class="hpb"><i class="'+cls+'" style="width:'+pct+'%"></i></div><small>HP '+hp.cur+'/'+hp.max+(hp.temp?' (+'+hp.temp+')':'')+'</small>':'')+
      '<div class="chips">'+res+con+'</div></div></div>';
  }).join('');

function rollChip(r){
  const nat=r.natural!=null&&isFinite(Number(r.natural))?Number(r.natural):null, mod=Number(r.mod)||0;
  const expr=nat!==null?nat+(mod?(mod>0?' + ':' − ')+Math.abs(mod):'')+' = '+r.total:(r.dice?r.dice+' = ':'')+r.total;
  const res=String(r.result||'').toLowerCase();
  const good=/succ|hit|raak|geslaagd|slaagt|gelukt/.test(res), bad=/fail|miss|mis|mislukt|faalt/.test(res);
  const cls='rc '+(nat===20?'n20':nat===1?'n1':good?'ok':bad?'ko':'');
  return '<span class="'+cls+'">🎲 <b>'+esc(r.who)+'</b> · '+esc(r.what)+': '+esc(expr)+(r.result?' · '+esc(r.result):'')+(nat===20?' ✨':nat===1?' 💥':'')+'</span>';
}
function renderInit(){
  const bar=$('#initbar'); if(!bar) return;
  const S=getState(), ini=S.initiative;
  let order=Array.isArray(ini)?ini:(ini&&Array.isArray(ini.order)?ini.order:[]);
  if(!order.length){ bar.innerHTML=''; return; }
  const active=(ini&&!Array.isArray(ini))?ini.active:null;
  const friends=new Set([...Object.entries(S.pcs||{}).map(([k,v])=>(v&&v.name)||k),...Object.entries(S.companions||{}).map(([k,v])=>(v&&v.name)||k)]);
  order=order.filter(o=>o&&(o.name||typeof o==='string')).map(o=>typeof o==='string'?{name:o}:o);
  if(order.every(o=>isFinite(Number(o.init)))) order=order.slice().sort((a,b)=>Number(b.init)-Number(a.init));
  bar.innerHTML='<span class="lbl">⚔ Initiative</span>'+order.map(o=>{

async function undoLast(mode,big){
  const C=cid, now=Date.now();
  const ss=await db.ref(cp('stands',C)).orderByKey().limitToLast(1).get(); let rec=null,key=null;
  ss.forEach(c=>{rec=c.val();key=c.key});
  if(!rec||!rec.undo){alert('Er is niets om terug te draaien (alleen de laatste beurt kan terug).');return}
  const u=rec.undo, up={};
  (u.msgs||[]).forEach(k=>{up[cp('messages/'+k,C)]=null});
  (u.logs||[]).forEach(k=>{up[cp('log/'+k,C)]=null});
  up[cp('stands/'+key,C)]=null; up[cp('usage/'+key,C)]=null;
  up[cp('state',C)]=u.prevState||'{}';
  up[cp('dmnotes',C)]=u.prevNotes||null;
  (u.worldPrev||[]).forEach(x=>{up[cp(x.p,C)]=(x.v===undefined?null:x.v)});
  up['dnd/campaignIndex/'+C+'/round']=Math.max(0,(rec.round||1)-1);
  const pend=u.pend||[], authors={};
  pend.forEach(p=>{const {uid,...rest}=p; up[cp('pending/'+uid,C)]=rest; authors[p.name]=true});
  const t=u.turn||{round:0};
  if(!pend.length&&(t.round||0)===0&&mode==='back'){ up[cp('turn',C)]=null; }
  else if(mode==='regen'){ up[cp('turn',C)]={...t,status:'resolving',resolvingSince:now,awaiting:null,lastError:null}; }
  else { up[cp('turn',C)]={...t,status:'waiting',awaiting:Object.keys(authors).length?authors:null,resolvingSince:null,lastError:null}; }
  await db.ref().update(up);
  if(mode==='regen'){ bigNext=!!big; resolve(false); }
}

const SUMSYS='Je vat voor een D&D-campagne in Midden-aarde de nieuwe berichten samen als feitelijke recap in het Nederlands, in maximaal 180 woorden: wie, wat, waar, beslissingen, gevolgen en openstaande lijnen. Neem de eerdere samenvatting over waar die nog relevant is. Gebruik alleen wat in de berichten staat; voeg geen geheimen of verzinsels toe. Geen opsommingstekens of kopjes, korte alinea\'s.';
async function summarize(C,upTo,force){
  const ss=await db.ref(cp('summaries',C)).get(); let covered=0; const prev=[];
  ss.forEach(c=>{const v=c.val();covered=Math.max(covered,v.toRound||0);prev.push(v.text)});
  if(!force&&upTo-covered<15) return false;
  const ms=await db.ref(cp('messages',C)).limitToLast(500).get(); const list=[];
  ms.forEach(c=>{const m=c.val(); if(m.type!=='system'&&m.round>covered&&m.round<=upTo) list.push(m)});
  if(list.length<4) return false;
  const text=list.map(m=>(m.type==='narration'?'DM':m.author)+': '+m.text).join('\n\n');
  const r=await callLLM(SUMSYS,'# EERDERE SAMENVATTING\n'+(prev.join('\n')||'(geen)')+'\n\n# NIEUWE BERICHTEN\n'+text,null,false,{model:provider()==='anthropic'?(cfg.anthropicModel||'claude-haiku-5-5'):(cfg.summaryModel||'gemini-2.5-flash-lite')});
  await db.ref(cp('summaries/'+String(upTo).padStart(5,'0'),C)).set({fromRound:covered+1,toRound:upTo,text:r.txt.trim(),t:Date.now()});
  return true;
}

/* ---------- Karakterblad ---------- */
const ABIL=[['str','Strength','STR'],['dex','Dexterity','DEX'],['con','Constitution','CON'],['int','Intelligence','INT'],['wis','Wisdom','WIS'],['cha','Charisma','CHA']];
const SKILLS=[['acrobatics','Acrobatics','dex'],['animal handling','Animal Handling','wis'],['arcana','Arcana','int'],['athletics','Athletics','str'],['deception','Deception','cha'],['history','History','int'],['insight','Insight','wis'],['intimidation','Intimidation','cha'],['investigation','Investigation','int'],['medicine','Medicine','wis'],['nature','Nature','int'],['perception','Perception','wis'],['performance','Performance','cha'],['persuasion','Persuasion','cha'],['religion','Religion','int'],['sleight of hand','Sleight of Hand','dex'],['stealth','Stealth','dex'],['survival','Survival','wis']];
const SKNL={atletiek:'athletics',waarneming:'perception',overleven:'survival',inzicht:'insight',intimidatie:'intimidation',intimideren:'intimidation',overtuigen:'persuasion',overtuigingskracht:'persuasion',heimelijkheid:'stealth',sluipen:'stealth',acrobatiek:'acrobatics',geschiedenis:'history',natuurkennis:'nature',onderzoek:'investigation',geneeskunde:'medicine',religie:'religion',bedrog:'deception',misleiden:'deception',optreden:'performance',vingervlugheid:'sleight of hand',dierenhandling:'animal handling',omgaan:'animal handling'};
const ABNL={kracht:'str',behendigheid:'dex',lichaamsbouw:'con',conditie:'con',intelligentie:'int',wijsheid:'wis',charisma:'cha'};
let sheetKey='', sheetRage=false, sheetRoll='', sheetEdit=false;
let rollKey=null, rollNat='', rollRage=false;

function amod(c,k){return Math.floor((((c.abilities||{})[k])||10)/2-5)}
function pbOf(c){return Math.floor(((Number(c.level)||1)-1)/4)+2}
function sgn(n){return (n>=0?'+':'−')+Math.abs(n)}
function skillBonus(c,key,rage){
  const s=SKILLS.find(x=>x[0]===key); if(!s) return 0;
  let ab=s[2]; if(rage&&(c.rageSkills||[]).includes(key)) ab='str';
  return amod(c,ab)+pbOf(c)*(((c.skills||{})[key])||0);
}
function myChar(){const l=allChars().filter(c=>!c.dead); return l.find(c=>me&&c.player===me.name)||null}
function allChars(){return Object.entries(chars).map(([k,v])=>({k,...v}))}
function rollList(c,rage){
  const pb=pbOf(c), out=[];
  out.push({key:'init',group:'Initiative',label:'Initiative',bonus:amod(c,'dex')+(Number(c.initiativeBonus)||0)});
  ABIL.forEach(([k,n,s])=>out.push({key:'abil:'+k,group:'Ability Check',label:n+' check',bonus:amod(c,k)}));
  ABIL.forEach(([k,n,s])=>out.push({key:'save:'+k,group:'Saving Throw',label:n+' Saving Throw',bonus:amod(c,k)+((c.saves||[]).includes(k)?pb:0)}));
  SKILLS.forEach(([k,n,a])=>out.push({key:'skill:'+k,group:'Skill',label:n,bonus:skillBonus(c,k,rage)}));
  (c.attacks||[]).forEach((a,i)=>out.push({key:'atk:'+i,group:'Attack',label:(a.name||'Aanval')+' (attack)',bonus:amod(c,a.ability||'str')+(a.prof===false?0:pb)+(Number(a.extra)||0)}));
  return out;
}
function findRoll(c,key,rage){return rollList(c,rage).find(r=>r.key===key)||null}
function matchCheck(text){
  const t=String(text||'').toLowerCase();
  const abKey=w=>{const e=ABIL.find(a=>a[1].toLowerCase()===w); return e?e[0]:(ABNL[w]||'')};
  let m=t.match(/(strength|dexterity|constitution|intelligence|wisdom|charisma|kracht|behendigheid|lichaamsbouw|conditie|intelligentie|wijsheid)\s*(?:\(?[a-z ]*\)?\s*)?(saving throw|saving|save|redding)/);
  if(m){const k=abKey(m[1]); if(k) return 'save:'+k;}
  if(/initiative|initiatief/.test(t)) return 'init';
  for(const [k,n] of SKILLS){ if(t.includes(n.toLowerCase())) return 'skill:'+k; }
  for(const w of Object.keys(SKNL)){ if(t.includes(w)) return 'skill:'+SKNL[w]; }
  m=t.match(/(strength|dexterity|constitution|intelligence|wisdom|charisma|kracht|behendigheid|lichaamsbouw|intelligentie|wijsheid)\s*(check|test|proef)/);
  if(m){const k=abKey(m[1]); if(k) return 'abil:'+k;}
  return '';
}
function rollText(r,nat){const tot=nat+r.bonus; return r.label+': '+nat+' '+(r.bonus>=0?'+ ':'− ')+Math.abs(r.bonus)+' = '+tot;}

/* --- in het spel: worp bij de actie --- */
function rollRowHtml(){
  const c=myChar();
  if(!c) return '<div class="row"><input type="text" id="roll" placeholder="Worp (bv. nat 14 +3)" style="flex:1;min-width:120px"></div>';
  if(rollKey===null){const req=turn&&turn.checks&&turn.checks[me.name]; rollKey=req?matchCheck(req):'';}
  const list=rollList(c,rollRage), groups=[...new Set(list.map(r=>r.group))];
  const opts=groups.map(g=>'<optgroup label="'+g+'">'+list.filter(r=>r.group===g).map(r=>'<option value="'+r.key+'"'+(r.key===rollKey?' selected':'')+'>'+esc(r.label)+' ('+sgn(r.bonus)+')</option>').join('')+'</optgroup>').join('');
  return '<div class="row"><select id="rsel" style="flex:2;min-width:150px"><option value="">🎲 Geen worp meegeven</option>'+opts+'</select>'+
    '<input type="number" id="rnat" inputmode="numeric" min="1" max="20" placeholder="d20" value="'+esc(rollNat)+'" style="width:78px">'+
    '<span id="rout" class="chip" style="font-size:13px;padding:4px 10px"></span>'+

function updateRoll(){
  const c=myChar(), out=$('#rout'); if(!c||!out) return;
  const r=rollKey?findRoll(c,rollKey,rollRage):null, nat=Number(rollNat);
  if(r&&nat>=1&&nat<=20){ rollDraft=rollText(r,nat); out.textContent='= '+(nat+r.bonus)+(nat===20?' ✨':nat===1?' 💥':''); }
  else { rollDraft=''; out.textContent=r?('bonus '+sgn(r.bonus)):'—'; }
}
function wireRoll(){
  const f=$('#roll'); if(f){ f.value=rollDraft; f.oninput=e=>{rollDraft=e.target.value}; return; }
  const sel=$('#rsel'); if(!sel) return;
  sel.onchange=e=>{rollKey=e.target.value; updateRoll()};
  $('#rnat').oninput=e=>{rollNat=e.target.value; updateRoll()};
  const rg=$('#rrage'); if(rg) rg.onchange=e=>{rollRage=e.target.checked; e.target.blur(); renderGame(); }
  updateRoll();
}

function readEditor(el,old){
  const v=id=>el.querySelector('#'+id), n=(id,d)=>{const x=Number(v(id).value);return isFinite(x)?x:d};
  const c={name:v('e_name').value.trim(),player:v('e_player').value,level:n('e_level',1),ac:n('e_ac',10),hpMax:n('e_hp',10),speed:n('e_speed',30),initiativeBonus:n('e_init',0),hitDice:v('e_hd').value.trim(),
    class:v('e_class').value.trim(),subclass:v('e_sub').value.trim(),species:v('e_species').value.trim(),background:v('e_bg').value.trim(),alignment:v('e_align').value.trim(),
    abilities:{},saves:[],skills:{},features:v('e_feat').value,spellInfo:v('e_spi').value.trim(),spells:v('e_spl').value,equipment:v('e_eq').value,languages:v('e_lang').value,proficiencies:v('e_prof').value,appearance:v('e_app').value,backstory:v('e_back').value,
    currency:{gp:n('e_gp',0),sp:n('e_sp',0),cp:n('e_cp',0)}};
  ABIL.forEach(([k])=>{c.abilities[k]=n('e_ab_'+k,10); if(v('e_sv_'+k).checked) c.saves.push(k);});
  SKILLS.forEach(([k],i)=>{const x=Number(v('e_sk_'+i).value); if(x) c.skills[k]=x;});
  c.rageSkills=v('e_rage').checked?['acrobatics','intimidation','perception','stealth','survival']:[];
  c.attacks=v('e_atk').value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const p=l.split('|').map(s=>s.trim()); return {name:p[0]||'Aanval',ability:(p[1]||'str').toLowerCase(),prof:!/^n/i.test(p[2]||'y'),damage:p[3]||'',notes:p[4]||'',extra:Number(p[5])||0}});
  if(old) Object.keys(old).forEach(k=>{ if(!(k in c)&&k!=='k') c[k]=old[k]; });
  c.t=Date.now();
  return c;
}
function updateRollPanel(el){

function renderSheet(el,prefix){
  if(!el) return;
  const list=allChars();
  if(!sheetKey||!chars[sheetKey]){const m=myChar(); sheetKey=m?m.k:(list[0]?list[0].k:'');}
  let h=(prefix||'')+'<div class="row" style="margin-bottom:8px">'+list.map(c=>'<button class="b sm'+(c.k===sheetKey&&sheetEdit!=='new'?'':' alt')+'" data-sk="'+c.k+'">'+(c.dead?'☠ ':'')+esc(c.name)+'</button>').join('')+'<button class="b alt sm" data-newchar="1">＋ Nieuw personage</button></div>';
  if(sheetEdit==='new') h+=editorHtml({player:me?me.name:''},true);
  else if(sheetEdit&&chars[sheetKey]) h+=editorHtml({k:sheetKey,...chars[sheetKey]},false);
  else if(sheetKey&&chars[sheetKey]) h+=sheetHtml({k:sheetKey,...chars[sheetKey]});
  else h+='<p style="color:var(--mute)">Nog geen personage. Maak er een met "＋ Nieuw personage".</p>';
  el.innerHTML=h;
  if(!el._sheetWired){
    el._sheetWired=true;
    el.addEventListener('click',async e=>{
      const t=e.target, q=s=>t.closest(s);
      if(q('[data-sk]')){sheetKey=q('[data-sk]').dataset.sk; sheetEdit=false; sheetRoll=''; return renderSheet(el,prefix);}
      if(q('[data-newchar]')){sheetEdit='new'; return renderSheet(el,prefix);}
      if(q('[data-edit]')){sheetEdit=true; return renderSheet(el,prefix);}
      if(q('[data-dead]')){ const cc0=chars[sheetKey]; if(cc0&&confirm(cc0.dead?cc0.name+' weer actief maken?':cc0.name+' markeren als gesneuveld/gepensioneerd? (Het blad blijft bewaard, maar de DM speelt dit personage niet meer mee.)')) await db.ref('dnd/characters/'+sheetKey+'/dead').set(cc0.dead?null:true); return; }
      if(q('[data-cancel]')){sheetEdit=false; return renderSheet(el,prefix);}
      if(q('[data-save]')){
        const old=sheetEdit==='new'?null:chars[sheetKey]; const c=Object.assign({},old||{},readEditor(el,old));
        if(!c.name){alert('Geef het personage een naam.');return}
        const k=slug(c.name), up={}; up['dnd/characters/'+k]=c;
        if(old&&k!==sheetKey) up['dnd/characters/'+sheetKey]=null;
        sheetKey=k; sheetEdit=false; await db.ref().update(up); return;
      }
      if(q('[data-delchar]')){ if(confirm('Personage definitief wissen?')){const dk=sheetKey; sheetEdit=false; sheetKey=''; await db.ref('dnd/characters/'+dk).remove();} return; }
      if(q('[data-roll]')){sheetRoll=q('[data-roll]').dataset.roll; el.querySelectorAll('.rl').forEach(x=>x.classList.toggle('on',x.dataset.roll===sheetRoll)); updateRollPanel(el); const p=el.querySelector('#rollpanel'); if(p) p.scrollIntoView({block:'nearest'}); return;}
      if(q('[data-copy]')){
        const c={k:sheetKey,...chars[sheetKey]}, r=findRoll(c,sheetRoll,sheetRage), nat=Number(el.querySelector('#rn').value);
        if(r&&nat>=1&&nat<=20) copyText('[worp: '+rollText(r,nat)+']',q('[data-copy]')); else alert('Vul eerst je natural d20 in.');
        return;
      }
      if(q('[data-use]')){
        const nat=Number(el.querySelector('#rn').value); if(!(nat>=1&&nat<=20)){alert('Vul eerst je natural d20 in.');return}
        rollKey=sheetRoll; rollNat=String(nat); rollRage=sheetRage; setTab('game'); return;
      }
    });
    el.addEventListener('change',e=>{ if(e.target.id==='shrage'){sheetRage=e.target.checked; renderSheet(el,prefix);} });
  }
  updateRollPanel(el);
}

function sheetText(c){
  const pb=pbOf(c);
  const sk=SKILLS.filter(s=>(c.skills||{})[s[0]]).map(s=>s[1]+' '+sgn(skillBonus(c,s[0]))).join(', ');
  const sv=ABIL.filter(a=>(c.saves||[]).includes(a[0])).map(a=>a[2]+' '+sgn(amod(c,a[0])+pb)).join(', ');
  return '## '+c.name+' (speler: '+c.player+') — Level '+c.level+' '+[c.species,c.class+(c.subclass?' ('+c.subclass+')':''),c.background].filter(Boolean).join(', ')+'\n'+
    'AC '+c.ac+', max HP '+c.hpMax+', Speed '+c.speed+' ft, Proficiency +'+pb+'. '+ABIL.map(a=>a[2]+' '+((c.abilities||{})[a[0]]||10)+' ('+sgn(amod(c,a[0]))+')').join(', ')+'\n'+
    'Saves: '+(sv||'—')+'. Skills: '+(sk||'—')+'.\n'+
    ((c.attacks||[]).length?'Aanvallen: '+c.attacks.map(a=>a.name+' '+sgn(amod(c,a.ability||'str')+(a.prof===false?0:pb)+(Number(a.extra)||0))+(a.damage?' ('+a.damage+')':'')).join('; ')+'\n':'')+(c.spellInfo||c.spells?'Spellcasting: '+[c.spellInfo,c.spells].filter(Boolean).join(' ').replace(/\n+/g,' ')+'\n':'')+
    (c.features?'Features: '+c.features.replace(/\n+/g,' ')+'\n':'')+(c.equipment?'Uitrusting: '+c.equipment.replace(/\n+/g,' ')+'\n':'')+(c.personality?'Persoonlijkheid: '+c.personality.replace(/\n+/g,' ').slice(0,400)+'\n':'')+(c.dmHooks?'Haken: '+c.dmHooks.replace(/\n+/g,' ').slice(0,500)+'\n':'');
}

    if(s.sub){ const sb=cls.subs.find(x=>x[0]===s.sub); out.push('• Subclass — '+s.sub+(sb?': '+sb[1]:'')); }

    if(s.expertise.length) out.push('• Expertise: '+s.expertise.map(ccSk).join(', '));
    if(s.cls==='Barbarian'&&L>=3) out.push('• Primal Knowledge: tijdens Rage STR voor Acrobatics, Intimidation, Perception, Stealth, Survival');
    if(L>=4) out.push('• Level 4: '+(s.asiMode==='feat'?'Feat — '+(s.asiFeat||'(nog kiezen)'):'Ability Score Improvement'));
  }
  if(R.feats&&R.feats.length){ out.push('— Feats —'); R.feats.forEach(f=>out.push('• '+f+': '+(CC_FEATS[f]||''))); if(s.miNote.trim()) out.push('• Magic Initiate-keuzes: '+s.miNote.trim()); }
  if(R.spell){ const sp2=R.spell; out.push('— Spellcasting —'); out.push('• Ability: '+sp2.ab.toUpperCase()+' · Spell Save DC '+sp2.dc+' · Spell Attack '+sgn(sp2.atk)); if(sp2.slots.length) out.push('• Slots: '+sp2.slots.join(', ')); out.push('• Cantrips: '+sp2.cant+' · Voorbereide spells: '+sp2.prep); if(s.cantrips.trim()) out.push('• Cantrips: '+s.cantrips.trim()); if(s.spells.trim()) out.push('• Spells: '+s.spells.trim()); }
  return out.join('\n');
}
function ccRecord(s,R){
  const cls=CC_CLASSES[s.cls], bg=CC_BG[s.bg], c={};
  const gp=(cls?(s.eqClass==='A'?cls.eqA.gp:cls.eqB):0)+(bg?(s.eqBg==='A'?bg.gp:50):0);
  const langs=['Common (Westron)'].concat((s.langs||[]).filter(Boolean)).concat(String(s.extraLangs||'').split(',').map(x=>x.trim()).filter(Boolean));
  const armorP=ccArmorProf(s.cls,s), wpTxt=cls?({SM:'Simple + Martial weapons',S:'Simple weapons',SMl:'Simple weapons + Martial weapons met Light',SMf:'Simple weapons + Martial weapons met Finesse of Light'})[(s.cls==='Cleric'&&s.choice==='Protector')||(s.cls==='Druid'&&s.choice==='Warden')?'SM':cls.wp]:'';
  const tools=[cls&&cls.tools!=='—'?cls.tools:'',bg?(s.bgTool.trim()||bg.tool):''].filter(Boolean).join('; ');
  const inv=R.inv.slice();
  const eq=inv.concat(R.worn&&R.worn.type!=='none'?['(draagt: '+R.worn.label+(R.wearShield?' + Shield':'')+')']:R.wearShield?['(draagt: Shield)']:[]);
  Object.assign(c,{name:s.name.trim(),player:s.player,level:R.L,ac:R.ac,hpMax:R.hp||10,speed:R.speed,initiativeBonus:R.initBonus,hitDice:R.hitDice||'',
    class:s.cls,subclass:s.sub,species:s.species==='Halfling'?'Halfling (Hobbit)':(s.species+(s.species==='Elf'?' ('+s.lineage+')':'')),background:s.bg,alignment:s.alignment,
    abilities:R.fin,saves:cls?cls.saves.slice():[],skills:R.skills,
    rageSkills:(s.cls==='Barbarian'&&R.L>=3)?['acrobatics','intimidation','perception','stealth','survival']:[],
    attacks:R.attacks,features:ccFeaturesText(s,R),equipment:eq.join('\n'),currency:{gp:gp,sp:0,cp:0},
    languages:'Languages: '+langs.join(', '),
    proficiencies:'Armor: '+(armorP.length?armorP.join(', '):'geen')+'\nWeapons: '+wpTxt+(tools?'\nTools: '+tools:''),
    appearance:s.appearance,
    personality:[s.traits&&'Eigenschappen: '+s.traits,s.ideal&&'Ideaal: '+s.ideal,s.bond&&'Band: '+s.bond,s.flaw&&'Zwakte: '+s.flaw].filter(Boolean).join('\n'),
    backstory:[s.backstory,s.family&&'Familie & relaties:\n'+s.family,s.aanleiding&&'Aanleiding / startsituatie:\n'+s.aanleiding].filter(Boolean).join('\n\n'),
    secrets:s.secrets,dmHooks:[s.hooks&&s.hooks,s.openDM&&'Nog open / DM-goedkeuring:\n'+s.openDM,(R.dmflags||[]).length&&'Automatisch gesignaleerd:\n• '+R.dmflags.join('\n• ')].filter(Boolean).join('\n\n'),
    concept:s.concept,createdBy:'creator',t:Date.now()});
  return c;
}

      ccTa('aanleiding','Aanleiding / startsituatie (bv. waarom ben je in Rivendell voor de Council?)',s.aanleiding,90)+ccTa('secrets','Geheimen die alleen jouw personage kent (alleen jij en de DM zien dit)',s.secrets,70)+
      '<h3 style="margin-top:12px">Haken voor de DM</h3>'+tip('Open verhaallijnen, onopgeloste conflicten en NPC\'s die de DM kan uitwerken. Maak onderscheid tussen wat jij vaststelt en wat de DM mag invullen.')+
      '<div class="row"><button class="b alt" data-ai="hooks"'+(ccBusy?' disabled':'')+'>'+(ccBusy==='hooks'?'Gemini denkt…':'✨ Stel DM-haken voor uit mijn backstory')+'</button></div>'+
      ccTa('hooks','DM-haken',s.hooks,120)+ccTa('openDM','Nog open / ter goedkeuring door de DM',s.openDM,60,'Bv. de Beorn-afstamming en een eventuele beertransformatie.');
  }
  /* stap 7: controle */
  const rec=ccRecord(s,R);
  let h='<h3>Controle</h3>';
  if(R.issues.length) h+='<div class="card" style="border:1px solid var(--red)"><b class="err">Opgelost moet worden</b><br>'+R.issues.map(x=>'<small>• '+esc(x)+'</small>').join('<br>')+'</div>';
  if(R.warn.length) h+='<div class="card" style="border:1px solid #6a5a44"><b>Nog te doen</b><br>'+R.warn.map(x=>'<small>• '+esc(x)+'</small>').join('<br>')+'</div>';
  if((R.dmflags||[]).length) h+='<div class="card"><b>Voor DM-goedkeuring</b><br>'+R.dmflags.map(x=>'<small>• '+esc(x)+'</small>').join('<br>')+'</div>';
  h+=sheetHtml(Object.assign({k:'_preview'},rec)).replace(/<button class="b alt sm" data-edit="1">[^<]*<\/button>/,'').replace(/<div id="rollpanel"[^>]*><\/div>/,'');
  h+='<div class="row" style="margin:8px 0"><button class="b" data-ccsave="1"'+(R.ready?'':' disabled')+'>✔ Personage opslaan</button><button class="b alt" data-cccopy="1">Kopieer overdracht voor de DM</button></div>'+
     '<p class="cctip">Opslaan zet het personage in het Karakterblad (zichtbaar voor jullie allebei). Daar kun je alles nog handmatig bijwerken. Wanneer dit je nieuwe personage is, wordt je vorige personage gemarkeerd als gesneuveld.</p>';
  return h;
}
function ccRender(){
  const box=$('#ccbox'); if(!box) return;
  const st=box.scrollTop, R=ccCalc(cc);
  const chips='<div class="ccsteps">'+CC_STEPS.map((t,i)=>'<button class="ccstep'+(i===ccStep?' on':'')+(i<ccStep?' done':'')+'" data-ccgo="'+i+'">'+(i+1)+'<span> '+esc(t)+'</span></button>').join('')+'</div>';
  const nav='<div class="row ccnav"><button class="b alt" data-ccnav="-1"'+(ccStep===0?' disabled':'')+'>‹ Vorige</button><span style="flex:1;text-align:center;color:var(--mute);font-size:13px">'+(ccStep+1)+' / '+CC_STEPS.length+' · '+esc(CC_STEPS[ccStep])+'</span><button class="b" data-ccnav="1"'+(ccStep===CC_STEPS.length-1?' disabled':'')+'>Volgende ›</button></div>';
  const summary='<div class="ccsum">'+esc((cc.name||'Naamloos')+' · '+[cc.species&&CC_SPECIES[cc.species].label,cc.cls&&(cc.cls+(cc.sub?' ('+cc.sub+')':'')),cc.bg].filter(Boolean).join(' · '))+(R.hp?' · HP '+R.hp+' · AC '+R.ac:'')+'</div>';
  box.innerHTML=chips+summary+'<div class="card ccbody">'+ccStepHtml(R)+'</div>'+nav;
  box.scrollTop=st;
}
function menuCreate(){
  if(!cc) cc=ccLoad();
  if(!cc.player&&me) cc.player=me.name;
  main.innerHTML='<div class="scroll" id="ccscroll">'+backBar('Personage maken')+'<div id="ccbox"></div></div>';
  $('#back').onclick=()=>showMenu('home');
  const box=$('#ccbox');
  box.addEventListener('input',e=>{const t=e.target; if(t.dataset.f&&!t.dataset.r&&t.type!=='radio'){ccSet(t.dataset.f,t.value); ccSave(); if(/^man\./.test(t.dataset.f)) ccRefreshSums();}});
  box.addEventListener('change',e=>{
    const t=e.target;
    if(t.dataset.pick){
      const arr=cc[t.dataset.pick], max=Number(t.dataset.max), i=arr.indexOf(t.value);
      if(t.checked){ if(arr.length>=max){t.checked=false; return;} if(i<0) arr.push(t.value); } else if(i>=0) arr.splice(i,1);
      ccSave(); return ccRender();
    }
    if(t.dataset.f&&t.type==='radio'){ ccSet(t.dataset.f,t.dataset.v); ccSave(); return ccRender(); }
    if(t.dataset.f&&t.dataset.r){
      ccSet(t.dataset.f,t.value);
      if(t.dataset.f==='level'){ cc.level=Number(t.value)||3; if(cc.level<3) cc.sub=''; }
      ccSave(); ccRender();
    }
  });
  box.addEventListener('click',async e=>{
    const q=s=>e.target.closest(s);
    if(q('[data-set]')){const b=q('[data-set]'); const f=b.dataset.set, v=b.dataset.v; cc[f]=v;
      if(f==='cls'){cc.sub='';cc.skills=[];cc.expertise=[];cc.choice='';cc.style='';cc.masteries=[];cc.eqClass='A';cc.worn='auto';cc.shield='auto';}
      if(f==='bg'){cc.bgP2='';cc.bgP1='';cc.bgTool='';cc.skilledPicks=[];cc.eqBg='A';cc.worn='auto';}
      if(f==='species'){cc.humanSkill='';cc.versFeat='';}
      ccSave(); return ccRender();}
    if(q('[data-ccgo]')){ccStep=Number(q('[data-ccgo]').dataset.ccgo); ccRender(); $('#ccscroll').scrollTop=0; return;}
    if(q('[data-ccnav]')){ccStep=Math.max(0,Math.min(CC_STEPS.length-1,ccStep+Number(q('[data-ccnav]').dataset.ccnav))); ccRender(); $('#ccscroll').scrollTop=0; return;}
    if(q('[data-pbadj]')){const [k,d]=q('[data-pbadj]').dataset.pbadj.split(':'), nv=cc.pb[k]+Number(d); if(nv>=8&&nv<=15){const R=ccCalc(cc); if(Number(d)<0||(R.pbUsed||0)-(CC_PB[cc.pb[k]]||0)+(CC_PB[nv]||0)<=27){cc.pb[k]=nv; ccSave();}} return ccRender();}
    if(q('[data-ai]')) return ccAI(q('[data-ai]').dataset.ai);
    if(q('[data-cccopy]')) return copyText(ccHandover(),q('[data-cccopy]'));
    if(q('[data-ccsave]')) return ccFinish();
  });
  ccRender();
}
function ccRefreshSums(){ /* manual ability scores: update only the summary line and finals without losing focus */
  const R=ccCalc(cc); document.querySelectorAll('.ccab').forEach((row,i)=>{const k=ABIL[i][0]; const b=row.querySelector('b[style*="gold"]'); if(b) b.textContent=R.fin[k]; const sm=row.querySelectorAll('small'); if(sm.length) sm[sm.length-1].textContent='('+sgn(R.m(k))+')';});
  const sum=document.querySelector('.ccsum'); if(sum&&R.hp) sum.textContent=sum.textContent.replace(/ · HP .*$/,'')+' · HP '+R.hp+' · AC '+R.ac;
}
function ccHandover(){
  const R=ccCalc(cc), rec=ccRecord(cc,R);
  return '# OVERDRACHT NIEUW PERSONAGE — '+rec.name+'\n'+sheetText(Object.assign({k:'_'},rec))+'\n'+
    (rec.personality?'\nPERSOONLIJKHEID\n'+rec.personality+'\n':'')+(rec.appearance?'\nUITERLIJK\n'+rec.appearance+'\n':'')+(rec.backstory?'\nBACKSTORY\n'+rec.backstory+'\n':'')+
    (rec.secrets?'\nGEHEIMEN (alleen DM)\n'+rec.secrets+'\n':'')+(rec.dmHooks?'\nDM-HAKEN\n'+rec.dmHooks+'\n':'');
}
async function ccFinish(){
  const R=ccCalc(cc);
  if(R.issues.length){alert('Los eerst op:\n• '+R.issues.join('\n• ')); return;}
  if(R.warn.length&&!confirm('Er zijn nog open punten:\n• '+R.warn.join('\n• ')+'\n\nToch opslaan? (Je kunt het later in het Karakterblad aanpassen.)')) return;
  const rec=ccRecord(cc,R), k=slug(rec.name);
  if(chars[k]&&!confirm('Er bestaat al een personage "'+chars[k].name+'". Overschrijven?')) return;
  const up={}; up['dnd/characters/'+k]=rec;
  const mine=allChars().filter(c=>c.player===rec.player&&!c.dead&&c.k!==k);
  if(mine.length&&confirm('Je hebt nog een actief personage ('+mine.map(c=>c.name).join(', ')+').\n\nMarkeren als gesneuveld / gepensioneerd, zodat het nieuwe personage je actieve personage wordt?\n\nOK = markeren, Annuleren = beide actief laten')) mine.forEach(c=>{up['dnd/characters/'+c.k+'/dead']=true});
  try{ await db.ref().update(up); }catch(e){alert('Opslaan mislukt: '+e.message); return;}
  try{localStorage.removeItem(CC_DRAFT)}catch(e){}
  cc=null; ccStep=0; sheetKey=k; sheetEdit=false;
  alert('Opgeslagen! "'+rec.name+'" staat nu in het Karakterblad.');
  showMenu('chars');
}
/* ---- Gemini-hulp ---- */
async function ccAI(kind){
  if(ccBusy) return;
  if(!keyOk()){alert('Zet eerst je API-sleutel bij ⚙ Instellingen.');return}
  const s=cc, R=ccCalc(s);
  const ctx='Personage: '+(s.name||'(naamloos)')+'. Level '+s.level+' '+[s.species,s.cls,s.sub,s.bg&&('background '+s.bg)].filter(Boolean).join(', ')+'.'+(s.concept?'\nConcept van de speler: '+s.concept:'')+(s.alignment?'\nAlignment: '+s.alignment:'')+(s.traits?'\nEigenschappen: '+s.traits:'')+(s.flaw?'\nZwakte: '+s.flaw:'')+(s.appearance?'\nUiterlijk: '+s.appearance:'');
  const SYS='Je bent een schrijfhulp voor een D&D 5e (2024)-personage in een campagne in Midden-aarde (Tolkien, Third Age 3018, rond de Council of Elrond). Schrijf in het Nederlands, gebruik Engelse D&D-termen. Wees trouw aan Tolkien-canon, maar met speelruimte; geen vuurwapens, geen willekeurige magie. Verzin geen spelregels. Wat de speler zelf heeft vastgesteld mag je niet veranderen; eigen aanvullingen markeer je met "(voorstel)".';
  let user='';
  if(kind==='concept') user=ctx+'\n\nGeef 4 uiteenlopende, korte conceptideeën (elk 2-3 zinnen: wie, afkomst, drijfveer, speelstijl) passend bij de wensen van de speler. Nummer ze 1-4.';
  if(kind==='story'){ if(!s.notes.trim()&&!s.backstory.trim()){alert('Vul eerst ruwe notities in.');return} user=ctx+'\n\nRUWE NOTITIES VAN DE SPELER:\n'+(s.notes||'')+(s.backstory?'\n\nBESTAANDE BACKSTORY:\n'+s.backstory:'')+'\n\nWerk dit uit tot een backstory van ongeveer 300 woorden met korte kopjes (Jeugd & afkomst, Familie, Keerpunt, Waarom nu op pad). Houd alle feiten van de speler intact; markeer aanvullingen met "(voorstel)". Sluit af met één regel over de startsituatie.'; }
  if(kind==='hooks'){ if(!(s.backstory.trim()||s.notes.trim())){alert('Schrijf eerst een backstory.');return} user=ctx+'\n\nBACKSTORY:\n'+(s.backstory||s.notes)+(s.family?'\n\nFAMILIE:\n'+s.family:'')+(s.secrets?'\n\nGEHEIMEN (alleen voor de DM):\n'+s.secrets:'')+'\n\nMaak 5 tot 7 korte DM-haken als opsomming (•): open verhaallijnen, NPC\'s, vijanden, mysteries en dilemma\'s die de DM later kan uitwerken. Eén regel per haak.'; }
  ccBusy=kind; ccRender();
  try{
    const r=await callLLM(SYS,user,null,false,{maxOut:1800});
    const t=r.txt.trim();
    if(kind==='concept'){ ccRender(); const o=$('#ccout'); if(o) o.textContent=t; }
    else if(kind==='story'){ if(!s.backstory.trim()||confirm('Je backstory-veld bevat al tekst. Vervangen door het Gemini-voorstel?\n(Annuleren = eronder toevoegen)')) s.backstory=t; else s.backstory=s.backstory.trim()+'\n\n'+t; }
    else { s.hooks=(s.hooks.trim()?s.hooks.trim()+'\n':'')+t; }
    ccSave();
  }catch(e){ alert('DM-model: '+e.message); }
  const keep=(kind==='concept')?(($('#ccout')||{}).textContent||''):'';
  ccBusy=''; ccRender(); if(kind==='concept'){const o=$('#ccout'); if(o) o.textContent=keep;}
}

/* ---------- OOC ---------- */
function sendOoc(){
  const i=$('#oocin'),v=i.value.trim(); if(!v) return; i.value='';
  db.ref(cp('ooc')).push({author:me.name,text:v,t:Date.now()});
}

  if(!me||screen!=='camp'||tab!=='ooc') return;
  const th=$('#oocthread');
  th.innerHTML=oocs.map(m=>'<div class="msg ooc"><div class="who">'+esc(m.author)+'</div>'+esc(m.text)+'</div>').join('')||'<div class="msg system">Nog geen berichten.</div>';

/* ---------- Stand ---------- */
async function renderStand(){
  if(screen!=='camp') return;
  const box=$('#standbox'), C=cid;
  let pretty=stateStr; try{pretty=JSON.stringify(JSON.parse(stateStr),null,1)}catch(e){}
  box.innerHTML=BACK+`<h2>Huidige Stand</h2><textarea id="stedit" style="min-height:260px;font-family:monospace;font-size:13px"></textarea>
  <div class="row" style="margin-top:6px"><button class="b" id="stsave">Stand opslaan</button></div>

  $('#stsave').onclick=async()=>{
