<!DOCTYPE html>
<!-- Griekse Alfabet Trainer v1.0 -->
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ἀλφάβητος">
<meta name="theme-color" content="#0d1f3c">
<title>GRIEKS ALFABET</title>
<link rel="icon" type="image/png" sizes="32x32" href="../../assets/favicons/grieks/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../../assets/favicons/grieks/favicon-16x16.png">
<link rel="apple-touch-icon" href="../../assets/favicons/grieks/apple-touch-icon.png">
<style>
:root{
  --aegean:#0d1f3c;--aegean2:#152a50;--aegean3:#1c3566;--aegean4:#24427d;
  --marble:#f5f0e8;--marble2:#ede4d4;
  --terracotta:#c0472a;--terra2:#a33820;--terra3:#e05a38;
  --gold:#d4af37;--gold-bright:#f0cf6b;--gold-dim:#9c7c1f;
  --azure:#3a7bd5;--azure2:#5a9be8;--azure3:#2560b8;
  --cream:#f0e8d8;--cream2:#ddd0b8;
  --muted:#b0a888;--muted2:#8a806a;
  --shadow:rgba(0,0,0,.5);
  --green:#3a7d4a;--green-bright:#5cb872;
  --red:#c0472a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Palatino Linotype',Palatino,Georgia,'Times New Roman',serif;
  background:radial-gradient(ellipse at 50% -10%,rgba(58,123,213,.15),transparent 55%),
    radial-gradient(ellipse at 80% 100%,rgba(192,71,42,.12),transparent 50%),
    linear-gradient(160deg,#080f1e 0%,#0d1928 45%,#091524 100%);
  background-attachment:fixed;
  color:var(--cream);
  min-height:100%;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
.wrap{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:14px 14px 60px;min-height:100vh}
h1,h2,h3{font-family:'Optima','Palatino Linotype',Palatino,Georgia,serif;letter-spacing:.04em}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.hidden{display:none!important}

.topbar{display:flex;align-items:center;gap:10px;margin-bottom:18px;padding-left:44px}
.crest{width:44px;height:44px;flex:0 0 auto}
.brand .t{font-family:'Optima','Palatino Linotype',Palatino,Georgia,serif;font-weight:900;font-size:20px;color:var(--gold);line-height:1;letter-spacing:.06em}
.brand .s{font-size:10px;letter-spacing:.28em;color:var(--muted);margin-top:3px}

.meander{height:4px;background:linear-gradient(90deg,var(--aegean3) 0%,var(--gold-dim) 25%,var(--terracotta) 50%,var(--gold-dim) 75%,var(--aegean3) 100%);border-radius:2px;margin:16px 0}

.panel{background:linear-gradient(170deg,var(--aegean3),var(--aegean2));border:1px solid var(--aegean4);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 4px 16px var(--shadow)}

.btn{display:inline-block;padding:12px 22px;border-radius:11px;font-size:15px;font-weight:600;cursor:pointer;transition:transform .12s,box-shadow .12s;border:none}
.btn:active{transform:scale(.96)}
.btn-primary{background:linear-gradient(135deg,var(--terracotta),var(--terra2));color:#fff;box-shadow:0 4px 14px rgba(192,71,42,.45)}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-dim));color:#0a0a0a;box-shadow:0 4px 14px rgba(212,175,55,.4)}
.btn-ghost{border:1px solid var(--aegean4);color:var(--muted);background:transparent;padding:10px 18px}
.btn-full{width:100%;text-align:center}
.btn-row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}

.chip{display:inline-block;padding:6px 14px;border-radius:20px;font-size:13px;border:1px solid var(--aegean4);background:var(--aegean2);color:var(--muted);cursor:pointer;transition:all .12s;margin:3px}
.chip.active{background:var(--azure3);border-color:var(--azure);color:#fff}
.chip-row{display:flex;flex-wrap:wrap;gap:2px;margin-bottom:10px}

.scrhead{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.scrhead h2{font-size:19px;color:var(--gold);flex:1}
.back-btn{width:38px;height:38px;border-radius:50%;background:var(--aegean3);border:1px solid var(--aegean4);display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:var(--cream)}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.tile{position:relative;border-radius:15px;padding:20px 16px;text-align:left;background:linear-gradient(170deg,var(--aegean3),var(--aegean2));border:1px solid var(--aegean4);box-shadow:0 4px 16px var(--shadow),inset 0 1px 0 rgba(255,255,255,.04);transition:transform .14s,border-color .14s;cursor:pointer;color:var(--cream)}
.tile:active{transform:scale(.97)}
.tile:hover{border-color:var(--gold-dim)}
.tile .ic{font-size:32px;margin-bottom:8px;line-height:1;color:var(--gold)}
.tile h3{font-size:15px;color:var(--cream);margin-bottom:3px}
.tile p{font-size:12px;color:var(--muted);line-height:1.35}
.tile .tile-stat{margin-top:8px;font-size:11px;color:var(--gold-dim);letter-spacing:.05em}
.tile.wide{grid-column:1/-1}

.stats-row{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.stat-badge{background:linear-gradient(180deg,var(--aegean3),var(--aegean2));border:1px solid var(--gold-dim);border-radius:10px;padding:8px 14px;display:flex;flex-direction:column;align-items:center;min-width:70px}
.stat-badge .val{font-family:'Optima',Palatino,Georgia,serif;font-size:22px;color:var(--gold-bright);line-height:1}
.stat-badge .lbl{font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-top:2px}

.prog-wrap{margin-bottom:14px}
.prog-label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:5px}
.progbar{height:7px;border-radius:4px;background:rgba(0,0,0,.4);overflow:hidden;border:1px solid rgba(212,175,55,.2)}
.progbar i{display:block;height:100%;background:linear-gradient(90deg,var(--azure3),var(--azure));border-radius:4px;transition:width .3s cubic-bezier(.2,.8,.2,1)}

.quiz-card{background:linear-gradient(170deg,var(--aegean3),var(--aegean2));border:1px solid var(--aegean4);border-radius:18px;padding:30px 20px;margin-bottom:18px;text-align:center;box-shadow:0 6px 20px var(--shadow)}
.quiz-letter{font-size:88px;color:var(--marble);line-height:1;font-family:Georgia,'Times New Roman',serif}
.quiz-word{font-size:44px;color:var(--marble);line-height:1.2;letter-spacing:.02em;font-family:Georgia,'Times New Roman',serif;word-break:break-word}
.quiz-sub{font-size:12px;color:var(--muted);margin-top:10px;letter-spacing:.1em;text-transform:uppercase}

.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.opt-btn{background:var(--aegean2);border:1px solid var(--aegean4);border-radius:12px;padding:14px 10px;font-size:15px;color:var(--cream);text-align:center;transition:all .12s;line-height:1.3}
.opt-btn:active{transform:scale(.96)}
.opt-btn.correct{background:rgba(58,125,74,.35);border-color:var(--green-bright);color:var(--green-bright)}
.opt-btn.wrong{background:rgba(192,71,42,.35);border-color:var(--terracotta);color:var(--terra3)}
.opt-btn.disabled{pointer-events:none;opacity:.55}
.opt-btn.disabled.correct,.opt-btn.disabled.wrong{opacity:1}
.opt-btn .opt-gr{font-size:22px;font-family:Georgia,serif;display:block;margin-bottom:2px}

.feedback{padding:12px 16px;border-radius:10px;font-size:14px;margin-bottom:14px;line-height:1.55;min-height:20px}
.feedback.ok{background:rgba(58,125,74,.18);border:1px solid var(--green-bright);color:var(--green-bright)}
.feedback.err{background:rgba(192,71,42,.18);border:1px solid var(--terracotta);color:var(--terra3)}

.score-ring{display:flex;flex-direction:column;align-items:center;gap:4px;margin:20px 0}
.score-big{font-family:'Optima',Palatino,Georgia,serif;font-size:64px;color:var(--gold-bright);line-height:1}
.score-out{font-size:16px;color:var(--muted)}

table.abc-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:6px}
table.abc-table th{background:rgba(36,66,125,.6);color:var(--gold);padding:7px 6px;text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid var(--aegean4)}
table.abc-table td{padding:7px 6px;border-bottom:1px solid rgba(255,255,255,.06);color:var(--cream2);vertical-align:middle}
table.abc-table tr:last-child td{border-bottom:none}
table.abc-table .lg{font-size:22px;font-family:Georgia,serif;color:var(--marble)}
table.abc-table .nm{color:var(--cream);font-size:13px}
table.abc-table .ui{color:var(--muted);font-size:11.5px;font-style:italic;line-height:1.3}

.note{font-size:12px;color:var(--muted);line-height:1.6;margin-top:10px}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:24px;font-style:italic}

.inp{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--aegean4);border-radius:10px;padding:11px 14px;color:var(--cream);font-size:15px;outline:none;text-align:center;font-family:inherit;margin-bottom:14px}
.inp:focus{border-color:var(--azure)}

.blitz-hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.blitz-hearts{font-size:20px;letter-spacing:4px;color:var(--terra3)}
.blitz-score{font-family:'Optima',Palatino,Georgia,serif;font-size:18px;color:var(--gold-bright)}
.blitz-target-panel{background:linear-gradient(170deg,var(--aegean3),var(--aegean2));border:1px solid var(--gold-dim);border-radius:12px;padding:12px 16px;margin-bottom:12px;text-align:center}
.blitz-target-label{font-size:10px;letter-spacing:.15em;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
.blitz-target-value{font-size:20px;color:var(--gold-bright);font-family:'Optima',Palatino,Georgia,serif;word-break:break-word}
.blitz-arena{position:relative;height:min(60vh,420px);overflow:hidden;border-radius:16px;border:1px solid var(--aegean4);background:radial-gradient(ellipse at 50% 100%,rgba(58,123,213,.15),transparent 60%),linear-gradient(180deg,#050a14,#0d1928);margin-bottom:14px;touch-action:none}
.blitz-obj{position:absolute;top:100%;font-size:36px;font-family:Georgia,'Times New Roman',serif;color:var(--marble);cursor:pointer;user-select:none;-webkit-user-select:none;padding:8px 14px;line-height:1;background:rgba(255,255,255,.04);border-radius:10px}
.blitz-obj.correct-pop{color:var(--green-bright);transform:scale(1.5);opacity:0}
.blitz-obj.wrong-pop{color:var(--terra3);transform:scale(1.3) rotate(12deg);opacity:0}
.blitz-start-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(5,10,20,.9);text-align:center;padding:20px}

@media print{
  .portal-back,.back-btn,.btn-row,.prog-wrap,.opt-grid,.feedback{display:none!important}
  body{background:#fff!important;color:#000!important}
  .panel,.quiz-card,.stat-badge{background:#fff!important;border:1px solid #999!important;box-shadow:none!important;color:#000!important}
  .score-big,.score-out,.stat-badge .val,.stat-badge .lbl,h2,h3,table.abc-table td,table.abc-table th{color:#000!important}
  #leerlingnaam{border:none!important;background:none!important;color:#000!important;font-size:18px;font-weight:700}
}
</style>
<style>.portal-back{position:fixed;top:10px;left:10px;z-index:9999;display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px;background:rgba(0,0,0,.4);border:1px solid rgba(212,175,55,.35);color:#d4af37;text-decoration:none;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);}.portal-back:hover{background:rgba(0,0,0,.65);border-color:rgba(212,175,55,.7);}.portal-back svg{width:22px;height:22px;display:block;}.portal-back+.wrap{padding-left:14px;}</style>

<script>
// ═══════════════════════════════════════════════════

const LETTERS = [

  {u:'Ν',l:'ν',naam:'nu',        tr:'n',   ui:'n, zoals in "nee"',                                    klank:'N'},

  {u:'Ψ',l:'ψ',naam:'psi',       tr:'ps',  ui:'ps-klank, zoals in "oeps"',                             klank:'PS'},
  {u:'Ω',l:'ω',naam:'omega',     tr:'ō',   ui:'lange o, zoals in "roos"',                              klank:'Ō (lang)'},

const WORDS = [
  {gr:'θέατρον',   tr:'theatron',   nl:'theater'},
  {gr:'βιβλίον',   tr:'biblion',    nl:'boek'},
  {gr:'μουσική',   tr:'mousikē',    nl:'muziek'},

  {gr:'ἱστορία',   tr:'historia',   nl:'geschiedenis'},

// Langere woorden met spiritus lenis/asper en iota subscriptum,
// voor de modus "Woord uitspreken" (typ-modus). `answer` is de canonieke
// getypte vorm; normalizePron() maakt de check ongevoelig voor lange-klinker-
// spelling (o/oo, e/ee) en voor de dz/zd/z-varianten van de dzèta.
const WORDS_PRON = [

  {gr:'ὥρα',        tr:'hṓra',        answer:'hoora',          ui:'hoora — mét h-klank (spiritus asper)'},

  {gr:'τῷ ἀνθρώπῳ', tr:'tōi anthrṓpōi', answer:'too anthroopoo', ui:'too anthroopoo — iota subscriptum onder beide ω\'s, niet apart uitgesproken'},

];

const NAAM_KEY = 'kthulp_grieks_alfabet_naam';

function loadStats(){
  const defaults = defaultStats();
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      return {
        modes: Object.assign({}, defaults.modes, parsed.modes),
        fouten: parsed.fouten || {},
        woordFouten: parsed.woordFouten || {},
      };
    }
  }catch(e){}
  return defaults;
}
function saveStats(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(STATS)); }catch(e){} }

// ═══════════════════════════════════════════════════
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

// gewogen keuze: items waarop vaker fout gegaan wordt komen vaker terug
function weightedPick(list, statMap, keyFn){
  const weights = list.map(item=>1 + (statMap[keyFn(item)]||0)*2);
  const total = weights.reduce((a,b)=>a+b,0);
  let r = Math.random()*total;
  for(let i=0;i<list.length;i++){
    r -= weights[i];
    if(r<=0) return list[i];
  }
  return list[list.length-1];
}
function registerResult(mode, key, ok, mapName){
  mapName = mapName || 'fouten';
  const m = STATS.modes[mode];
  m.total++;
  if(ok){ m.correct++; }
  if(key){
    const map = STATS[mapName];
    if(!ok) map[key] = (map[key]||0) + 1;
    else if(map[key]) map[key] = Math.max(0, map[key]-1);
  }
  saveStats();
}

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function startQuiz(mode){
  QUIZ = {mode, round:1, correct:0, streak:0, current:null, answered:false, chosenIdx:-1, mistakes:[]};

function nextQuestion(){
  if(QUIZ.round > 10){ renderResult(); return; }
  QUIZ.answered = false;
  if(QUIZ.mode === 'matchen'){
    const letter = weightedPick(LETTERS, STATS.fouten, l=>l.u);
    const showUpper = Math.random() < 0.5;
    const distractors = shuffle(LETTERS.filter(l=>l.u!==letter.u)).slice(0,3);
    const opts = shuffle([letter, ...distractors]).map(l=>({label:showUpper?l.l:l.u, ok:l.u===letter.u}));
    QUIZ.current = {display:showUpper?letter.u:letter.l, sub:showUpper?'ZOEK DE BIJPASSENDE KLEINE LETTER':'ZOEK DE BIJPASSENDE HOOFDLETTER', opts, key:letter.u, kind:'matchen', refType:'letter', ref:letter};
  } else if(QUIZ.mode === 'letters'){
    const letter = weightedPick(LETTERS, STATS.fouten, l=>l.u);
    const useUpper = Math.random() < 0.5;
    const distractors = shuffle(LETTERS.filter(l=>l.u!==letter.u)).slice(0,3);
    const opts = shuffle([letter, ...distractors]).map(l=>({label:l.naam, ok:l.u===letter.u}));
    QUIZ.current = {display:useUpper?letter.u:letter.l, sub:'GRIEKSE LETTER', opts, key:letter.u, kind:'letter', refType:'letter', ref:letter};
  } else if(QUIZ.mode === 'uitspraak'){
    const letter = weightedPick(LETTERS, STATS.fouten, l=>l.u);
    const useUpper = Math.random() < 0.5;
    const distractors = shuffle(LETTERS.filter(l=>l.u!==letter.u)).slice(0,3);
    const opts = shuffle([letter, ...distractors]).map(l=>({label:l.klank, ok:l.u===letter.u}));
    QUIZ.current = {display:useUpper?letter.u:letter.l, sub:'HOE SPREEK JE DIT UIT?', opts, key:letter.u, kind:'uitspraak', refType:'letter', ref:letter, extra:letter.ui};
  } else if(QUIZ.mode === 'woorduitspraak'){
    const word = weightedPick(WORDS_PRON, STATS.woordFouten, w=>w.gr);
    QUIZ.current = {display:word.gr, sub:'TYP HOE JE DIT WOORD ZOU UITSPREKEN', key:word.gr, kind:'woorduitspraak', refType:'word', ref:word, answer:word.answer};
  } else if(QUIZ.mode === 'woorden'){
    const word = weightedPick(WORDS, STATS.woordFouten, w=>w.gr);
    const distractors = shuffle(WORDS.filter(w=>w.gr!==word.gr)).slice(0,3);
    const opts = shuffle([word, ...distractors]).map(w=>({label:w.nl, ok:w.gr===word.gr}));
    QUIZ.current = {display:word.gr, sub:'WELK WOORD IS DIT?', opts, key:word.gr, kind:'woord', extra:word.tr, refType:'word', ref:word};
  }
  render();
}

// Normaliseert een getypte uitspraak zodat de check ongevoelig is voor:
// - hoofdletters/spaties/leestekens
// - lange-klinker-spelling (o/oo, e/ee — verschilt per docent/methode)
// - de dz/zd/z-varianten van de dzèta (ζ)
// Bewust géén algemene fuzzy-tolerantie voor andere fouten: of je de h van een
// spiritus asper wel/niet typt, of ει/οι goed hebt, is precies waar deze modus
// op toetst.
function normalizePron(s){
  return String(s).toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z]/g,'')
    .replace(/dz|zd/g,'z')
    .replace(/([aeiouy])\1+/g,'$1');
}

function resolveAnswer(ok){
  QUIZ.answered = true;
  QUIZ.current.wasCorrect = ok;
  const mapName = QUIZ.current.refType === 'word' ? 'woordFouten' : 'fouten';
  registerResult(QUIZ.mode, QUIZ.current.key, ok, mapName);
  if(ok){
    QUIZ.correct++;
    QUIZ.streak++;
    if(QUIZ.streak > STATS.modes[QUIZ.mode].best){ STATS.modes[QUIZ.mode].best = QUIZ.streak; saveStats(); }
  } else {
    QUIZ.streak = 0;
    QUIZ.mistakes.push({type:QUIZ.current.refType, ref:QUIZ.current.ref});
  }
  render();
  setTimeout(()=>{
    QUIZ.round++;
    nextQuestion();
  }, ok ? 900 : (QUIZ.current.kind==='woorduitspraak' ? 2600 : 1900));
}

function answer(idx){
  if(QUIZ.answered) return;
  QUIZ.chosenIdx = idx;
  resolveAnswer(QUIZ.current.opts[idx].ok);
}

function answerTyped(){
  if(QUIZ.answered) return;
  const inputEl = document.getElementById('pron-input');
  const typed = inputEl ? inputEl.value : '';
  QUIZ.typedAnswer = typed;
  const ok = typed.trim().length > 0 && normalizePron(typed) === normalizePron(QUIZ.current.answer);
  resolveAnswer(ok);
}

// Kiest n verschillende letters (gewogen op eerdere fouten) die dit doel-tijdperk
// als afleider gebruikt worden. Door afleiders uit een kleine, herhaalde pool te
// trekken (i.p.v. steeds een nieuwe letter uit alle 23) is de doelletter niet meer
// simpelweg "de letter die het vaakst voorbijkomt".
function pickBlitzDecoyPool(target, n){
  const candidates = LETTERS.filter(l=>l.u!==target.u);
  const pool = [];
  while(pool.length < n && candidates.length){
    const chosen = weightedPick(candidates, STATS.fouten, l=>l.u);
    pool.push(chosen);
    candidates.splice(candidates.indexOf(chosen), 1);
  }
  return pool;
}

function pickNewBlitzTarget(){
  const type = pick(['naam','naam','uitspraak','hk_lower','hk_upper']);
  const letter = weightedPick(LETTERS, STATS.fouten, l=>l.u);
  let label, value;
  if(type === 'naam'){ label = 'TIK OP DE LETTER'; value = letter.naam; }
  else if(type === 'uitspraak'){ label = 'TIK OP DE LETTER MET DEZE UITSPRAAK'; value = letter.ui; }
  else if(type === 'hk_lower'){ label = 'TIK OP DE KLEINE LETTER VAN'; value = letter.u; }
  else { label = 'TIK OP DE HOOFDLETTER VAN'; value = letter.l; }
  const elapsed = BLITZ.startTime ? (Date.now()-BLITZ.startTime)/1000 : 0;
  const poolSize = elapsed < 15 ? 3 : elapsed < 35 ? 4 : 5;
  BLITZ.target = {type, letter, label, value, decoyPool: pickBlitzDecoyPool(letter, poolSize)};
  BLITZ.targetSpawnsRemaining = 2;
  BLITZ.targetAliveCount = 0;
  updateTargetPanel();
}

function isBlitzTargetMatch(letterObj, caseUsed){
  const t = BLITZ.target;
  if(t.type === 'hk_lower') return letterObj.u === t.letter.u && caseUsed === 'lower';
  if(t.type === 'hk_upper') return letterObj.u === t.letter.u && caseUsed === 'upper';
  return letterObj.u === t.letter.u;
}

function updateHud(){
  const heartsEl = document.getElementById('blitz-hearts');
  if(heartsEl) heartsEl.textContent = '❤'.repeat(Math.max(0,BLITZ.lives)) + '♡'.repeat(Math.max(0,3-BLITZ.lives));
  const scoreEl = document.getElementById('blitz-score');
  if(scoreEl) scoreEl.textContent = 'SCORE ' + BLITZ.score;
}
function updateTargetPanel(){
  const lbl = document.getElementById('blitz-target-label');
  const val = document.getElementById('blitz-target-value');
  if(lbl) lbl.textContent = BLITZ.target.label;
  if(val) val.textContent = BLITZ.target.value;
}

function maybeAdvanceBlitzTarget(){
  if(BLITZ.running && BLITZ.targetSpawnsRemaining <= 0 && BLITZ.targetAliveCount <= 0){
    pickNewBlitzTarget();
  }
}

function blitzHit(){
  BLITZ.combo++;
  BLITZ.score += 10 + BLITZ.combo*2;
  updateHud();
  maybeAdvanceBlitzTarget();
}

function blitzMiss(letterObj){
  BLITZ.combo = 0;
  BLITZ.lives--;
  STATS.fouten[letterObj.u] = (STATS.fouten[letterObj.u]||0) + 1;
  BLITZ.mistakes.push({type:'letter', ref:letterObj});
  updateHud();
  if(BLITZ.lives <= 0){ endBlitz(); return; }
  maybeAdvanceBlitzTarget();
}

function spawnBlitzObject(){
  if(!BLITZ || !BLITZ.running) return;
  const arena = document.getElementById('blitz-arena');
  if(!arena) return;
  const t = BLITZ.target;
  const forcedCase = t.type==='hk_lower' ? 'lower' : t.type==='hk_upper' ? 'upper' : null;
  const spawnMatch = BLITZ.targetSpawnsRemaining > 0 && Math.random() < BLITZ.matchChance;
  let letterObj, caseUsed;
  if(spawnMatch){
    letterObj = t.letter;
    caseUsed = forcedCase || (Math.random()<0.5 ? 'upper' : 'lower');
    BLITZ.targetSpawnsRemaining--;
  } else {
    letterObj = pick(t.decoyPool);
    caseUsed = forcedCase || (Math.random()<0.5 ? 'upper' : 'lower');
  }
  const glyph = caseUsed === 'upper' ? letterObj.u : letterObj.l;
  const isMatch = isBlitzTargetMatch(letterObj, caseUsed);
  if(isMatch) BLITZ.targetAliveCount++;

  const w = arena.clientWidth;
  const el = document.createElement('div');
  el.className = 'blitz-obj';
  el.textContent = glyph;
  const leftMax = Math.max(10, w-70);
  el.style.left = Math.round(10+Math.random()*leftMax)+'px';
  const riseDuration = BLITZ.riseDuration;

  let dead = false;
  const cleanup = ()=>{ if(el.parentNode) el.parentNode.removeChild(el); };

  el.addEventListener('pointerdown', (e)=>{
    e.preventDefault();
    if(dead || !BLITZ.running) return;
    dead = true;
    el.style.transition = 'transform .25s,opacity .25s';
    if(isMatch){
      BLITZ.targetAliveCount--;
      el.classList.add('correct-pop');
      blitzHit();
    } else {
      el.classList.add('wrong-pop');
      blitzMiss(t.letter);
    }
    setTimeout(cleanup, 260);
  });

  el.addEventListener('transitionend', (e)=>{
    if(e.propertyName !== 'top' || dead) return;
    dead = true;
    if(isMatch){
      BLITZ.targetAliveCount--;
      if(BLITZ.running) blitzMiss(t.letter);
    }
    cleanup();
  });

  arena.appendChild(el);
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      if(dead || !el.parentNode) return;
      el.style.transition = `top ${riseDuration}ms linear`;
      el.style.top = '-70px';
    });
  });
}

function scheduleNextBlitzSpawn(){
  if(!BLITZ || !BLITZ.running) return;
  const elapsed = (Date.now()-BLITZ.startTime)/1000;
  BLITZ.riseDuration = Math.max(1800, 4500 - elapsed*40);
  BLITZ.matchChance = Math.max(0.12, 0.28 - elapsed*0.003);
  const interval = Math.max(450, 1400 - elapsed*18);
  BLITZ.timer = setTimeout(()=>{
    spawnBlitzObject();
    scheduleNextBlitzSpawn();
  }, interval);
}

function startBlitz(){
  BLITZ = {
    running:true, lives:3, score:0, combo:0, mistakes:[],
    startTime:Date.now(), timer:null,
    riseDuration:4500, matchChance:0.4,
    target:null, targetSpawnsRemaining:0, targetAliveCount:0,
  };
  const arena = document.getElementById('blitz-arena');
  if(arena) arena.innerHTML = '';
  updateHud();
  pickNewBlitzTarget();
  scheduleNextBlitzSpawn();
}

function stopBlitz(){
  if(BLITZ){
    if(BLITZ.timer) clearTimeout(BLITZ.timer);
    BLITZ.running = false;
  }
}

function endBlitz(){
  stopBlitz();
  const survived = Math.round((Date.now()-BLITZ.startTime)/1000);
  STATS.modes.blitz.total++;
  if(BLITZ.score > STATS.modes.blitz.best) STATS.modes.blitz.best = BLITZ.score;
  saveStats();
  QUIZ = {mode:'blitz', correct:BLITZ.score, mistakes:BLITZ.mistakes, survived};
  renderResult();
}

function dedupeMistakes(mistakes){
  const seen = new Set();
  const out = [];
  mistakes.forEach(m=>{
    const k = m.type+':'+(m.type==='letter'?m.ref.u:m.ref.gr);
    if(!seen.has(k)){ seen.add(k); out.push(m); }
  });
  return out;
}

function formatDuration(sec){
  const m = Math.floor(sec/60), s = sec%60;
  return (m ? m+'m ' : '') + s + 's';
}

function renderResult(){
  const app = document.getElementById('app');
  const meta = MODE_META[QUIZ.mode];
  const isBlitz = QUIZ.mode === 'blitz';
  const uniek = dedupeMistakes(QUIZ.mistakes);
  let savedName = '';
  try{ savedName = localStorage.getItem(NAAM_KEY) || ''; }catch(e){}
  const datum = new Date().toLocaleString('nl-NL', {dateStyle:'medium', timeStyle:'short'});

  const scoreBlock = isBlitz ? `
    <div class="score-ring">
      <div class="score-big">${QUIZ.correct}</div>
      <div class="score-out">punten &middot; ${formatDuration(QUIZ.survived)} volgehouden &middot; ${esc(datum)}</div>
    </div>
    <div class="stats-row" style="justify-content:center">
      <div class="stat-badge"><div class="val">${STATS.modes.blitz.best}</div><div class="lbl">Hoogste score</div></div>
      <div class="stat-badge"><div class="val">${STATS.modes.blitz.total}</div><div class="lbl">Potjes gespeeld</div></div>
    </div>` : `
    <div class="score-ring">
      <div class="score-big">${QUIZ.correct}/10</div>
      <div class="score-out">${Math.round(100*QUIZ.correct/10)}% goed &middot; ${10-QUIZ.correct} fout &middot; ${esc(datum)}</div>
    </div>
    <div class="stats-row" style="justify-content:center">
      <div class="stat-badge"><div class="val">${STATS.modes[QUIZ.mode].best}</div><div class="lbl">Beste reeks</div></div>
      <div class="stat-badge"><div class="val">${STATS.modes[QUIZ.mode].total}</div><div class="lbl">Totaal geoefend</div></div>
    </div>`;

  const herhaalHtml = uniek.length ? `
    <div class="panel" id="herhaal-panel">
      <h3 style="color:var(--gold);font-size:15px;margin-bottom:10px">Nog te herhalen (${uniek.length})</h3>
      <table class="abc-table">
        <tbody>
        ${uniek.map(m=>{
          if(m.type==='letter'){
            const l = m.ref;
            return `<tr><td class="lg">${l.u}&thinsp;${l.l}${l.final?('&thinsp;'+l.final):''}</td><td class="nm">${esc(l.naam)}</td><td class="ui">${esc(l.ui)}</td></tr>`;
          }
          const w = m.ref;
          return `<tr><td style="font-family:Georgia,serif;font-size:17px;color:var(--marble)">${esc(w.gr)}</td><td class="nm">${esc(w.tr)}</td><td class="ui">${esc(w.nl||w.ui||'')}</td></tr>`;
        }).join('')}
        </tbody>
      </table>
    </div>` : `<div class="panel" style="text-align:center;color:var(--green-bright)">Alles goed beantwoord — niets te herhalen!</div>`;

  app.innerHTML = `
  <div class="scrhead">
    <button class="back-btn" onclick="go('home')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18"><path d="M15 18l-6-6 6-6"/></svg></button>
    <h2>${meta.title}</h2>
  </div>
  <div class="panel" style="text-align:center" id="print-report">
    <input id="leerlingnaam" class="inp" placeholder="Naam leerling (voor de uitslag)" value="${esc(savedName)}" oninput="onNaamInput(this.value)">
    ${scoreBlock}
  </div>
  ${herhaalHtml}
  <div class="btn-row" style="justify-content:center">
    <button class="btn btn-gold" onclick="${isBlitz ? "go('blitz')" : "startQuiz('"+QUIZ.mode+"')"}">Nog een ronde</button>
    <button class="btn btn-primary" onclick="printResult()">Print / bewaar als PDF</button>
    <button class="btn btn-ghost" id="copy-btn" onclick="copyResult()">Kopieer als tekst</button>
    <button class="btn btn-ghost" onclick="go('home')">Terug naar overzicht</button>
  </div>
  `;
}

function onNaamInput(v){ try{ localStorage.setItem(NAAM_KEY, v); }catch(e){} }
function printResult(){ window.print(); }

function copyResult(){
  const meta = MODE_META[QUIZ.mode];
  const naamEl = document.getElementById('leerlingnaam');
  const naam = naamEl ? naamEl.value.trim() : '';
  const datum = new Date().toLocaleString('nl-NL', {dateStyle:'medium', timeStyle:'short'});
  const uniek = dedupeMistakes(QUIZ.mistakes);
  const lijst = uniek.map(m=> m.type==='letter'
    ? `${m.ref.u} ${m.ref.l} (${m.ref.naam})`
    : `${m.ref.gr} (${m.ref.tr})`);
  const scoreLine = QUIZ.mode === 'blitz'
    ? 'Score: ' + QUIZ.correct + ' punten, ' + formatDuration(QUIZ.survived) + ' volgehouden\n'
    : 'Score: ' + QUIZ.correct + '/10 (' + Math.round(100*QUIZ.correct/10) + '%), ' + (10-QUIZ.correct) + ' fout\n';
  const tekst = 'Griekse Alfabet Trainer — ' + meta.title + '\n'
    + (naam ? 'Leerling: ' + naam + '\n' : '')
    + 'Datum: ' + datum + '\n'
    + scoreLine
    + (lijst.length ? 'Nog te herhalen: ' + lijst.join(', ') + '\n' : 'Alles goed beantwoord.\n');
  const btn = document.getElementById('copy-btn');
  const reset = ()=>{ if(btn) btn.textContent = 'Kopieer als tekst'; };
  const showManual = ()=>{
    let box = document.getElementById('copy-fallback');
    if(!box){
      box = document.createElement('textarea');
      box.id = 'copy-fallback';
      box.className = 'inp';
      box.rows = 4;
      box.readOnly = true;
      box.style.marginTop = '10px';
      document.getElementById('print-report').appendChild(box);
    }
    box.value = tekst;
    box.hidden = false;
    box.focus();
    box.select();
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(tekst).then(()=>{
      if(btn){ btn.textContent = 'Gekopieerd!'; setTimeout(reset,1500); }
    }).catch(showManual);
  } else {
    showManual();
  }
}

render();
</script>
</body>
</html>
