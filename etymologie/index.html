<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Etymologicon &middot; van woord naar wortel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --stone-dark:#17140f;
    --stone-panel:#231e17;
    --stone-panel-2:#2c261d;
    --stone-line:#4a4030;
    --parchment:#ece3d0;
    --parchment-dim:#c9bda0;
    --bronze:#b8843f;
    --bronze-bright:#d9a35f;
    --patina:#5f8a75;
    --patina-bright:#7fae95;
    --latin:#8a3a2b;
    --latin-bright:#c25a41;
    --greek:#3a6f8f;
    --greek-bright:#5a9bc2;
    --gold:#c9a24a;
    --radius:14px;
    --touch:48px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #2a241a 0%, var(--stone-dark) 55%),
      var(--stone-dark);
    color:var(--parchment);
    font-family:'EB Garamond', Georgia, serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    width:100%;
    padding:24px 18px 40px;
    flex:1;
    display:flex;
    flex-direction:column;
  }
  header{
    text-align:center;
    margin-bottom:22px;
  }
  h1{
    font-family:'Cinzel', serif;
    font-weight:700;
    letter-spacing:0.06em;
    font-size:clamp(28px,7vw,40px);
    margin:0 0 4px;
    background:linear-gradient(120deg,var(--bronze-bright),var(--gold) 45%,var(--patina-bright));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .tagline{
    font-style:italic;
    color:var(--parchment-dim);
    font-size:15px;
    margin:0;
  }
  .divider{
    width:120px;
    height:2px;
    margin:14px auto 0;
    background:linear-gradient(90deg,transparent,var(--bronze),var(--patina),transparent);
  }

  /* search */
  .search-shell{
    position:relative;
    margin-top:26px;
  }
  form.searchbar{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--stone-panel);
    border:1px solid var(--stone-line);
    border-radius:var(--radius);
    padding:6px 6px 6px 18px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.03), 0 6px 18px rgba(0,0,0,0.35);
  }
  #q{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:var(--parchment);
    font-family:'EB Garamond', serif;
    font-size:19px;
    padding:12px 4px;
    min-width:0;
  }
  #q::placeholder{color:var(--parchment-dim); opacity:0.65;}
  button.go{
    background:linear-gradient(160deg,var(--bronze-bright),var(--bronze));
    border:none;
    color:#1a1510;
    font-family:'Cinzel', serif;
    font-weight:600;
    letter-spacing:0.04em;
    border-radius:10px;
    min-width:var(--touch);
    min-height:var(--touch);
    padding:0 18px;
    font-size:15px;
    cursor:pointer;
  }
  button.go:active{transform:translateY(1px);}

  .suggestions{
    position:absolute;
    left:0; right:0;
    top:calc(100% + 6px);
    background:var(--stone-panel-2);
    border:1px solid var(--stone-line);
    border-radius:var(--radius);
    overflow:hidden;
    z-index:20;
    display:none;
    box-shadow:0 10px 30px rgba(0,0,0,0.5);
  }
  .suggestions.show{display:block;}
  .suggestions button{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    border-bottom:1px solid var(--stone-line);
    color:var(--parchment);
    font-family:'EB Garamond', serif;
    font-size:17px;
    padding:13px 16px;
    min-height:var(--touch);
    cursor:pointer;
  }
  .suggestions button:last-child{border-bottom:none;}
  .suggestions button:active{background:var(--stone-panel);}
  .sugg-badge{
    font-family:'Cinzel', serif;
    font-size:10px;
    letter-spacing:0.06em;
    padding:3px 8px;
    border-radius:20px;
    flex-shrink:0;
  }
  .badge-latijn{background:rgba(194,90,65,0.18); color:var(--latin-bright); border:1px solid rgba(194,90,65,0.4);}
  .badge-grieks{background:rgba(90,155,194,0.18); color:var(--greek-bright); border:1px solid rgba(90,155,194,0.4);}
  .badge-nl{background:rgba(217,163,95,0.18); color:var(--bronze-bright); border:1px solid rgba(217,163,95,0.4);}

  .hint-row{
    display:flex;
    justify-content:center;
    margin-top:14px;
  }
  .discover-btn{
    background:none;
    border:1px solid var(--stone-line);
    color:var(--parchment-dim);
    font-family:'EB Garamond', serif;
    font-style:italic;
    font-size:15px;
    padding:10px 16px;
    min-height:var(--touch);
    border-radius:24px;
    cursor:pointer;
  }
  .discover-btn:active{background:var(--stone-panel);}

  /* result area */
  #result{margin-top:28px;}
  .empty-state{
    text-align:center;
    color:var(--parchment-dim);
    padding:40px 10px;
    font-style:italic;
    line-height:1.6;
  }
  .empty-state b{color:var(--parchment); font-style:normal;}

  .card{
    background:var(--stone-panel);
    border:1px solid var(--stone-line);
    border-radius:var(--radius);
    padding:22px 20px 24px;
    animation:rise 0.35s ease both;
  }
  @keyframes rise{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }
  .card h2{
    font-family:'Cinzel', serif;
    font-size:clamp(24px,6vw,32px);
    margin:0 0 4px;
    color:var(--parchment);
    letter-spacing:0.02em;
  }
  .meaning-line{
    font-size:17px;
    color:var(--parchment-dim);
    margin:2px 0 18px;
  }
  .meaning-line em{color:var(--gold); font-style:normal;}

  .section-label{
    font-family:'Cinzel', serif;
    font-size:12px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--parchment-dim);
    margin:20px 0 10px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .section-label::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--stone-line);
  }

  /* building blocks (tesserae) */
  .blocks{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:stretch;
  }
  .block{
    flex:1 1 160px;
    min-width:160px;
    background:var(--stone-panel-2);
    border:1px solid var(--stone-line);
    border-left:4px solid var(--bronze);
    border-radius:10px;
    padding:12px 14px;
    text-align:left;
    cursor:pointer;
    min-height:var(--touch);
    transition:transform 0.15s ease, border-color 0.15s ease;
    animation:lockin 0.4s ease both;
  }
  .block:active{transform:scale(0.97);}
  .block.taal-grieks{border-left-color:var(--greek-bright);}
  .block.taal-latijn{border-left-color:var(--latin-bright);}
  @keyframes lockin{
    from{opacity:0; transform:translateX(-8px);}
    to{opacity:1; transform:translateX(0);}
  }
  .block .bv{
    font-family:'Cinzel', serif;
    font-size:18px;
    color:var(--parchment);
    display:block;
  }
  .block .bschrift{
    font-family:'Palatino Linotype','Palatino','Noto Serif',serif;
    color:var(--parchment-dim);
    font-size:14px;
  }
  .block .bmeaning{
    color:var(--parchment-dim);
    font-size:14px;
    font-style:italic;
    display:block;
    margin-top:2px;
  }
  .block .bvia{
    display:block;
    margin-top:6px;
    padding-top:6px;
    border-top:1px dashed var(--stone-line);
    color:var(--gold);
    font-size:13px;
    font-style:italic;
  }
  .plus-sep{
    align-self:center;
    color:var(--bronze);
    font-family:'Cinzel', serif;
    font-size:20px;
  }

  /* derived words grid (root view) */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(150px,1fr));
    gap:10px;
  }
  .tile{
    background:var(--stone-panel-2);
    border:1px solid var(--stone-line);
    border-radius:10px;
    padding:12px 14px;
    text-align:left;
    cursor:pointer;
    min-height:var(--touch);
  }
  .tile:active{background:var(--stone-panel);}
  .tile .tw{
    font-family:'Cinzel', serif;
    font-size:16px;
    color:var(--parchment);
    display:block;
  }
  .tile .tm{
    color:var(--parchment-dim);
    font-size:13px;
    font-style:italic;
  }
  .tile .tvia{
    color:var(--gold);
    font-size:11px;
    display:block;
    margin-top:3px;
  }

  .langbadge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:'Cinzel', serif;
    font-size:12px;
    letter-spacing:0.06em;
    padding:5px 12px;
    border-radius:20px;
    margin-bottom:12px;
  }

  .ppp-note{
    background:var(--stone-panel-2);
    border:1px dashed var(--stone-line);
    border-radius:10px;
    padding:10px 14px;
    font-size:14px;
    color:var(--parchment-dim);
    margin-top:2px;
  }
  .ppp-note b{color:var(--gold); font-weight:normal; font-style:italic;}

  .not-found{
    text-align:center;
    padding:20px 10px;
  }
  .not-found p{color:var(--parchment-dim); line-height:1.6;}
  .not-found .chips{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    margin-top:14px;
  }
  .chip{
    background:var(--stone-panel-2);
    border:1px solid var(--stone-line);
    color:var(--parchment);
    font-family:'EB Garamond', serif;
    font-size:15px;
    padding:9px 16px;
    min-height:var(--touch);
    border-radius:22px;
    cursor:pointer;
  }
  .chip:active{background:var(--stone-panel);}

  footer{
    text-align:center;
    padding:22px 10px 10px;
    color:var(--parchment-dim);
    font-size:12px;
    opacity:0.6;
    font-family:'EB Garamond', serif;
    letter-spacing:0.02em;
  }

  @media (prefers-reduced-motion: reduce){
    .card, .block{animation:none;}
  }

  .portal-back{position:fixed;top:10px;left:10px;z-index:9999;display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px;background:rgba(0,0,0,.4);border:1px solid rgba(212,175,55,.35);color:var(--gold);text-decoration:none;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);}
  .portal-back:hover{background:rgba(0,0,0,.65);border-color:rgba(212,175,55,.7);}
  .portal-back svg{width:22px;height:22px;display:block;}
</style>
</head>
<body>
<a class="portal-back" href="../" aria-label="Terug naar portaal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg></a>
<div class="wrap">
  <header>
    <h1>Etymologicon</h1>
    <p class="tagline">van woord naar wortel &mdash; en terug</p>
    <div class="divider"></div>
  </header>

  <div class="search-shell">
    <form class="searchbar" id="searchform" autocomplete="off">
      <input
        id="q"
        type="text"
        inputmode="text"
        autocapitalize="off"
        autocorrect="off"
        spellcheck="false"
        placeholder="Zoek een woord of grondwoord, bv. aquaduct of tele&hellip;"
        aria-label="Zoek een woord of grondwoord">
      <button type="submit" class="go">Zoek</button>
    </form>
    <div class="suggestions" id="suggestions" role="listbox"></div>
  </div>

  <div class="hint-row">
    <button type="button" class="discover-btn" id="discoverBtn">&#10022; verras me met een willekeurig woord</button>
  </div>

  <div id="result">
    <div class="empty-state">
      Typ een <b>Nederlands woord</b> (zoals <b>aquaduct</b>) om te zien uit welke bouwstenen het is opgebouwd,<br>
      of typ een <b>grondwoord</b> (zoals <b>tele</b> of <b>bio</b>) om te zien welke Nederlandse woorden ervan afstammen.
    </div>
  </div>

  <footer>Etymologicon &middot; &copy; Gerben de Jong &middot; 2026</footer>
</div>

<script>
(function(){
  "use strict";
  var DATA = window.ETYM_DATA;
  var ROOTS = DATA.roots;
  var WORDS = DATA.words;

  var rootsById = {};
  ROOTS.forEach(function(r){ rootsById[r.id] = r; });

  // an opbouw-item is either a plain root-id string, or {root, via:"ppp"}
  function itemRootId(item){ return typeof item === "string" ? item : item.root; }
  function itemVia(item){ return typeof item === "string" ? null : item.via; }

  function norm(s){
    return (s || "")
      .toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
      .replace(/[-\s]/g,"")
      .trim();
  }

  WORDS.forEach(function(w){ w._key = norm(w.woord); });
  ROOTS.forEach(function(r){
    r._keys = (r.zoektermen || []).map(norm);
  });

  function levenshtein(a,b){
    var m=a.length, n=b.length;
    if(!m) return n; if(!n) return m;
    var dp = new Array(n+1);
    for(var j=0;j<=n;j++) dp[j]=j;
    for(var i=1;i<=m;i++){
      var prev = dp[0]; dp[0]=i;
      for(j=1;j<=n;j++){
        var tmp = dp[j];
        dp[j] = Math.min(
          dp[j]+1,
          dp[j-1]+1,
          prev + (a[i-1]===b[j-1] ? 0 : 1)
        );
        prev = tmp;
      }
    }
    return dp[n];
  }

  function findExactWord(key){
    return WORDS.find(function(w){ return w._key === key; });
  }
  function findExactRoot(key){
    return ROOTS.find(function(r){ return r._keys.indexOf(key) !== -1; });
  }

  function suggestionsFor(rawQuery, limit){
    var key = norm(rawQuery);
    if(key.length < 2) return [];
    var results = [];
    WORDS.forEach(function(w){
      if(w._key.indexOf(key) !== -1){
        results.push({type:"woord", label:w.woord, dist: w._key.indexOf(key)===0?0:1, ref:w});
      }
    });
    ROOTS.forEach(function(r){
      r._keys.forEach(function(k){
        if(k.indexOf(key) !== -1){
          results.push({type:"root", label:r.vorm, taal:r.taal, dist: k.indexOf(key)===0?0:1, ref:r});
        }
      });
    });
    var seen = {};
    results = results.filter(function(item){
      var id = item.type + ":" + (item.ref.id || item.ref.woord);
      if(seen[id]) return false;
      seen[id] = true;
      return true;
    });
    results.sort(function(a,b){ return a.dist - b.dist || a.label.length - b.label.length; });
    return results.slice(0, limit || 8);
  }

  function closestMatches(rawQuery, limit){
    var key = norm(rawQuery);
    var candidates = [];
    WORDS.forEach(function(w){
      candidates.push({type:"woord", label:w.woord, dist:levenshtein(key,w._key), ref:w});
    });
    ROOTS.forEach(function(r){
      var best = Math.min.apply(null, r._keys.map(function(k){ return levenshtein(key,k); }));
      candidates.push({type:"root", label:r.vorm, taal:r.taal, dist:best, ref:r});
    });
    candidates.sort(function(a,b){ return a.dist - b.dist; });
    return candidates.slice(0, limit || 3);
  }

  var resultEl = document.getElementById("result");
  var qInput = document.getElementById("q");
  var suggBox = document.getElementById("suggestions");

  function renderWord(word){
    var blocksHtml = word.opbouw.map(function(item, idx){
      var rid = itemRootId(item);
      var via = itemVia(item);
      var r = rootsById[rid];
      if(!r) return "";
      var taalCls = r.taal === "Grieks" ? "taal-grieks" : "taal-latijn";
      var schrift = r.schrift ? '<span class="bschrift">' + r.schrift + "</span> &middot; " : "";
      var viaHtml = "";
      if(via === "ppp" && r.ppp){
        viaHtml = '<span class="bvia">via <strong>' + r.ppp.vorm + '</strong> (PPP / volt. deelw. van ' + r.vorm + ')</span>';
      }
      var html = '<button type="button" class="block ' + taalCls + '" data-jump="' + r.id + '" style="animation-delay:' + (idx*0.08) + 's">' +
        '<span class="bv">' + r.vorm + '</span>' +
        '<span class="bmeaning">' + schrift + r.taal + ': ' + r.betekenis + '</span>' +
        viaHtml +
      '</button>';
      return idx > 0 ? '<span class="plus-sep">+</span>' + html : html;
    }).join("");

    resultEl.innerHTML =
      '<div class="card">' +
        '<h2>' + word.woord + '</h2>' +
        '<p class="meaning-line">' + word.betekenis_nl + '</p>' +
        '<div class="section-label">bouwstenen</div>' +
        '<div class="blocks">' + blocksHtml + '</div>' +
        '<div class="section-label">letterlijk</div>' +
        '<p class="meaning-line"><em>' + word.letterlijke_betekenis + '</em></p>' +
      '</div>';

    resultEl.querySelectorAll("[data-jump]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var r = rootsById[btn.getAttribute("data-jump")];
        qInput.value = r.vorm;
        renderRoot(r);
        window.scrollTo({top:0, behavior:"smooth"});
      });
    });
  }

  function renderRoot(root){
    var derived = WORDS.filter(function(w){
      return w.opbouw.some(function(item){ return itemRootId(item) === root.id; });
    });
    var taalCls = root.taal === "Grieks" ? "badge-grieks" : "badge-latijn";
    var schriftLine = root.schrift ? '<p class="meaning-line" style="font-family:\'Palatino Linotype\',\'Palatino\',\'Noto Serif\',serif; font-size:19px;">' + root.schrift + '</p>' : "";
    var pppLine = root.ppp ? '<div class="ppp-note">PPP (voltooid deelwoord): <b>' + root.ppp.vorm + '</b> &mdash; veel afgeleide woorden gebruiken de stam <b>' + root.ppp.stam + '</b> hiervan, niet de praesensstam.</div>' : "";

    var tilesHtml = derived.map(function(w, idx){
      var myItem = w.opbouw.find(function(item){ return itemRootId(item) === root.id; });
      var via = itemVia(myItem);
      var viaTag = (via === "ppp" && root.ppp) ? '<span class="tvia">via ' + root.ppp.vorm + '</span>' : "";
      return '<button type="button" class="tile" data-word="' + w.woord + '" style="animation:lockin 0.35s ease both; animation-delay:' + (idx*0.04) + 's">' +
        '<span class="tw">' + w.woord + '</span>' +
        '<span class="tm">' + w.letterlijke_betekenis.replace(/\s*\(via[^)]*\)/,'') + '</span>' +
        viaTag +
      '</button>';
    }).join("");

    resultEl.innerHTML =
      '<div class="card">' +
        '<span class="langbadge ' + taalCls + '">' + root.taal + (root.stam ? ' &middot; praesensstam ' + root.stam : '') + '</span>' +
        '<h2>' + root.vorm + '</h2>' +
        schriftLine +
        '<p class="meaning-line">betekenis: <em>' + root.betekenis + '</em> (' + root.woordsoort + ')</p>' +
        pppLine +
        '<div class="section-label">Nederlandse woorden hiervan (' + derived.length + ')</div>' +
        (derived.length ? '<div class="grid">' + tilesHtml + '</div>' : '<p class="meaning-line">Nog geen woorden gekoppeld in de database.</p>') +
      '</div>';

    resultEl.querySelectorAll("[data-word]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var w = findExactWord(norm(btn.getAttribute("data-word")));
        qInput.value = w.woord;
        renderWord(w);
        window.scrollTo({top:0, behavior:"smooth"});
      });
    });
  }

  function renderNotFound(query){
    var matches = closestMatches(query, 3);
    var chips = matches.map(function(m){
      return '<button type="button" class="chip" data-suggest="' + m.label + '">' + m.label +
        (m.taal ? ' <span style="opacity:.6; font-size:12px;">(' + m.taal + ')</span>' : '') +
      '</button>';
    }).join("");
    resultEl.innerHTML =
      '<div class="card not-found">' +
        '<p>&ldquo;' + query + '&rdquo; staat nog niet in de database. Bedoelde je misschien&hellip;</p>' +
        '<div class="chips">' + chips + '</div>' +
      '</div>';
    resultEl.querySelectorAll("[data-suggest]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var label = btn.getAttribute("data-suggest");
        qInput.value = label;
        doSearch(label);
      });
    });
  }

  function doSearch(rawQuery){
    hideSuggestions();
    var key = norm(rawQuery);
    if(!key) return;
    var w = findExactWord(key);
    if(w){ renderWord(w); return; }
    var r = findExactRoot(key);
    if(r){ renderRoot(r); return; }
    renderNotFound(rawQuery.trim());
  }

  function hideSuggestions(){
    suggBox.classList.remove("show");
    suggBox.innerHTML = "";
  }

  function showSuggestions(list){
    if(!list.length){ hideSuggestions(); return; }
    suggBox.innerHTML = list.map(function(item){
      var badge = item.type === "root"
        ? '<span class="sugg-badge ' + (item.taal === "Grieks" ? "badge-grieks" : "badge-latijn") + '">' + item.taal + '</span>'
        : '<span class="sugg-badge badge-nl">NL</span>';
      return '<button type="button" role="option" data-pick="' + item.label + '">' +
        '<span>' + item.label + '</span>' + badge +
      '</button>';
    }).join("");
    suggBox.classList.add("show");
    suggBox.querySelectorAll("[data-pick]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var label = btn.getAttribute("data-pick");
        qInput.value = label;
        doSearch(label);
      });
    });
  }

  document.getElementById("searchform").addEventListener("submit", function(e){
    e.preventDefault();
    doSearch(qInput.value);
  });

  qInput.addEventListener("input", function(){
    showSuggestions(suggestionsFor(qInput.value, 8));
  });

  qInput.addEventListener("blur", function(){
    setTimeout(hideSuggestions, 150);
  });

  document.getElementById("discoverBtn").addEventListener("click", function(){
    var pool = Math.random() < 0.5 ? WORDS : ROOTS;
    var pick = pool[Math.floor(Math.random()*pool.length)];
    if(pool === WORDS){
      qInput.value = pick.woord;
      renderWord(pick);
    } else {
      qInput.value = pick.vorm;
      renderRoot(pick);
    }
    hideSuggestions();
    window.scrollTo({top:0, behavior:"smooth"});
  });

})();
</script>
</body>
</html>
